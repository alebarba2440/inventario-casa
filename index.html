<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Inventario">
<title>Inventario</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #1D9E75;
    --accent-dark: #0F6E56;
    --accent-light: #E1F5EE;
    --danger: #E24B4A;
    --bg: #f5f5f0;
    --surface: #ffffff;
    --surface2: #f5f5f0;
    --border: rgba(0,0,0,0.1);
    --border2: rgba(0,0,0,0.18);
    --text: #1a1a1a;
    --text2: #666;
    --radius: 12px;
    --radius-lg: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111;
      --surface: #1c1c1e;
      --surface2: #2c2c2e;
      --border: rgba(255,255,255,0.1);
      --border2: rgba(255,255,255,0.2);
      --text: #f5f5f5;
      --text2: #aaa;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: 'DM Sans', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 430px;
    margin: 0 auto;
    background: var(--bg);
  }

  /* LOGO */
  .logo-bar {
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 20px 12px;
    border-bottom: 0.5px solid var(--border);
    flex-shrink: 0;
  }
  .logo-bar img {
    height: 44px;
    width: auto;
    object-fit: contain;
  }

  /* TABS */
  .tabs {
    display: flex;
    background: var(--surface);
    border-bottom: 0.5px solid var(--border);
    padding-top: env(safe-area-inset-top, 0px);
    flex-shrink: 0;
  }
  .tab {
    flex: 1;
    padding: 14px 12px 12px;
    background: none;
    border: none;
    border-bottom: 2.5px solid transparent;
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 15px;
    font-weight: 500;
    color: var(--text2);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: color 0.15s, border-color 0.15s;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab i { font-size: 20px; }

  /* CONTENT */
  .content {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .panel { display: none; flex-direction: column; gap: 12px; }
  .panel.active { display: flex; }

  /* CARDS */
  .card {
    background: var(--surface);
    border-radius: var(--radius-lg);
    border: 0.5px solid var(--border);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* ACTION BUTTONS */
  .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .action-btn {
    padding: 14px 10px;
    border-radius: var(--radius);
    border: 1.5px solid var(--border);
    background: var(--surface2);
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    color: var(--text2);
    transition: all 0.15s;
  }
  .action-btn i { font-size: 18px; }
  .action-btn.sel-add { border-color: var(--accent); background: var(--accent-light); color: var(--accent-dark); }
  .action-btn.sel-rem { border-color: var(--danger); background: #FCEBEB; color: var(--danger); }

  /* INPUTS */
  .input-label {
    font-size: 12px;
    color: var(--text2);
    font-weight: 500;
    margin-bottom: 4px;
    letter-spacing: 0.3px;
  }
  input[type="text"], input[type="number"] {
    background: var(--surface2);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius);
    padding: 12px 14px;
    font-size: 16px;
    font-family: 'DM Sans', system-ui, sans-serif;
    color: var(--text);
    width: 100%;
    outline: none;
    appearance: none;
    -webkit-appearance: none;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(29,158,117,0.12); }

  /* SUBMIT */
  .submit-btn {
    width: 100%;
    padding: 15px;
    border-radius: var(--radius);
    border: none;
    background: var(--accent);
    color: white;
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.15s;
  }
  .submit-btn:active { transform: scale(0.98); opacity: 0.9; }
  .submit-btn.danger { background: var(--danger); }
  .submit-btn i { font-size: 20px; }

  /* SEARCH */
  .search-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border-radius: var(--radius);
    border: 0.5px solid var(--border);
    padding: 11px 14px;
  }
  .search-wrap i { color: var(--text2); font-size: 20px; flex-shrink: 0; }
  .search-wrap input {
    border: none;
    background: transparent;
    font-size: 16px;
    flex: 1;
    outline: none;
    box-shadow: none;
    padding: 0;
    width: 100%;
  }

  /* INVENTORY LIST */
  .inv-list { display: flex; flex-direction: column; gap: 8px; }
  .inv-item {
    background: var(--surface);
    border-radius: var(--radius);
    border: 0.5px solid var(--border);
    padding: 13px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .item-name {
    flex: 1;
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .qty-controls { display: flex; align-items: center; gap: 5px; }
  .qty-btn {
    width: 32px; height: 32px;
    border-radius: 8px;
    border: 0.5px solid var(--border2);
    background: var(--surface2);
    cursor: pointer;
    font-size: 20px;
    line-height: 1;
    color: var(--text);
    font-family: 'DM Sans', system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.1s;
    -webkit-user-select: none;
    user-select: none;
  }
  .qty-btn:active { background: var(--accent-light); color: var(--accent); }
  .qty-num {
    font-size: 17px;
    font-weight: 700;
    min-width: 32px;
    text-align: center;
    color: var(--text);
  }
  .qty-zero { color: var(--danger) !important; }
  .del-btn {
    width: 32px; height: 32px;
    border-radius: 8px;
    border: none;
    background: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--text2);
    margin-left: 2px;
  }
  .del-btn:active { color: var(--danger); }
  .del-btn i { font-size: 18px; }

  /* EMPTY */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text2);
  }
  .empty i { font-size: 52px; display: block; margin-bottom: 12px; opacity: 0.2; }
  .empty p { font-size: 15px; }

  /* NAV BAR */
  .nav-bar {
    display: flex;
    background: var(--surface);
    border-top: 0.5px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom, 12px);
    flex-shrink: 0;
  }
  .nav-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    background: none;
    border: none;
    cursor: pointer;
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 11px;
    font-weight: 500;
    color: var(--text2);
    padding: 10px 0 4px;
    transition: color 0.15s;
  }
  .nav-btn i { font-size: 24px; }
  .nav-btn.active { color: var(--accent); }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(16px);
    background: #1a1a1a;
    color: white;
    padding: 11px 22px;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 500;
    font-family: 'DM Sans', system-ui, sans-serif;
    z-index: 999;
    opacity: 0;
    transition: all 0.25s;
    white-space: nowrap;
    pointer-events: none;
    max-width: 90vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 100;
    display: flex;
    align-items: flex-end;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal-sheet {
    background: var(--surface);
    border-radius: 22px 22px 0 0;
    padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px));
    width: 100%;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.32,0.72,0,1);
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-height: 88vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .modal-overlay.open .modal-sheet { transform: translateY(0); }
  .modal-handle {
    width: 40px; height: 4px;
    background: var(--border2);
    border-radius: 2px;
    margin: 0 auto 4px;
  }
  .modal-title { font-size: 18px; font-weight: 700; color: var(--text); }

  /* SWATCHES */
  .color-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .swatch {
    width: 38px; height: 38px;
    border-radius: 50%;
    cursor: pointer;
    border: 3px solid transparent;
    transition: all 0.15s;
    outline: none;
  }
  .swatch.sel { border-color: var(--text); transform: scale(1.15); }

  /* FIREBASE INFO */
  textarea {
    background: var(--surface2);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius);
    padding: 11px;
    font-size: 12px;
    font-family: monospace;
    color: var(--text);
    width: 100%;
    height: 90px;
    resize: none;
    outline: none;
  }
  textarea:focus { border-color: var(--accent); }

  .close-btn {
    width: 100%;
    padding: 14px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border2);
    background: var(--surface2);
    color: var(--text);
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
  }
  .close-btn:active { opacity: 0.7; }

  .sync-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--text2);
    padding: 8px 0 0;
  }
  .sync-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--border2);
    flex-shrink: 0;
  }
  .sync-dot.on { background: var(--accent); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
</style>
</head>
<body>

<div class="app">
  <div class="logo-bar"><img src="logo.png" alt="Logo" onerror="this.style.display='none'"></div>
  <div class="tabs">
    <button class="tab active" id="tabC" onclick="switchTab('cargar')">
      <i class="ti ti-stack-2"></i> Cargar
    </button>
    <button class="tab" id="tabI" onclick="switchTab('inventario')">
      <i class="ti ti-list-check"></i> Inventario
    </button>
  </div>

  <div class="content" id="mainContent">

    <div class="panel active" id="panelCargar">
      <div class="card">
        <div class="action-grid">
          <button class="action-btn sel-add" id="btnAdd" onclick="setAction('add')">
            <i class="ti ti-arrow-up"></i> Agregar
          </button>
          <button class="action-btn" id="btnRem" onclick="setAction('remove')">
            <i class="ti ti-arrow-down" style="color:var(--danger)"></i> Consumí
          </button>
        </div>
      </div>

      <div class="card">
        <div>
          <div class="input-label">Nombre del producto</div>
          <input type="text" id="prodName" placeholder="ej: Leche, Arroz..." list="prodSugg" autocomplete="off" autocorrect="off">
          <datalist id="prodSugg"></datalist>
        </div>
        <div>
          <div class="input-label">Cantidad</div>
          <input type="number" id="prodQty" value="1" min="1" step="1" inputmode="numeric">
        </div>
      </div>

      <button class="submit-btn" id="submitBtn" onclick="submit()">
        <i class="ti ti-check"></i>
        <span id="submitLbl">Agregar al inventario</span>
      </button>
    </div>

    <div class="panel" id="panelInventario">
      <div class="search-wrap">
        <i class="ti ti-search"></i>
        <input type="text" placeholder="Buscar..." oninput="render()" id="searchInput" autocorrect="off">
      </div>
      <div class="inv-list" id="invList"></div>
    </div>

  </div>

  <div class="nav-bar">
    <button class="nav-btn active" id="navC" onclick="goTab('cargar')">
      <i class="ti ti-stack-2"></i> Cargar
    </button>
    <button class="nav-btn" id="navI" onclick="goTab('inventario')">
      <i class="ti ti-list-check"></i> Inventario
    </button>
    <button class="nav-btn" id="navS" onclick="openConfig()">
      <i class="ti ti-settings"></i> Config
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="configModal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">Configuración</div>

    <div class="card">
      <div class="input-label" style="font-size:13px;font-weight:600;color:var(--text)">Color de acento</div>
      <div class="color-row" id="colorRow">
        <div class="swatch sel" style="background:#1D9E75" data-c="#1D9E75" data-d="#0F6E56" data-l="#E1F5EE" onclick="setAccent(this)"></div>
        <div class="swatch" style="background:#378ADD" data-c="#378ADD" data-d="#185FA5" data-l="#E6F1FB" onclick="setAccent(this)"></div>
        <div class="swatch" style="background:#D4537E" data-c="#D4537E" data-d="#993556" data-l="#FBEAF0" onclick="setAccent(this)"></div>
        <div class="swatch" style="background:#BA7517" data-c="#BA7517" data-d="#854F0B" data-l="#FAEEDA" onclick="setAccent(this)"></div>
        <div class="swatch" style="background:#7F77DD" data-c="#7F77DD" data-d="#534AB7" data-l="#EEEDFE" onclick="setAccent(this)"></div>
        <div class="swatch" style="background:#D85A30" data-c="#D85A30" data-d="#993C1D" data-l="#FAECE7" onclick="setAccent(this)"></div>
      </div>
    </div>

    <div class="card">
      <div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px">Sincronización Firebase</div>
      <textarea id="fbCfg" placeholder='{"apiKey":"...","projectId":"..."}'></textarea>
      <button class="submit-btn" onclick="connectFb()">
        <i class="ti ti-cloud-upload"></i> Conectar Firebase
      </button>
      <div class="sync-status">
        <div class="sync-dot" id="syncDot"></div>
        <span id="syncLabel">Sin sincronización — solo local</span>
      </div>
    </div>

    <div class="card">
      <button class="submit-btn" style="background:var(--surface2);color:var(--text);border:0.5px solid var(--border2);" onclick="exportData()">
        <i class="ti ti-download"></i> Exportar datos JSON
      </button>
    </div>

    <button class="close-btn" onclick="closeConfig()">Cerrar</button>
  </div>
</div>

<script>
  let inv = JSON.parse(localStorage.getItem('inv_v2') || '[]');
  let cfg = JSON.parse(localStorage.getItem('cfg_v2') || '{"accent":"#1D9E75","accentD":"#0F6E56","accentL":"#E1F5EE"}');
  let action = 'add';
  let db = null, fbOn = false;

  function applyAccent() {
    document.documentElement.style.setProperty('--accent', cfg.accent);
    document.documentElement.style.setProperty('--accent-dark', cfg.accentD);
    document.documentElement.style.setProperty('--accent-light', cfg.accentL);
  }

  function switchTab(t) {
    const isC = t === 'cargar';
    document.getElementById('tabC').classList.toggle('active', isC);
    document.getElementById('tabI').classList.toggle('active', !isC);
    document.getElementById('panelCargar').classList.toggle('active', isC);
    document.getElementById('panelInventario').classList.toggle('active', !isC);
    document.getElementById('mainContent').scrollTop = 0;
    if (!isC) render();
  }

  function goTab(t) {
    switchTab(t);
    document.getElementById('navC').classList.toggle('active', t === 'cargar');
    document.getElementById('navI').classList.toggle('active', t === 'inventario');
  }

  function setAction(a) {
    action = a;
    document.getElementById('btnAdd').className = 'action-btn' + (a === 'add' ? ' sel-add' : '');
    document.getElementById('btnRem').className = 'action-btn' + (a === 'remove' ? ' sel-rem' : '');
    document.getElementById('btnAdd').innerHTML = '<i class="ti ti-arrow-up"></i> Agregar';
    document.getElementById('btnRem').innerHTML = '<i class="ti ti-arrow-down" style="color:var(--danger)"></i> Consumí';
    document.getElementById('submitBtn').className = 'submit-btn' + (a === 'remove' ? ' danger' : '');
    document.getElementById('submitLbl').textContent = a === 'add' ? 'Agregar al inventario' : 'Registrar consumo';
  }

  function submit() {
    const name = document.getElementById('prodName').value.trim();
    const qty = parseInt(document.getElementById('prodQty').value) || 1;
    if (!name) { toast('Ingresá el nombre del producto'); return; }

    let item = inv.find(i => i.n.toLowerCase() === name.toLowerCase());
    if (action === 'add') {
      if (item) { item.q += qty; }
      else { inv.push({ id: Date.now().toString(), n: name, q: qty }); }
      toast('✅ ' + name + ' +' + qty);
    } else {
      if (!item) { toast('Producto no encontrado'); return; }
      if (item.q < qty) { toast('Sin suficiente stock'); return; }
      item.q -= qty;
      toast('📉 ' + name + ' −' + qty);
    }
    save();
    document.getElementById('prodName').value = '';
    document.getElementById('prodQty').value = 1;
    updateSugg();
  }

  function render() {
    const q = (document.getElementById('searchInput').value || '').toLowerCase();
    const filtered = q ? inv.filter(i => i.n.toLowerCase().includes(q)) : [...inv];
    const list = document.getElementById('invList');
    if (!filtered.length) {
      list.innerHTML = '<div class="empty"><i class="ti ti-packages"></i><p>Sin productos cargados</p></div>';
      return;
    }
    list.innerHTML = filtered.map(item =>
      `<div class="inv-item">
        <span class="item-name">${item.n}</span>
        <div class="qty-controls">
          <button class="qty-btn" onclick="adj('${item.id}',-1)">−</button>
          <span class="qty-num${item.q === 0 ? ' qty-zero' : ''}">${item.q}</span>
          <button class="qty-btn" onclick="adj('${item.id}',1)">+</button>
        </div>
        <button class="del-btn" onclick="del('${item.id}')" aria-label="Eliminar">
          <i class="ti ti-trash"></i>
        </button>
      </div>`
    ).join('');
  }

  function adj(id, d) {
    const item = inv.find(i => i.id === id);
    if (!item) return;
    item.q = Math.max(0, item.q + d);
    save(); render();
  }

  function del(id) {
    inv = inv.filter(i => i.id !== id);
    save(); render(); toast('Eliminado');
  }

  function save() {
    localStorage.setItem('inv_v2', JSON.stringify(inv));
    if (db && fbOn) syncFb();
  }

  function updateSugg() {
    document.getElementById('prodSugg').innerHTML = inv.map(i => `<option value="${i.n}">`).join('');
  }

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  function openConfig() {
    if (cfg.fbCfg) document.getElementById('fbCfg').value = cfg.fbCfg;
    document.querySelectorAll('.swatch').forEach(s => s.classList.toggle('sel', s.dataset.c === cfg.accent));
    document.getElementById('syncDot').className = 'sync-dot' + (fbOn ? ' on' : '');
    document.getElementById('syncLabel').textContent = fbOn ? 'Conectado a Firebase ✓' : 'Sin sincronización — solo local';
    document.getElementById('configModal').classList.add('open');
  }

  function closeConfig() {
    document.getElementById('configModal').classList.remove('open');
  }

  function setAccent(el) {
    cfg.accent = el.dataset.c;
    cfg.accentD = el.dataset.d;
    cfg.accentL = el.dataset.l;
    applyAccent();
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('sel'));
    el.classList.add('sel');
    localStorage.setItem('cfg_v2', JSON.stringify(cfg));
  }

  function connectFb() {
    const str = document.getElementById('fbCfg').value.trim();
    if (!str) { toast('Pegá tu config de Firebase'); return; }
    try {
      const parsed = JSON.parse(str);
      cfg.fbCfg = str;
      localStorage.setItem('cfg_v2', JSON.stringify(cfg));
      loadFb(parsed);
    } catch(e) { toast('JSON inválido, revisá el formato'); }
  }

  function loadFb(parsed) {
    if (typeof firebase !== 'undefined') { initFb(parsed); return; }
    let loaded = 0;
    const scripts = [
      'https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js',
      'https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js'
    ];
    scripts.forEach(src => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = () => { if (++loaded === 2) initFb(parsed); };
      document.head.appendChild(s);
    });
  }

  function initFb(parsed) {
    try {
      if (!firebase.apps.length) firebase.initializeApp(parsed);
      db = firebase.firestore();
      fbOn = true;
      document.getElementById('syncDot').className = 'sync-dot on';
      document.getElementById('syncLabel').textContent = 'Conectado a Firebase ✓';
      toast('🔥 Firebase conectado');
      db.collection('inv').onSnapshot(snap => {
        inv = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        localStorage.setItem('inv_v2', JSON.stringify(inv));
        render();
        updateSugg();
      });
      closeConfig();
    } catch(e) { toast('Error: ' + e.message); }
  }

  function syncFb() {
    const batch = db.batch();
    db.collection('inv').get().then(snap => {
      snap.docs.forEach(d => batch.delete(d.ref));
      inv.forEach(item => batch.set(db.collection('inv').doc(item.id), { n: item.n, q: item.q }));
      batch.commit();
    });
  }

  function exportData() {
    const blob = new Blob([JSON.stringify(inv, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'inventario.json';
    a.click();
    toast('📥 Exportado');
  }

  applyAccent();
  updateSugg();
</script>
</body>
</html>
