<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nuestras apps">
<meta name="theme-color" content="#1D9E75">
<link rel="apple-touch-icon" href="img/apple-touch.png">
<link rel="icon" type="image/png" href="logo3.png">
<title>Nuestras apps</title>
<link rel="preload" as="image" href="img/inventario.webp">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--accent:#1D9E75;--accent-dark:#0F6E56;--accent-light:#E1F5EE;--bg:#f5f5f0;--surface:#fff;--border:rgba(0,0,0,.08);--text:#1a1a1a;--text2:#666}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--surface:#1c1c1e;--border:rgba(255,255,255,.1);--text:#f5f5f5;--text2:#aaa;--accent-light:#173a30}}
  :root[data-theme="dark"]{--bg:#111;--surface:#1c1c1e;--border:rgba(255,255,255,.1);--text:#f5f5f5;--text2:#aaa;--accent-light:#173a30}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;
       padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
  .wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
  header{margin-bottom:4px}
  h1{font-size:1.7rem;font-weight:700;color:var(--accent)}
  p.sub{color:var(--text2);font-size:.95rem;margin-top:2px}

  a.card{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--border);
         border-radius:20px;padding:12px 16px 12px 12px;text-decoration:none;color:var(--text);
         box-shadow:0 1px 2px rgba(0,0,0,.04);transition:transform .12s ease, box-shadow .12s ease}
  a.card:hover{box-shadow:0 6px 18px rgba(0,0,0,.08)}
  a.card:active{transform:scale(.98)}
  a.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .pic{width:118px;height:132px;flex-shrink:0;border-radius:16px;background:var(--accent-light);
       display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
  .pic img{max-width:100%;max-height:100%;object-fit:contain;display:block;padding-top:6px}
  .txt{flex:1;min-width:0}
  .txt b{display:block;font-size:1.2rem;font-weight:700}
  .txt span{display:block;font-size:.88rem;color:var(--text2);margin-top:3px;line-height:1.3}
  .go{color:var(--accent);font-size:1.6rem;line-height:1;flex-shrink:0}

  @media (min-width:760px){
    .wrap{max-width:900px}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    a.card{flex-direction:column;text-align:center;padding:14px 14px 18px}
    .pic{width:100%;height:220px}
    .go{display:none}
  }
  @media (max-width:759px){.grid{display:flex;flex-direction:column;gap:14px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Nuestras apps</h1>
    <p class="sub">Tocá una para entrar</p>
  </header>
  <nav class="grid">
    <a class="card" href="inventario.html">
      <div class="pic"><img src="img/inventario.webp" alt="" width="520" height="513"></div>
      <div class="txt"><b>Inventario</b><span>Escáner, stock y categorías</span></div>
      <div class="go" aria-hidden="true">›</div>
    </a>
    <a class="card" href="ahorros.html">
      <div class="pic"><img src="img/ahorros.webp" alt="" width="390" height="520"></div>
      <div class="txt"><b>Ahorros</b><span>Plata por mes, de a dos</span></div>
      <div class="go" aria-hidden="true">›</div>
    </a>
    <a class="card" href="vacaciones.html">
      <div class="pic"><img src="img/vacaciones.webp" alt="" width="399" height="520"></div>
      <div class="txt"><b>Vacaciones</b><span>Presupuesto, gastos y ruta</span></div>
      <div class="go" aria-hidden="true">›</div>
    </a>
  </nav>
</div>
<script>
  // Mismo color y tema que eligieron dentro del Inventario
  try{
    const c=JSON.parse(localStorage.getItem('cfg_v2')||'{}'), r=document.documentElement;
    if(c.accent){r.style.setProperty('--accent',c.accent);if(c.accentD)r.style.setProperty('--accent-dark',c.accentD);if(c.accentL)r.style.setProperty('--accent-light',c.accentL);}
    if(c.theme&&c.theme!=='auto')r.setAttribute('data-theme',c.theme);
  }catch(e){}
</script>
</body>
</html>
