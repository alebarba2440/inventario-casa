
<style>
  :root {
    --accent: #1D9E75;
    --accent-dark: #0F6E56;
    --accent-light: #E1F5EE;
    --danger: #E24B4A;
    --font: 'DM Sans', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  .frame {
    max-width: 390px;
    margin: 0 auto;
    background: var(--color-background-secondary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .tabs {
    display: flex;
    background: var(--color-background-primary);
    border-bottom: 0.5px solid var(--color-border-tertiary);
    position: sticky;
    top: 0;
    z-index: 10;
    padding-top: 12px;
  }
  .tab {
    flex: 1;
    padding: 12px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    font-family: var(--font);
    font-size: 15px;
    font-weight: 500;
    color: var(--color-text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.15s;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .content { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px; }

  .panel { display: none; flex-direction: column; gap: 12px; }
  .panel.active { display: flex; }

  .card {
    background: var(--color-background-primary);
    border-radius: 16px;
    border: 0.5px solid var(--color-border-tertiary);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .action-btn {
    padding: 14px 10px;
    border-radius: 12px;
    border: 1.5px solid var(--color-border-tertiary);
    background: var(--color-background-secondary);
    font-family: var(--font);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    color: var(--color-text-secondary);
    transition: all 0.15s;
  }
  .action-btn.sel-add { border-color: var(--accent); background: var(--accent-light); color: var(--accent-dark); }
  .action-btn.sel-rem { border-color: var(--danger); background: #FCEBEB; color: var(--danger); }

  .input-label { font-size: 12px; color: var(--color-text-secondary); font-weight: 500; margin-bottom: 4px; letter-spacing: 0.3px; }
  input[type="text"], input[type="number"] {
    background: var(--color-background-secondary);
    border: 0.5px solid var(--color-border-secondary);
    border-radius: 10px;
    padding: 11px 12px;
    font-size: 15px;
    font-family: var(--font);
    color: var(--color-text-primary);
    width: 100%;
    outline: none;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(29,158,117,0.1); }

  .submit-btn {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: var(--accent);
    color: white;
    font-family: var(--font);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.15s;
  }
  .submit-btn:active { transform: scale(0.98); }
  .submit-btn.danger { background: var(--danger); }

  .search-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--color-background-primary);
    border-radius: 12px;
    border: 0.5px solid var(--color-border-tertiary);
    padding: 10px 12px;
  }
  .search-wrap i { color: var(--color-text-secondary); font-size: 18px; flex-shrink: 0; }
  .search-wrap input {
    border: none;
    background: transparent;
    font-size: 15px;
    flex: 1;
    outline: none;
    box-shadow: none;
    padding: 0;
    width: 100%;
  }

  .inv-list { display: flex; flex-direction: column; gap: 8px; }
  .inv-item {
    background: var(--color-background-primary);
    border-radius: 12px;
    border: 0.5px solid var(--color-border-tertiary);
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .item-name {
    flex: 1;
    font-size: 15px;
    font-weight: 500;
    color: var(--color-text-primary);
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .qty-controls { display: flex; align-items: center; gap: 4px; }
  .qty-btn {
    width: 30px; height: 30px;
    border-radius: 8px;
    border: 0.5px solid var(--color-border-secondary);
    background: var(--color-background-secondary);
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    color: var(--color-text-primary);
    font-family: var(--font);
    display: flex; align-items: center; justify-content: center;
    transition: all 0.1s;
  }
  .qty-btn:active { background: var(--accent-light); color: var(--accent); }
  .qty-num {
    font-size: 16px;
    font-weight: 700;
    min-width: 30px;
    text-align: center;
    color: var(--color-text-primary);
  }
  .qty-zero { color: var(--danger) !important; }
  .del-btn {
    width: 30px; height: 30px;
    border-radius: 8px;
    border: none;
    background: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--color-text-secondary);
    margin-left: 2px;
  }
  .del-btn:active { color: var(--danger); }

  .empty {
    text-align: center;
    padding: 48px 20px;
    color: var(--color-text-secondary);
  }
  .empty i { font-size: 44px; display: block; margin-bottom: 10px; opacity: 0.25; }
  .empty p { font-size: 14px; }

  .nav-bar {
    display: flex;
    background: var(--color-background-primary);
    border-top: 0.5px solid var(--color-border-tertiary);
    padding: 8px 0 20px;
    position: sticky;
    bottom: 0;
  }
  .nav-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    background: none;
    border: none;
    cursor: pointer;
    font-family: var(--font);
    font-size: 11px;
    font-weight: 500;
    color: var(--color-text-secondary);
    padding: 6px 0;
    transition: color 0.15s;
  }
  .nav-btn i { font-size: 22px; }
  .nav-btn.active { color: var(--accent); }

  .toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #2C2C2A;
    color: white;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    font-family: var(--font);
    z-index: 100;
    opacity: 0;
    transition: all 0.25s;
    white-space: nowrap;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 50;
    display: flex;
    align-items: flex-end;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal-sheet {
    background: var(--color-background-primary);
    border-radius: 20px 20px 0 0;
    padding: 20px;
    width: 100%;
    transform: translateY(100%);
    transition: transform 0.3s;
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-height: 85vh;
    overflow-y: auto;
  }
  .modal-overlay.open .modal-sheet { transform: translateY(0); }
  .modal-handle { width: 36px; height: 4px; background: var(--color-border-secondary); border-radius: 2px; margin: 0 auto 4px; }
  .modal-title { font-size: 17px; font-weight: 700; color: var(--color-text-primary); }

  .color-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .swatch {
    width: 36px; height: 36px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.15s;
  }
  .swatch.sel { border-color: var(--color-text-primary); transform: scale(1.18); }

  .fb-info {
    background: #E6F1FB;
    border: 0.5px solid #B5D4F4;
    border-radius: 10px;
    padding: 12px;
    font-size: 13px;
    color: #0C447C;
    line-height: 1.6;
  }
  .fb-info code { background: rgba(24,95,165,0.12); border-radius: 4px; padding: 1px 5px; font-size: 12px; }

  .close-btn {
    width: 100%;
    padding: 13px;
    border-radius: 12px;
    border: 0.5px solid var(--color-border-secondary);
    background: var(--color-background-secondary);
    color: var(--color-text-primary);
    font-family: var(--font);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
  }

  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');
</style>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

<div class="frame">
  <div class="tabs">
    <button class="tab active" id="tabC" onclick="switchTab('cargar')">
      <i class="ti ti-stack-2" aria-hidden="true"></i> Cargar
    </button>
    <button class="tab" id="tabI" onclick="switchTab('inventario')">
      <i class="ti ti-list-check" aria-hidden="true"></i> Inventario
    </button>
  </div>

  <div class="content">

    <div class="panel active" id="panelCargar">
      <div class="card">
        <div class="action-grid">
          <button class="action-btn sel-add" id="btnAdd" onclick="setAction('add')">
            <i class="ti ti-arrow-up"></i> Agregar
          </button>
          <button class="action-btn" id="btnRem" onclick="setAction('remove')">
            <i class="ti ti-arrow-down" style="color:var(--danger)"></i> Consumí
          </button>
        </div>
      </div>

      <div class="card">
        <div>
          <div class="input-label">Nombre del producto</div>
          <input type="text" id="prodName" placeholder="ej: Leche, Arroz..." list="prodSugg" autocomplete="off">
          <datalist id="prodSugg"></datalist>
        </div>
        <div>
          <div class="input-label">Cantidad</div>
          <input type="number" id="prodQty" value="1" min="1" step="1">
        </div>
      </div>

      <button class="submit-btn" id="submitBtn" onclick="submit()">
        <i class="ti ti-check"></i> <span id="submitLbl">Agregar al inventario</span>
      </button>
    </div>

    <div class="panel" id="panelInventario">
      <div class="search-wrap">
        <i class="ti ti-search" aria-hidden="true"></i>
        <input type="text" placeholder="Buscar..." oninput="render()" id="searchInput">
      </div>
      <div class="inv-list" id="invList"></div>
    </div>

  </div>

  <div class="nav-bar">
    <button class="nav-btn active" id="navC" onclick="goTab('cargar')">
      <i class="ti ti-stack-2" aria-hidden="true"></i> Cargar
    </button>
    <button class="nav-btn" id="navI" onclick="goTab('inventario')">
      <i class="ti ti-list-check" aria-hidden="true"></i> Inventario
    </button>
    <button class="nav-btn" id="navS" onclick="openConfig()">
      <i class="ti ti-settings" aria-hidden="true"></i> Config
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="configModal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">Configuración</div>

    <div class="card">
      <div class="input-label">Color de acento</div>
      <div class="color-row" id="colorRow">
        <div class="swatch sel" style="background:#1D9E75" data-c="#1D9E75" data-d="#0F6E56" data-l="#E1F5EE" onclick="setAccent(this)"></div>
        <div class="swatch" style="background:#378ADD" data-c="#378ADD" data-d="#185FA5" data-l="#E6F1FB" onclick="setAccent(this)"></div>
        <div class="swatch" style="background:#D4537E" data-c="#D4537E" data-d="#993556" data-l="#FBEAF0" onclick="setAccent(this)"></div>
        <div class="swatch" style="background:#BA7517" data-c="#BA7517" data-d="#854F0B" data-l="#FAEEDA" onclick="setAccent(this)"></div>
        <div class="swatch" style="background:#7F77DD" data-c="#7F77DD" data-d="#534AB7" data-l="#EEEDFE" onclick="setAccent(this)"></div>
        <div class="swatch" style="background:#D85A30" data-c="#D85A30" data-d="#993C1D" data-l="#FAECE7" onclick="setAccent(this)"></div>
      </div>
    </div>

    <div class="card">
      <div class="input-label">Nombre de la app</div>
      <input type="text" id="appNameIn" placeholder="Mi Despensa" value="Mi Despensa">
      <button class="submit-btn" onclick="saveName()"><i class="ti ti-device-floppy"></i> Guardar</button>
    </div>

    <div class="card">
      <div class="input-label" style="font-size:13px;font-weight:600;color:var(--color-text-primary);margin-bottom:8px">Sincronización Firebase</div>
      <div class="fb-info">
        Para sincronizar 2 celulares:<br>
        1. Creá un proyecto en <strong>firebase.google.com</strong><br>
        2. Activá Firestore Database (modo test)<br>
        3. Copiá tu <code>firebaseConfig</code> y pegala abajo
      </div>
      <textarea id="fbCfg" style="background:var(--color-background-secondary);border:0.5px solid var(--color-border-secondary);border-radius:10px;padding:10px;font-size:12px;font-family:monospace;color:var(--color-text-primary);width:100%;height:90px;resize:none;outline:none;" placeholder='{"apiKey":"...","projectId":"..."}'></textarea>
      <button class="submit-btn" onclick="connectFb()"><i class="ti ti-cloud-upload"></i> Conectar Firebase</button>
      <button class="submit-btn" style="background:var(--color-background-secondary);color:var(--color-text-primary);border:0.5px solid var(--color-border-secondary);" onclick="exportData()"><i class="ti ti-download"></i> Exportar JSON</button>
    </div>

    <button class="close-btn" onclick="closeConfig()">Cerrar</button>
  </div>
</div>

<script>
let inv = JSON.parse(localStorage.getItem('inv2') || '[]');
let cfg = JSON.parse(localStorage.getItem('cfg2') || '{"accent":"#1D9E75","accentD":"#0F6E56","accentL":"#E1F5EE","name":"Mi Despensa"}');
let action = 'add';
let db = null, fbOn = false;

function applyAccent() {
  document.documentElement.style.setProperty('--accent', cfg.accent);
  document.documentElement.style.setProperty('--accent-dark', cfg.accentD);
  document.documentElement.style.setProperty('--accent-light', cfg.accentL);
}

function switchTab(t) {
  ['C','I'].forEach(x => {
    document.getElementById('tab'+x).classList.remove('active');
    document.getElementById('nav'+x).classList.remove('active');
    document.getElementById('panel'+(x==='C'?'Cargar':'Inventario')).classList.remove('active');
  });
  const isC = t==='cargar';
  document.getElementById('tab'+(isC?'C':'I')).classList.add('active');
  document.getElementById('nav'+(isC?'C':'I')).classList.add('active');
  document.getElementById('panel'+(isC?'Cargar':'Inventario')).classList.add('active');
  if (!isC) render();
}

function goTab(t) { switchTab(t); }

function setAction(a) {
  action = a;
  document.getElementById('btnAdd').className = 'action-btn' + (a==='add'?' sel-add':'');
  document.getElementById('btnRem').className = 'action-btn' + (a==='remove'?' sel-rem':'');
  document.getElementById('btnAdd').innerHTML = '<i class="ti ti-arrow-up"></i> Agregar';
  document.getElementById('btnRem').innerHTML = '<i class="ti ti-arrow-down" style="color:var(--danger)"></i> Consumí';
  document.getElementById('submitBtn').className = 'submit-btn' + (a==='remove'?' danger':'');
  document.getElementById('submitLbl').textContent = a==='add' ? 'Agregar al inventario' : 'Registrar consumo';
}

function submit() {
  const name = document.getElementById('prodName').value.trim();
  const qty = parseInt(document.getElementById('prodQty').value) || 1;
  if (!name) { toast('Ingresá el nombre'); return; }
  let item = inv.find(i => i.n.toLowerCase() === name.toLowerCase());
  if (action === 'add') {
    if (item) item.q += qty;
    else inv.push({ id: Date.now().toString(), n: name, q: qty });
    toast('✅ ' + name + ' +' + qty);
  } else {
    if (!item) { toast('Producto no encontrado'); return; }
    if (item.q < qty) { toast('Sin suficiente stock'); return; }
    item.q -= qty;
    toast('📉 ' + name + ' −' + qty);
  }
  save();
  document.getElementById('prodName').value = '';
  document.getElementById('prodQty').value = 1;
  updateSugg();
}

function render() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = q ? inv.filter(i => i.n.toLowerCase().includes(q)) : [...inv];
  const list = document.getElementById('invList');
  if (!filtered.length) {
    list.innerHTML = '<div class="empty"><i class="ti ti-packages"></i><p>Sin productos</p></div>';
    return;
  }
  list.innerHTML = filtered.map(item =>
    `<div class="inv-item">
      <span class="item-name">${item.n}</span>
      <div class="qty-controls">
        <button class="qty-btn" onclick="adj('${item.id}',-1)">−</button>
        <span class="qty-num${item.q===0?' qty-zero':''}">${item.q}</span>
        <button class="qty-btn" onclick="adj('${item.id}',1)">+</button>
      </div>
      <button class="del-btn" onclick="del('${item.id}')" aria-label="Eliminar"><i class="ti ti-trash" style="font-size:16px"></i></button>
    </div>`
  ).join('');
}

function adj(id, d) {
  const item = inv.find(i => i.id===id);
  if (!item) return;
  item.q = Math.max(0, item.q + d);
  save(); render();
}

function del(id) {
  inv = inv.filter(i => i.id!==id);
  save(); render(); toast('Eliminado');
}

function save() {
  localStorage.setItem('inv2', JSON.stringify(inv));
  if (db && fbOn) syncFb();
}

function updateSugg() {
  document.getElementById('prodSugg').innerHTML = inv.map(i => `<option value="${i.n}">`).join('');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function openConfig() {
  document.getElementById('appNameIn').value = cfg.name || 'Mi Despensa';
  if (cfg.fbCfg) document.getElementById('fbCfg').value = cfg.fbCfg;
  document.querySelectorAll('.swatch').forEach(s => s.classList.toggle('sel', s.dataset.c===cfg.accent));
  document.getElementById('configModal').classList.add('open');
}
function closeConfig() { document.getElementById('configModal').classList.remove('open'); }

function setAccent(el) {
  cfg.accent = el.dataset.c; cfg.accentD = el.dataset.d; cfg.accentL = el.dataset.l;
  applyAccent();
  document.querySelectorAll('.swatch').forEach(s => s.classList.remove('sel'));
  el.classList.add('sel');
  localStorage.setItem('cfg2', JSON.stringify(cfg));
}

function saveName() {
  cfg.name = document.getElementById('appNameIn').value || 'Mi Despensa';
  localStorage.setItem('cfg2', JSON.stringify(cfg));
  toast('✅ Nombre guardado');
}

function connectFb() {
  const str = document.getElementById('fbCfg').value.trim();
  if (!str) { toast('Pegá tu config de Firebase'); return; }
  try {
    const parsed = JSON.parse(str);
    cfg.fbCfg = str;
    localStorage.setItem('cfg2', JSON.stringify(cfg));
    loadFb(parsed);
  } catch(e) { toast('JSON inválido'); }
}

function loadFb(parsed) {
  if (typeof firebase !== 'undefined') { initFb(parsed); return; }
  let loaded = 0;
  ['https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js',
   'https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js'].forEach(src => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => { if (++loaded===2) initFb(parsed); };
    document.head.appendChild(s);
  });
}

function initFb(parsed) {
  try {
    if (!firebase.apps.length) firebase.initializeApp(parsed);
    db = firebase.firestore(); fbOn = true;
    toast('🔥 Firebase conectado');
    db.collection('inv').onSnapshot(snap => {
      inv = snap.docs.map(d => ({id:d.id,...d.data()}));
      localStorage.setItem('inv2', JSON.stringify(inv));
      render(); updateSugg();
    });
    closeConfig();
  } catch(e) { toast('Error: ' + e.message); }
}

function syncFb() {
  const batch = db.batch();
  db.collection('inv').get().then(snap => {
    snap.docs.forEach(d => batch.delete(d.ref));
    inv.forEach(item => batch.set(db.collection('inv').doc(item.id), {n:item.n, q:item.q}));
    batch.commit();
  });
}

function exportData() {
  const blob = new Blob([JSON.stringify(inv,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'inventario.json'; a.click();
  toast('📥 Exportado');
}

applyAccent();
updateSugg();
</script>
