<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Inventario">
<link rel="apple-touch-icon" href="logo.png">
<link rel="icon" type="image/png" href="logo.png">
<title>Inventario</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #1D9E75;
    --accent-dark: #0F6E56;
    --accent-light: #E1F5EE;
    --danger: #E24B4A;
    --bg: #f5f5f0;
    --surface: #ffffff;
    --surface2: #f5f5f0;
    --border: rgba(0,0,0,0.1);
    --border2: rgba(0,0,0,0.18);
    --text: #1a1a1a;
    --text2: #666;
    --radius: 12px;
    --radius-lg: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111;
      --surface: #1c1c1e;
      --surface2: #2c2c2e;
      --border: rgba(255,255,255,0.1);
      --border2: rgba(255,255,255,0.2);
      --text: #f5f5f5;
      --text2: #aaa;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: 'DM Sans', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }
.bg-watermark {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    width: 500px;
    opacity: 0.08;
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
    z-index: 9999;
}
  .nav-watermark {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    width: 500px;
    opacity: 0.08;
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
    z-index: 9999;
}
  .app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 430px;
    margin: 0 auto;
    background: var(--bg);
    position: relative;
    z-index: 1;  /* ← esto hace que todo dentro del .app esté por encima del logo */
}

  /* TABS */
  .tabs {
    display: flex;
    background: var(--surface);
    border-bottom: 0.5px solid var(--border);
    padding-top: env(safe-area-inset-top, 0px);
    flex-shrink: 0;
  }
  .tab {
    flex: 1;
    padding: 14px 12px 12px;
    background: none;
    border: none;
    border-bottom: 2.5px solid transparent;
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 15px;
    font-weight: 500;
    color: var(--text2);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: color 0.15s, border-color 0.15s;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab i { font-size: 20px; }

  /* CONTENT */
  .content {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .panel { display: none; flex-direction: column; gap: 12px; }
  .panel.active { display: flex; }

  /* CARDS */
  .card {
    background: var(--surface);
    border-radius: var(--radius-lg);
    border: 0.5px solid var(--border);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* ACTION BUTTONS */
  .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .action-btn {
    padding: 14px 10px;
    border-radius: var(--radius);
    border: 1.5px solid var(--border);
    background: var(--surface2);
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    color: var(--text2);
    transition: all 0.15s;
  }
  .action-btn i { font-size: 18px; }
  .action-btn.sel-add { border-color: var(--accent); background: var(--accent-light); color: var(--accent-dark); }
  .action-btn.sel-rem { border-color: var(--danger); background: #FCEBEB; color: var(--danger); }

  /* INPUTS */
  .input-label {
    font-size: 12px;
    color: var(--text2);
    font-weight: 500;
    margin-bottom: 4px;
    letter-spacing: 0.3px;
  }
  input[type="text"], input[type="number"] {
    background: var(--surface2);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius);
    padding: 12px 14px;
    font-size: 16px;
    font-family: 'DM Sans', system-ui, sans-serif;
    color: var(--text);
    width: 100%;
    outline: none;
    appearance: none;
    -webkit-appearance: none;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(29,158,117,0.12); }

  /* SUBMIT */
  .submit-btn {
    width: 100%;
    padding: 15px;
    border-radius: var(--radius);
    border: none;
    background: var(--accent);
    color: white;
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.15s;
  }
  .submit-btn:active { transform: scale(0.98); opacity: 0.9; }
  .submit-btn.danger { background: var(--danger); }
  .submit-btn i { font-size: 20px; }

  /* SEARCH */
  .search-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border-radius: var(--radius);
    border: 0.5px solid var(--border);
    padding: 11px 14px;
  }
  .search-wrap i { color: var(--text2); font-size: 20px; flex-shrink: 0; }
  .search-wrap input {
    border: none;
    background: transparent;
    font-size: 16px;
    flex: 1;
    outline: none;
    box-shadow: none;
    padding: 0;
    width: 100%;
  }

  /* INVENTORY LIST */
  .inv-list { display: flex; flex-direction: column; gap: 8px; }
  .inv-item {
    background: var(--surface);
    border-radius: var(--radius);
    border: 0.5px solid var(--border);
    padding: 13px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .item-name {
    flex: 1;
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .qty-controls { display: flex; align-items: center; gap: 5px; }
  .qty-btn {
    width: 32px; height: 32px;
    border-radius: 8px;
    border: 0.5px solid var(--border2);
    background: var(--surface2);
    cursor: pointer;
    font-size: 20px;
    line-height: 1;
    color: var(--text);
    font-family: 'DM Sans', system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.1s;
    -webkit-user-select: none;
    user-select: none;
  }
  .qty-btn:active { background: var(--accent-light); color: var(--accent); }
  .qty-num {
    font-size: 17px;
    font-weight: 700;
    min-width: 32px;
    text-align: center;
    color: var(--text);
  }
  .qty-zero { color: var(--danger) !important; }
  .del-btn {
    width: 32px; height: 32px;
    border-radius: 8px;
    border: none;
    background: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--text2);
    margin-left: 2px;
  }
  .del-btn:active { color: var(--danger); }
  .del-btn i { font-size: 18px; }

  /* EMPTY */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text2);
  }
  .empty i { font-size: 52px; display: block; margin-bottom: 12px; opacity: 0.2; }
  .empty p { font-size: 15px; }

  /* NAV BAR */
  .nav-bar {
    display: flex;
    background: var(--surface);
    border-top: 0.5px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom, 12px);
    margin-bottom: 15px;
    flex-shrink: 0;
    position: relative;
    overflow: visible;
  }
  .nav-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    background: none;
    border: none;
    cursor: pointer;
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: var(--text2);
    padding: 10px 0 4px;
    transition: color 0.15s;
  }
  .nav-btn i { font-size: 30px; }
  .nav-btn.active { color: var(--accent); }

.nav-watermark {
    position: fixed;
    bottom: 70px;
    left: 46%;
    transform: translateX(-50%);
    width: 500px;
    opacity: 0.08;
    
    user-select: none;
    -webkit-user-select: none;
    z-index: 0;
}

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(16px);
    background: #1a1a1a;
    color: white;
    padding: 11px 22px;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 500;
    font-family: 'DM Sans', system-ui, sans-serif;
    z-index: 999;
    opacity: 0;
    transition: all 0.25s;
    white-space: nowrap;
    pointer-events: none;
    max-width: 90vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 100;
    display: flex;
    align-items: flex-end;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal-sheet {
    background: var(--surface);
    border-radius: 22px 22px 0 0;
    padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px));
    width: 100%;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.32,0.72,0,1);
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-height: 88vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .modal-overlay.open .modal-sheet { transform: translateY(0); }
  .modal-handle {
    width: 40px; height: 4px;
    background: var(--border2);
    border-radius: 2px;
    margin: 0 auto 4px;
  }
  .modal-title { font-size: 18px; font-weight: 700; color: var(--text); }

  /* SWATCHES */
  .color-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .swatch {
    width: 38px; height: 38px;
    border-radius: 50%;
    cursor: pointer;
    border: 3px solid transparent;
    transition: all 0.15s;
    outline: none;
  }
  .swatch.sel { border-color: var(--text); transform: scale(1.15); }

  /* FIREBASE INFO */
  textarea {
    background: var(--surface2);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius);
    padding: 11px;
    font-size: 12px;
    font-family: monospace;
    color: var(--text);
    width: 100%;
    height: 90px;
    resize: none;
    outline: none;
  }
  textarea:focus { border-color: var(--accent); }

  .close-btn {
    width: 100%;
    padding: 14px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border2);
    background: var(--surface2);
    color: var(--text);
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
  }
  .close-btn:active { opacity: 0.7; }

  .sync-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--text2);
    padding: 8px 0 0;
  }
  .sync-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--border2);
    flex-shrink: 0;
  }
  .sync-dot.on { background: var(--accent); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* AUTOCOMPLETE CUSTOM */
  .autocomplete-wrap { position: relative; }
  .autocomplete-suggestion {
    position: absolute;
    left: 0; right: 0; top: 100%;
    margin-top: 4px;
    background: var(--surface);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius);
    padding: 11px 14px;
    font-size: 15px;
    font-weight: 500;
    color: var(--text2);
    cursor: pointer;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 16px rgba(0,0,0,0.10);
    transition: background 0.1s;
  }
  .autocomplete-suggestion .sugg-name { color: var(--text); }
  .autocomplete-suggestion .sugg-hint { font-size: 12px; color: var(--text2); }
  .autocomplete-suggestion:active { background: var(--accent-light); }

  /* CONFIRM MODAL */
  .confirm-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    padding: 20px;
  }
  .confirm-overlay.open { opacity: 1; pointer-events: all; }
  .confirm-sheet {
    background: var(--surface);
    border-radius: 20px;
    padding: 24px 20px 20px;
    width: 100%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    transform: scale(0.92) translateY(10px);
    transition: transform 0.25s cubic-bezier(0.32,0.72,0,1);
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }
  .confirm-overlay.open .confirm-sheet { transform: scale(1) translateY(0); }
  .confirm-icon {
    width: 52px; height: 52px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto;
    font-size: 26px;
  }
  .confirm-icon.add { background: var(--accent-light); color: var(--accent-dark); }
  .confirm-icon.rem { background: #FEF3C7; color: #D97706; }
  .confirm-icon.del { background: #FCEBEB; color: var(--danger); }
  .confirm-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    text-align: center;
  }
  .confirm-body {
    font-size: 14px;
    color: var(--text2);
    text-align: center;
    line-height: 1.5;
  }
  .confirm-body strong { color: var(--text); font-weight: 600; }
  .confirm-actions { display: flex; flex-direction: column; gap: 8px; }
  .confirm-ok {
    width: 100%;
    padding: 14px;
    border-radius: var(--radius);
    border: none;
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .confirm-ok:active { transform: scale(0.98); opacity: 0.9; }
  .confirm-ok.add { background: var(--accent); color: white; }
  .confirm-ok.rem { background: #D97706; color: white; }
  .confirm-ok.del { background: var(--danger); color: white; }
  .confirm-cancel {
    width: 100%;
    padding: 13px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border2);
    background: var(--surface2);
    color: var(--text2);
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
  }
  .confirm-cancel:active { opacity: 0.7; }

  /* ALERTAS EXPANDIBLE */
  .alerts-section {
    background: var(--surface);
    border-radius: var(--radius-lg);
    border: 0.5px solid var(--border);
    overflow: hidden;
  }
  .alerts-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 16px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .alerts-header-left {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
  }
  .alerts-header-left i { font-size: 18px; color: var(--danger); }
  .alerts-badge {
    background: var(--danger);
    color: white;
    font-size: 11px;
    font-weight: 700;
    border-radius: 20px;
    padding: 1px 7px;
    min-width: 20px;
    text-align: center;
  }
  .alerts-badge.none { background: var(--accent); }
  .alerts-chevron {
    font-size: 18px;
    color: var(--text2);
    transition: transform 0.2s;
  }
  .alerts-section.open .alerts-chevron { transform: rotate(180deg); }
  .alerts-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s cubic-bezier(0.4,0,0.2,1);
    border-top: 0px solid var(--border);
  }
  .alerts-section.open .alerts-body {
    max-height: 300px;
    border-top-width: 0.5px;
  }
  .alerts-inner { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; }
  .alert-item {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #FCEBEB;
    border-radius: 8px;
    padding: 8px 12px;
  }
  .alert-item i { font-size: 16px; color: var(--danger); flex-shrink: 0; }
  .alert-item-name { font-size: 14px; font-weight: 500; color: var(--text); flex: 1; }
  .alert-item-tag {
    font-size: 11px;
    font-weight: 700;
    color: var(--danger);
    background: rgba(226,75,74,0.12);
    border-radius: 6px;
    padding: 2px 7px;
  }
  .alerts-empty {
    font-size: 13px;
    color: var(--text2);
    text-align: center;
    padding: 10px 0 4px;
  }
  @media (prefers-color-scheme: dark) {
    .alert-item { background: rgba(226,75,74,0.15); }
  }
</style>
</head>
<body>

<div class="app">
  <div class="tabs">
    <button class="tab active" id="tabC" onclick="switchTab('cargar')">
      <i class="ti ti-stack-2"></i> Cargar
    </button>
    <button class="tab" id="tabI" onclick="switchTab('inventario')">
      <i class="ti ti-list-check"></i> Inventario
    </button>
  </div>

  <div class="content" id="mainContent">

    <div class="panel active" id="panelCargar">
      <div class="card">
        <div class="action-grid">
          <button class="action-btn sel-add" id="btnAdd" onclick="setAction('add')">
            <i class="ti ti-arrow-up"></i> Agregar
          </button>
          <button class="action-btn" id="btnRem" onclick="setAction('remove')">
            <i class="ti ti-arrow-down" style="color:var(--danger)"></i> Consumí
          </button>
        </div>
      </div>

      <div class="card">
        <div>
          <div class="input-label">Nombre del producto</div>
          <div class="autocomplete-wrap">
            <input type="text" id="prodName" placeholder="ej: Leche, Arroz..." autocomplete="off" autocorrect="off" autocapitalize="words" oninput="onNameInput()" onkeydown="onNameKey(event)" onblur="hideSugg()">
            <div class="autocomplete-suggestion" id="suggBox" style="display:none" onmousedown="acceptSugg()">
              <span class="sugg-name" id="suggText"></span>
              <span class="sugg-hint">↵ aceptar</span>
            </div>
          </div>
        </div>
        <div>
          <div class="input-label">Cantidad</div>
          <input type="number" id="prodQty" value="1" min="1" step="1" inputmode="numeric">
        </div>
      </div>

      <button class="submit-btn" id="submitBtn" onclick="askConfirm()">
        <i class="ti ti-check"></i>
        <span id="submitLbl">Agregar al inventario</span>
      </button>

      <div class="alerts-section" id="alertsSection">
        <div class="alerts-header" onclick="toggleAlerts()">
          <div class="alerts-header-left">
            <i class="ti ti-bell-ringing"></i>
            Alertas de stock
            <span class="alerts-badge" id="alertsBadge">0</span>
          </div>
          <i class="ti ti-chevron-down alerts-chevron"></i>
        </div>
        <div class="alerts-body">
          <div class="alerts-inner" id="alertsInner"></div>
        </div>
      </div>
    </div>

    <div class="panel" id="panelInventario">
      <div class="search-wrap">
        <i class="ti ti-search"></i>
        <input type="text" placeholder="Buscar..." oninput="render()" id="searchInput" autocorrect="off">
      </div>
      <div class="inv-list" id="invList"></div>
    </div>

  </div>
 <img src="logo3.png" class="bg-watermark" alt="logo">
  <div class="nav-bar">
       
    <button class="nav-btn active" id="navC" onclick="goTab('cargar')">
      <i class="ti ti-stack-2"></i> Cargar
    </button>
    <button class="nav-btn" id="navI" onclick="goTab('inventario')">
      <i class="ti ti-list-check"></i> Inventario
    </button>
    <button class="nav-btn" id="navS" onclick="openConfig()">
      <i class="ti ti-settings"></i> Config
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- MODAL CONFIRMAR ACCIÓN -->
<div class="confirm-overlay" id="confirmModal">
  <div class="confirm-sheet">
    <div class="confirm-icon" id="cIcon"><i id="cIconI" class="ti ti-check"></i></div>
    <div class="confirm-title" id="cTitle">¿Confirmar?</div>
    <div class="confirm-body" id="cBody"></div>
    <div class="confirm-actions">
      <button class="confirm-ok" id="cOkBtn" onclick="confirmOk()">Confirmar</button>
      <button class="confirm-cancel" onclick="confirmCancel()">Cancelar</button>
    </div>
  </div>
</div>

<!-- MODAL ELIMINAR -->
<div class="confirm-overlay" id="deleteModal">
  <div class="confirm-sheet">
    <div class="confirm-icon del"><i class="ti ti-trash"></i></div>
    <div class="confirm-title">Eliminar producto</div>
    <div class="confirm-body" id="dBody"></div>
    <div class="confirm-actions">
      <button class="confirm-ok del" onclick="confirmDel()">Sí, eliminar</button>
      <button class="confirm-cancel" onclick="cancelDel()">Cancelar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="configModal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">Configuración</div>

    <div class="card">
      <div class="input-label" style="font-size:13px;font-weight:600;color:var(--text)">Color de acento</div>
      <div class="color-row" id="colorRow">
        <div class="swatch sel" style="background:#1D9E75" data-c="#1D9E75" data-d="#0F6E56" data-l="#E1F5EE" onclick="setAccent(this)"></div>
        <div class="swatch" style="background:#378ADD" data-c="#378ADD" data-d="#185FA5" data-l="#E6F1FB" onclick="setAccent(this)"></div>
        <div class="swatch" style="background:#D4537E" data-c="#D4537E" data-d="#993556" data-l="#FBEAF0" onclick="setAccent(this)"></div>
        <div class="swatch" style="background:#BA7517" data-c="#BA7517" data-d="#854F0B" data-l="#FAEEDA" onclick="setAccent(this)"></div>
        <div class="swatch" style="background:#7F77DD" data-c="#7F77DD" data-d="#534AB7" data-l="#EEEDFE" onclick="setAccent(this)"></div>
        <div class="swatch" style="background:#D85A30" data-c="#D85A30" data-d="#993C1D" data-l="#FAECE7" onclick="setAccent(this)"></div>
      </div>
    </div>

    <div class="card">
      <div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px">Sincronización Firebase</div>
      <textarea id="fbCfg" placeholder='{"apiKey":"...","projectId":"..."}'></textarea>
      <button class="submit-btn" onclick="connectFb()">
        <i class="ti ti-cloud-upload"></i> Conectar Firebase
      </button>
      <div class="sync-status">
        <div class="sync-dot" id="syncDot"></div>
        <span id="syncLabel">Sin sincronización — solo local</span>
      </div>
    </div>

    <div class="card">
      <button class="submit-btn" style="background:var(--surface2);color:var(--text);border:0.5px solid var(--border2);" onclick="exportData()">
        <i class="ti ti-download"></i> Exportar datos JSON
      </button>
    </div>

    <button class="close-btn" onclick="closeConfig()">Cerrar</button>
  </div>
</div>

<script>
  let inv = JSON.parse(localStorage.getItem('inv_v2') || '[]');
  let cfg = JSON.parse(localStorage.getItem('cfg_v2') || '{"accent":"#1D9E75","accentD":"#0F6E56","accentL":"#E1F5EE"}');
  let action = 'add';
  let db = null, fbOn = false;

  function applyAccent() {
    document.documentElement.style.setProperty('--accent', cfg.accent);
    document.documentElement.style.setProperty('--accent-dark', cfg.accentD);
    document.documentElement.style.setProperty('--accent-light', cfg.accentL);
  }

  function switchTab(t) {
    const isC = t === 'cargar';
    document.getElementById('tabC').classList.toggle('active', isC);
    document.getElementById('tabI').classList.toggle('active', !isC);
    document.getElementById('panelCargar').classList.toggle('active', isC);
    document.getElementById('panelInventario').classList.toggle('active', !isC);
    document.getElementById('mainContent').scrollTop = 0;
    if (!isC) render();
  }

  function goTab(t) {
    switchTab(t);
    document.getElementById('navC').classList.toggle('active', t === 'cargar');
    document.getElementById('navI').classList.toggle('active', t === 'inventario');
  }

  function setAction(a) {
    action = a;
    document.getElementById('btnAdd').className = 'action-btn' + (a === 'add' ? ' sel-add' : '');
    document.getElementById('btnRem').className = 'action-btn' + (a === 'remove' ? ' sel-rem' : '');
    document.getElementById('btnAdd').innerHTML = '<i class="ti ti-arrow-up"></i> Agregar';
    document.getElementById('btnRem').innerHTML = '<i class="ti ti-arrow-down" style="color:var(--danger)"></i> Consumí';
    document.getElementById('submitBtn').className = 'submit-btn' + (a === 'remove' ? ' danger' : '');
    document.getElementById('submitLbl').textContent = a === 'add' ? 'Agregar al inventario' : 'Registrar consumo';
  }

  // ---- AUTOCOMPLETE ----
  let currentSugg = '';
  function onNameInput() {
    const val = document.getElementById('prodName').value;
    const box = document.getElementById('suggBox');
    const txt = document.getElementById('suggText');
    if (!val.trim()) { box.style.display = 'none'; currentSugg = ''; return; }
    const match = inv.find(i => i.n.toLowerCase().startsWith(val.toLowerCase()) && i.n.toLowerCase() !== val.toLowerCase());
    if (match) {
      currentSugg = match.n;
      txt.textContent = match.n;
      box.style.display = 'flex';
    } else {
      box.style.display = 'none';
      currentSugg = '';
    }
  }
  function onNameKey(e) {
    if ((e.key === 'Tab' || e.key === 'ArrowRight') && currentSugg) {
      e.preventDefault();
      acceptSugg();
    }
    if (e.key === 'Enter') {
      if (currentSugg) acceptSugg();
      e.preventDefault();
      document.getElementById('prodQty').focus();
      document.getElementById('prodQty').select();
    }
    if (e.key === 'Escape') hideSugg();
  }
  function acceptSugg() {
    if (!currentSugg) return;
    document.getElementById('prodName').value = currentSugg;
    hideSugg();
  }
  function hideSugg() {
    setTimeout(() => {
      document.getElementById('suggBox').style.display = 'none';
      currentSugg = '';
    }, 120);
  }

  // ---- CONFIRMAR ACCIÓN ----
  function askConfirm() {
    const name = document.getElementById('prodName').value.trim();
    const qty = parseInt(document.getElementById('prodQty').value) || 1;
    if (!name) { toast('Ingresá el nombre del producto'); return; }
    const icon = document.getElementById('cIcon');
    const iconI = document.getElementById('cIconI');
    const title = document.getElementById('cTitle');
    const body = document.getElementById('cBody');
    const okBtn = document.getElementById('cOkBtn');
    if (action === 'add') {
      icon.className = 'confirm-icon add';
      iconI.className = 'ti ti-arrow-up';
      title.textContent = 'Agregar al inventario';
      body.innerHTML = 'Vas a agregar <strong>' + qty + ' unidad' + (qty > 1 ? 'es' : '') + '</strong> de<br><strong>' + name + '</strong>';
      okBtn.className = 'confirm-ok add';
      okBtn.textContent = 'Sí, agregar';
    } else {
      const item = inv.find(i => i.n.toLowerCase() === name.toLowerCase());
      if (!item) { toast('Producto no encontrado'); return; }
      if (item.q < qty) { toast('Sin suficiente stock (' + item.q + ' disponibles)'); return; }
      icon.className = 'confirm-icon rem';
      iconI.className = 'ti ti-arrow-down';
      title.textContent = 'Registrar consumo';
      body.innerHTML = 'Vas a consumir <strong>' + qty + ' unidad' + (qty > 1 ? 'es' : '') + '</strong> de<br><strong>' + name + '</strong><br><span style="font-size:12px;color:var(--text2)">Stock actual: ' + item.q + ' → ' + (item.q - qty) + '</span>';
      okBtn.className = 'confirm-ok rem';
      okBtn.textContent = 'Sí, consumir';
    }
    document.getElementById('confirmModal').classList.add('open');
  }
  function confirmOk() {
    document.getElementById('confirmModal').classList.remove('open');
    submit();
  }
  function confirmCancel() {
    document.getElementById('confirmModal').classList.remove('open');
  }

  function submit() {
    const name = document.getElementById('prodName').value.trim();
    const qty = parseInt(document.getElementById('prodQty').value) || 1;
    if (!name) return;
    let item = inv.find(i => i.n.toLowerCase() === name.toLowerCase());
    if (action === 'add') {
      if (item) { item.q += qty; }
      else { inv.push({ id: Date.now().toString(), n: name, q: qty }); }
      toast('✅ ' + name + ' +' + qty);
    } else {
      if (!item || item.q < qty) return;
      item.q -= qty;
      toast('📉 ' + name + ' −' + qty);
    }
    save();
    document.getElementById('prodName').value = '';
    document.getElementById('prodQty').value = 1;
    hideSugg();
    updateAlerts();
  }

  function render() {
    const q = (document.getElementById('searchInput').value || '').toLowerCase();
    const filtered = q ? inv.filter(i => i.n.toLowerCase().includes(q)) : [...inv];
    const list = document.getElementById('invList');
    if (!filtered.length) {
      list.innerHTML = '<div class="empty"><i class="ti ti-packages"></i><p>Sin productos cargados</p></div>';
      return;
    }
    list.innerHTML = filtered.map(item =>
      `<div class="inv-item">
        <span class="item-name">${item.n}</span>
        <div class="qty-controls">
          <button class="qty-btn" onclick="adj('${item.id}',-1)">−</button>
          <span class="qty-num${item.q === 0 ? ' qty-zero' : ''}">${item.q}</span>
          <button class="qty-btn" onclick="adj('${item.id}',1)">+</button>
        </div>
        <button class="del-btn" onclick="del('${item.id}')" aria-label="Eliminar">
          <i class="ti ti-trash"></i>
        </button>
      </div>`
    ).join('');
  }

  function adj(id, d) {
    const item = inv.find(i => i.id === id);
    if (!item) return;
    item.q = Math.max(0, item.q + d);
    save(); render(); updateAlerts();
  }

  let pendingDelId = null;
  function del(id) {
    const item = inv.find(i => i.id === id);
    if (!item) return;
    pendingDelId = id;
    document.getElementById('dBody').innerHTML = '¿Eliminar <strong>' + item.n + '</strong> del inventario?<br><span style="font-size:12px;color:var(--text2)">Esta acción no se puede deshacer.</span>';
    document.getElementById('deleteModal').classList.add('open');
  }
  function confirmDel() {
    if (!pendingDelId) return;
    const item = inv.find(i => i.id === pendingDelId);
    inv = inv.filter(i => i.id !== pendingDelId);
    pendingDelId = null;
    document.getElementById('deleteModal').classList.remove('open');
    save(); render(); updateAlerts();
    if (item) toast('🗑 ' + item.n + ' eliminado');
  }
  function cancelDel() {
    pendingDelId = null;
    document.getElementById('deleteModal').classList.remove('open');
  }

  function save() {
    localStorage.setItem('inv_v2', JSON.stringify(inv));
    if (db && fbOn) syncFb();
  }

  function updateSugg() { /* kept for compat */ }

  function updateAlerts() {
    const zeros = inv.filter(i => i.q === 0);
    const badge = document.getElementById('alertsBadge');
    const inner = document.getElementById('alertsInner');
    badge.textContent = zeros.length;
    badge.className = 'alerts-badge' + (zeros.length === 0 ? ' none' : '');
    if (zeros.length === 0) {
      inner.innerHTML = '<div class="alerts-empty"><i class="ti ti-check" style="color:var(--accent)"></i> Sin productos sin stock</div>';
    } else {
      inner.innerHTML = zeros.map(i =>
        `<div class="alert-item">
          <i class="ti ti-alert-circle"></i>
          <span class="alert-item-name">${i.n}</span>
          <span class="alert-item-tag">Sin stock</span>
        </div>`
      ).join('');
    }
  }

  function toggleAlerts() {
    document.getElementById('alertsSection').classList.toggle('open');
  }

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  function openConfig() {
    if (cfg.fbCfg) document.getElementById('fbCfg').value = cfg.fbCfg;
    document.querySelectorAll('.swatch').forEach(s => s.classList.toggle('sel', s.dataset.c === cfg.accent));
    document.getElementById('syncDot').className = 'sync-dot' + (fbOn ? ' on' : '');
    document.getElementById('syncLabel').textContent = fbOn ? 'Conectado a Firebase ✓' : 'Sin sincronización — solo local';
    document.getElementById('configModal').classList.add('open');
  }

  function closeConfig() {
    document.getElementById('configModal').classList.remove('open');
  }

  function setAccent(el) {
    cfg.accent = el.dataset.c;
    cfg.accentD = el.dataset.d;
    cfg.accentL = el.dataset.l;
    applyAccent();
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('sel'));
    el.classList.add('sel');
    localStorage.setItem('cfg_v2', JSON.stringify(cfg));
  }

  function connectFb() {
    const str = document.getElementById('fbCfg').value.trim();
    if (!str) { toast('Pegá tu config de Firebase'); return; }
    try {
      const parsed = JSON.parse(str);
      cfg.fbCfg = str;
      localStorage.setItem('cfg_v2', JSON.stringify(cfg));
      loadFb(parsed);
    } catch(e) { toast('JSON inválido, revisá el formato'); }
  }

  function loadFb(parsed) {
    if (typeof firebase !== 'undefined') { initFb(parsed); return; }
    let loaded = 0;
    const scripts = [
      'https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js',
      'https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js'
    ];
    scripts.forEach(src => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = () => { if (++loaded === 2) initFb(parsed); };
      document.head.appendChild(s);
    });
  }

  function initFb(parsed) {
    try {
      if (!firebase.apps.length) firebase.initializeApp(parsed);
      db = firebase.firestore();
      fbOn = true;
      document.getElementById('syncDot').className = 'sync-dot on';
      document.getElementById('syncLabel').textContent = 'Conectado a Firebase ✓';
      toast('🔥 Firebase conectado');
      db.collection('inv').onSnapshot(snap => {
        inv = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        localStorage.setItem('inv_v2', JSON.stringify(inv));
        render();
        updateSugg();
      });
      closeConfig();
    } catch(e) { toast('Error: ' + e.message); }
  }

  async function syncFb() {
  try {
    const snap = await db.collection('inv').get();

    const batch = db.batch();

    snap.docs.forEach(doc => {
      batch.delete(doc.ref);
    });

    inv.forEach(item => {
      const ref = db.collection('inv').doc(item.id);
      batch.set(ref, {
        n: item.n,
        q: item.q
      });
    });

    await batch.commit();

    console.log("Sincronizado OK");
    toast("Firebase sincronizado");
  } catch (err) {
    console.error(err);
    toast("ERROR: " + err.message);
  }
}
function save() {
  localStorage.setItem('inv_v2', JSON.stringify(inv));

  console.log("Guardando:", inv);

  if (db && fbOn) {
    syncFb();
  }
}
  function exportData() {
    const blob = new Blob([JSON.stringify(inv, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'inventario.json';
    a.click();
    toast('📥 Exportado');
  }

  applyAccent();
  updateAlerts();

if (cfg.fbCfg) {
  try {
    loadFb(JSON.parse(cfg.fbCfg));
  } catch (e) {
    console.error("Error cargando Firebase:", e);
  }
}
</script>
</body>
</html>
