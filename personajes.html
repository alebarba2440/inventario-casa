<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Juntos">
<link rel="apple-touch-icon" href="img/apple-touch.png?v=11">
<link rel="icon" type="image/png" href="img/icono.png?v=12">
<title>Mi avatar</title>
<script src="tema.js"></script>
<script src="sonidos.js"></script>
<script src="personajes.js?v=5"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--accent:#1D9E75;--accent-dark:#0F6E56;--accent-light:#E1F5EE;
        --bg:#f5f5f0;--surface:#fff;--surface2:#f5f5f0;--border:rgba(0,0,0,.1);--border2:rgba(0,0,0,.18);--text:#1a1a1a;--text2:#666}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--surface:#1c1c1e;--surface2:#2c2c2e;--border:rgba(255,255,255,.1);--border2:rgba(255,255,255,.2);--text:#f5f5f5;--text2:#aaa}}
  :root[data-theme="dark"]{--bg:#111;--surface:#1c1c1e;--surface2:#2c2c2e;--border:rgba(255,255,255,.1);--border2:rgba(255,255,255,.2);--text:#f5f5f5;--text2:#aaa}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Nunito',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh}
  .top{background:var(--surface);border-bottom:3px solid var(--accent);padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
  .top h1{font-size:1.1rem;color:var(--accent);font-weight:800;letter-spacing:.05em}
  main{max-width:560px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:14px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 30px)}
  .yo{background:var(--surface);border:.5px solid var(--border);border-radius:18px;padding:14px;display:flex;align-items:center;gap:14px}
  .yo .fig{width:96px;height:130px;flex-shrink:0;border-radius:14px;background:linear-gradient(180deg,var(--accent-light),transparent);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
  .yo .fig img{max-height:124px;max-width:100%}
  .yo b{display:block;font-size:1.15rem;font-weight:900}
  .yo small{color:var(--text2);font-weight:700;line-height:1.35;display:block;margin-top:2px}
  .yo small b{display:inline;font-size:inherit;font-weight:900}
  h2{font-size:.82rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);margin:2px 2px -4px}
  .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .pj{position:relative;border:2.5px solid transparent;background:var(--surface);border-radius:16px;padding:8px 6px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;
      box-shadow:0 2px 10px rgba(0,0,0,.05);transition:transform .15s,border-color .15s;font-family:inherit;color:var(--text)}
  .pj:active{transform:scale(.95)}
  .pj .fig{height:150px;width:100%;display:flex;align-items:flex-end;justify-content:center;border-radius:12px;background:var(--surface2)}
  .pj img{max-height:144px;max-width:100%}
  .pj span{font-weight:800;font-size:.88rem}
  .pj.on{border-color:var(--accent)}
  .pj.on .fig{background:var(--accent-light)}
  .pj .ok{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-weight:900;font-style:normal;display:none;place-items:center;font-size:.9rem;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  .pj.on .ok{display:grid}
  .def{position:relative;display:flex;align-items:center;justify-content:center;margin:18px auto 0;min-width:130px;border:2px solid var(--border2);background:var(--surface);border-radius:12px;padding:8px 18px;cursor:pointer;font-family:inherit;color:var(--text)}
  .def b{font-size:.9rem;font-weight:900}.def small{color:var(--text2);font-weight:700;font-size:.82rem}
  .def.on{border-color:var(--accent);background:var(--accent-light)}
  .def .ok{position:absolute;top:50%;right:8px;transform:translateY(-50%);width:20px;height:20px;font-size:.75rem;border-radius:50%;background:var(--accent);color:#fff;font-weight:900;display:none;place-items:center}
  .def.on .ok{display:grid}
  /* "Volver al Default" y "Cambiar mi nombre…" dentro del primer recuadro */
  .yo{flex-wrap:wrap}
  .yo>div:not(.fig):not(.yo-acc){flex:1 1 0;min-width:0}
  .yo-acc{flex-basis:100%;display:flex;gap:8px}   /* los dos botones uno al lado del otro, debajo de todo el recuadro */
  .yo-acc>button{min-width:0}
  .yo-acc .def{flex:0 0 auto}
  .yo-acc .perfil-b{flex:1 1 0}
  .yo-acc .def{margin:0;padding:6px 36px 6px 12px;border-radius:5px 14px 5px 14px}
  .yo-acc .def b{font-size:.82rem}
  .yo-acc .perfil-b{margin:0;display:flex;align-items:center;gap:9px;text-align:left;text-decoration:none;background:var(--accent);color:#fff;
    padding:8px 14px 8px 11px;border-radius:5px 14px 5px 14px;box-shadow:0 6px 14px -6px color-mix(in srgb,var(--accent) 70%,transparent);transition:transform .15s,box-shadow .15s}
  .yo-acc .perfil-b[hidden]{display:none}
  .yo-acc .perfil-b i{font-size:1.25rem}
  .yo-acc .perfil-b>span{min-width:0}
  .yo-acc .perfil-b b{display:block;font-size:.86rem;font-weight:900;line-height:1.15}
  .yo-acc .perfil-b small{display:block;margin:0;color:rgba(255,255,255,.85);font-size:.7rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;line-height:1.2}
  .yo-acc .perfil-b:active{transform:scale(.96)}
  @media (hover:hover){.yo-acc .perfil-b:hover{transform:translateY(-2px);box-shadow:0 10px 18px -8px color-mix(in srgb,var(--accent) 80%,transparent)}}
  .perfil-b{display:block;margin:14px auto 0;border:none;background:none;color:var(--accent);font-family:inherit;font-weight:800;font-size:.9rem;cursor:pointer;text-decoration:underline}
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%) translateY(20px);opacity:0;background:#1a1a1a;color:#fff;font-weight:800;padding:11px 18px;border-radius:999px;transition:all .25s;pointer-events:none;z-index:60;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
<link rel="stylesheet" href="fondo.css">
<link rel="stylesheet" href="comun.css">
</head>
<body>
<div class="top">
  <a class="home-link" href="index.html" aria-label="Volver al inicio"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.707 2.293l9 9c.63 .63 .184 1.707 -.707 1.707h-1v6a3 3 0 0 1 -3 3h-1v-7a3 3 0 0 0 -2.824 -2.995l-.176 -.005h-2a3 3 0 0 0 -3 3v7h-1a3 3 0 0 1 -3 -3v-6h-1c-.89 0 -1.337 -1.077 -.707 -1.707l9 -9a1 1 0 0 1 1.414 0m.293 11.707a1 1 0 0 1 1 1v7h-4v-7a1 1 0 0 1 .883 -.993l.117 -.007z"/></svg></a>
  <h1>MI AVATAR</h1>
</div>
<main>
  <section class="yo"><div class="fig" id="yoFig"></div><div><b id="yoNom">Elegí tu personaje</b><small>Es el que te representa en la app: por ejemplo, aparece en tu tarjeta de <b>Gastos personales</b>. Cada uno elige el suyo.</small></div>
    <div class="yo-acc"><button class="def" id="bDef" onclick="elegir('default')"><span class="ok">✓</span><b>Restablecer</b></button>
    <button class="perfil-b" id="bPerfil" onclick="abrirPerfil()" hidden><i class="ti ti-user-edit" aria-hidden="true"></i><span><b>Editar mi perfil</b><small>Nombre, apodo, ella/él</small></span></button></div></section>
  <h2>Mujeres</h2><div class="grid" id="gF"></div>
  <h2>Hombres</h2><div class="grid" id="gM"></div>
</main>
<div class="toast" id="toast"></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function pintar(){
  document.getElementById('bPerfil').hidden=!window.guardarPerfilYo;
  const yo=miPersonaje();
  document.getElementById('yoFig').innerHTML=yo?`<img src="${yo.img}" alt="">`:'';
  document.getElementById('yoNom').textContent=esDefault()?'Default':yo?yo.nombre:'Elegí tu personaje';
  const def=esDefault();document.getElementById('bDef').classList.toggle('on',def);
  ['f','m'].forEach(g=>{document.getElementById(g==='f'?'gF':'gM').innerHTML=PERSONAJES.filter(p=>p.g===g&&!p.oculto).map(p=>
    `<button class="pj${!def&&yo&&yo.id===p.id?' on':''}" onclick="elegir('${p.id}')" aria-pressed="${!!(!def&&yo&&yo.id===p.id)}"><div class="fig"><img src="${p.img}" alt="" loading="lazy"></div><span>${esc(p.nombre)}</span><i class="ok">✓</i></button>`).join('')});
}
function elegir(id){
  try{localStorage.setItem('personaje',id)}catch(e){}
  try{window.sonido&&sonido('aceptar')}catch(e){}
  pintar();
  const t=document.getElementById('toast');t.textContent=id==='default'?'¡Listo! Volviste al Default':'¡Listo! Ahora sos '+personaje(id).nombre;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);
}
pintar();window.addEventListener('juntos',pintar);
</script>
</body>
</html>
