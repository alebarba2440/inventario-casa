<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JuntOS">
<link rel="apple-touch-icon" href="img/apple-touch.png?v=8">
<link rel="icon" type="image/png" href="img/icono.png?v=8">
<title>Personalización</title>
<script src="tema.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comun.css">
<script src="personajes.js"></script>
<style>
  :root{--accent:#1D9E75;--accent-dark:#0F6E56;--accent-light:#E1F5EE;--pos:#1D9E75;--neg:#E24B4A;--warn:#D97706;
        --bg:#f5f5f0;--surface:#fff;--surface2:#f5f5f0;--border:rgba(0,0,0,.1);--border2:rgba(0,0,0,.18);--text:#1a1a1a;--text2:#666;--r:12px;
        --paid-bg:rgba(29,158,117,.10)}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--surface:#1c1c1e;--surface2:#2c2c2e;--border:rgba(255,255,255,.1);--border2:rgba(255,255,255,.2);--text:#f5f5f5;--text2:#aaa;--paid-bg:rgba(29,158,117,.18)}}
  :root[data-theme="dark"]{--bg:#111;--surface:#1c1c1e;--surface2:#2c2c2e;--border:rgba(255,255,255,.1);--border2:rgba(255,255,255,.2);--text:#f5f5f5;--text2:#aaa;--paid-bg:rgba(29,158,117,.18)}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  body{font-family:'Nunito',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh}
  .top{background:var(--surface);border-bottom:3px solid var(--accent);padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
  .top h1{font-size:1.1rem;color:var(--accent);font-weight:800;letter-spacing:.05em}
  main{max-width:520px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:12px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 30px)}
  .card{background:var(--surface);border:.5px solid var(--border);border-radius:18px;padding:14px}
  /* vista previa de los dos */
  .prev{display:flex;justify-content:center;align-items:flex-end;padding:8px 0 0;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 16%,transparent),transparent 85%);border-radius:18px}
  .prev .pj{width:44%;max-width:200px;cursor:pointer;transition:transform .25s,filter .25s;filter:grayscale(.35) opacity(.75)}
  .prev .pj+.pj{margin-left:-6%}
  .prev .pj.sel{filter:none;transform:translateY(-4px) scale(1.03)}
  .prev .pj svg{display:block;width:100%;height:auto}
  .tabsel{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:.5px solid var(--border);border-radius:999px;padding:5px}
  .tabsel button{border:none;background:none;border-radius:999px;padding:10px;font-family:inherit;font-weight:800;font-size:.95rem;color:var(--text2);cursor:pointer}
  .tabsel button.on{color:#fff}
  .grupo h2{font-size:.82rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);margin:2px 2px 8px}
  .opc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--surface2);border-radius:14px;padding:4px}
  .opc button{border:none;background:none;border-radius:11px;padding:10px 4px;font-family:inherit;font-weight:700;font-size:.85rem;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
  .opc button.on{color:#fff}
  .dot{width:12px;height:12px;border-radius:50%;border:1.5px solid rgba(0,0,0,.25);flex-shrink:0}
  .nota{font-size:.8rem;color:var(--text2);text-align:center}
</style>
</head>
<body>
<div class="top">
  <a class="home-link" href="index.html" aria-label="Volver al inicio"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.707 2.293l9 9c.63 .63 .184 1.707 -.707 1.707h-1v6a3 3 0 0 1 -3 3h-1v-7a3 3 0 0 0 -2.824 -2.995l-.176 -.005h-2a3 3 0 0 0 -3 3v7h-1a3 3 0 0 1 -3 -3v-6h-1c-.89 0 -1.337 -1.077 -.707 -1.707l9 -9a1 1 0 0 1 1.414 0m.293 11.707a1 1 0 0 1 1 1v7h-4v-7a1 1 0 0 1 .883 -.993l.117 -.007z"/></svg></a>
  <h1>PERSONALIZACIÓN</h1>
</div>
<main>
  <div class="prev" id="prev"></div>
  <div class="tabsel desliz" id="quien">
    <button data-t="f" onclick="elegir('f')">Ella</button>
    <button data-t="m" onclick="elegir('m')">Él</button>
  </div>
  <div class="card" id="grupos"></div>
  <p class="nota">Los cambios se guardan solos.</p>
</main>
<script>
const LS='personajes_v1';
let P;try{P=JSON.parse(localStorage.getItem(LS))}catch(e){}
P=P||{};['f','m'].forEach(t=>P[t]=Object.assign({},PERSONAJE_DEF[t],P[t]||{}));
let cual='f';
const TIT={pelo:'Peinado',ojos:'Color de ojos',barba:'Barba',outfit:'Outfit'};
const COLOJ={marron:'#7a4a2a',celeste:'#4fa6dc',verde:'#4d9a52'};
function guardar(){try{localStorage.setItem(LS,JSON.stringify(P))}catch(e){}}
function dibujar(){
  document.getElementById('prev').innerHTML=['f','m'].map(t=>`<div class="pj${t===cual?' sel':''}" onclick="elegir('${t}')">${svgPersonaje(t,P[t])}</div>`).join('');
}
function grupos(){
  const o=PERSONAJE_OPC[cual];
  document.getElementById('grupos').innerHTML=Object.keys(o).map(k=>`<div class="grupo" style="margin-bottom:14px">
    <h2>${TIT[k]}</h2>
    <div class="opc desliz" style="--pad:4px;--kr:11px">${o[k].map(([v,l])=>`<button class="${P[cual][k]===v?'on':''}" onclick="cambiar('${k}','${v}')">${k==='ojos'?`<span class="dot" style="background:${COLOJ[v]}"></span>`:''}${l}</button>`).join('')}</div></div>`).join('');
  if(window.syncSwitches)syncSwitches();
}
function elegir(t){cual=t;document.querySelectorAll('#quien button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));dibujar();grupos();}
function cambiar(k,v){P[cual][k]=v;guardar();dibujar();
  document.querySelectorAll('#grupos .grupo').forEach(g=>{});grupos();}
elegir('f');
</script>
</body>
</html>
