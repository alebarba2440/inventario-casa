<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--accent:#1D9E75;--accent-dark:#0F6E56;--accent-light:#E1F5EE;--pos:#1D9E75;--neg:#E24B4A;--warn:#D97706;
        --bg:#f5f5f0;--surface:#fff;--surface2:#f5f5f0;--border:rgba(0,0,0,.1);--border2:rgba(0,0,0,.18);--text:#1a1a1a;--text2:#666;--r:12px;
        --pos-l:#E1F5EE;--neg-l:#FDECEC;--warn-l:#FEF3C7}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--surface:#1c1c1e;--surface2:#2c2c2e;--border:rgba(255,255,255,.1);--border2:rgba(255,255,255,.2);--text:#f5f5f5;--text2:#aaa;--pos-l:rgba(29,158,117,.18);--neg-l:rgba(226,75,74,.18);--warn-l:rgba(217,119,6,.2)}}
  :root[data-theme="dark"]{--bg:#111;--surface:#1c1c1e;--surface2:#2c2c2e;--border:rgba(255,255,255,.1);--border2:rgba(255,255,255,.2);--text:#f5f5f5;--text2:#aaa;--pos-l:rgba(29,158,117,.18);--neg-l:rgba(226,75,74,.18);--warn-l:rgba(217,119,6,.2)}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Nunito',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh}
  .top{background:var(--surface);border-bottom:3px solid var(--accent);padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
  .top h1{font-size:1.1rem;color:var(--accent);font-weight:800;letter-spacing:.05em}
  main{max-width:560px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:12px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 30px)}
  input,select,textarea{font-family:inherit;color:var(--text)}
  .pos{color:var(--pos)}.neg{color:var(--neg)}.zero{color:var(--text2)}.warn{color:var(--warn)}

  /* pestañas */
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);border:.5px solid var(--border);border-radius:999px;padding:5px}
  .tabs button{border:none;background:none;border-radius:999px;padding:11px 8px;font-family:inherit;font-size:.95rem;font-weight:800;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
  .tabs button.on{background:var(--accent);color:#fff}
  .tab{display:none;flex-direction:column;gap:10px}
  .tab.on{display:flex}

  /* resumen arriba */
  .card{background:var(--surface);border:.5px solid var(--border);border-radius:16px;padding:14px}
  .res{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .res div{background:var(--surface2);border-radius:var(--r);padding:9px 10px}
  .res small{display:block;font-size:.72rem;color:var(--text2);font-weight:700}
  .res b{font-size:1.05rem;font-weight:800;font-variant-numeric:tabular-nums}

  /* meses (acordeón) */
  .mes{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 85px);background:var(--surface);border:.5px solid var(--border);border-left:5px solid var(--neg);border-radius:16px;overflow:hidden}
  .mes.paid{border-left-color:var(--pos)}
  .mes-h{width:100%;display:flex;align-items:center;gap:8px;padding:13px 12px;background:none;border:none;font-family:inherit;color:var(--text);cursor:pointer;text-align:left}
  .mes-h .nm{font-weight:800;font-size:.95rem;text-transform:uppercase;letter-spacing:.03em;flex:1;min-width:0}
  .mes-h .tt{font-weight:800;font-variant-numeric:tabular-nums;font-size:.92rem;color:var(--neg)}
  .mes.paid .mes-h .tt{color:var(--pos)}
  .mes{background:var(--surface)}
  .mes .mes-h{background:var(--neg-l)} .mes.paid .mes-h{background:var(--pos-l)}
  .chk{width:28px;height:28px;flex-shrink:0;border-radius:8px;border:2.5px solid var(--neg);background:var(--surface);color:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:all .15s}
  .chk svg{width:18px;height:18px}
  .chk.on{background:var(--pos);border-color:var(--pos);color:#fff}
  .chk:active{transform:scale(.88)}
  .badge{font-size:.7rem;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap}
  .badge.ok{background:var(--pos-l);color:var(--pos)} .badge.no{background:var(--neg-l);color:var(--neg)}
  .mes-h .chev{color:var(--text2);transition:transform .2s}
  .mes.open .mes-h .chev{transform:rotate(180deg)}
  .mes-b{display:none;padding:0 12px 12px}
  .mes.open .mes-b{display:block}
  .hdr,.row{display:grid;grid-template-columns:1fr 84px 78px 24px;gap:5px;align-items:center}
  .hdr{font-size:.7rem;font-weight:800;color:var(--text2);text-transform:uppercase;padding:4px 2px 6px}
  .hdr span:nth-child(2),.hdr span:nth-child(3){text-align:right}
  .row{padding:5px 0;border-top:.5px solid var(--border)}
  .row input{width:100%;min-width:0;background:var(--surface2);border:1px solid transparent;border-radius:10px;padding:9px 7px;font-size:.84rem;font-weight:700;outline:none}
  .row input:focus{border-color:var(--accent)}
  .row input.m{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
  .row input.bad{border-color:var(--neg)}
  .cu{text-align:right;font-weight:800;font-size:.8rem;color:var(--text2);font-variant-numeric:tabular-nums}
  .x{background:none;border:none;color:var(--text2);font-size:1.05rem;cursor:pointer;display:flex;align-items:center;justify-content:center;width:28px;height:32px;padding:0}
  .tot{display:grid;grid-template-columns:1fr 84px 78px 24px;white-space:nowrap;font-size:.9rem;gap:6px;align-items:center;margin-top:6px;padding:10px 0 2px;border-top:2px solid var(--border2);font-weight:800}
  .tot span:nth-child(2),.tot span:nth-child(3){text-align:right;font-variant-numeric:tabular-nums}
  .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .add{flex:1;border:1.5px dashed var(--accent);background:none;color:var(--accent);border-radius:var(--r);padding:10px;font-family:inherit;font-weight:800;font-size:.9rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
  .add.copy{border-color:var(--text2);color:var(--text2)}
  .paybtn{flex:1;border:none;border-radius:var(--r);padding:10px;font-family:inherit;font-weight:800;font-size:.9rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--neg-l);color:var(--neg)}
  .paybtn.ok{background:var(--pos);color:#fff}
  .paybtn .bx{width:20px;height:20px;border-radius:6px;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:.85rem}
  .delmes{background:none;border:none;color:var(--text2);font-family:inherit;font-size:.8rem;cursor:pointer;margin:10px auto 0;display:flex;align-items:center;gap:4px}
  .btn{border:none;border-radius:var(--r);padding:12px 16px;font-family:inherit;font-size:.95rem;font-weight:800;cursor:pointer;color:#fff;background:var(--accent);display:flex;align-items:center;justify-content:center;gap:6px;width:100%}
  .btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border2)}
  .btn.danger{background:var(--neg)}

  /* mantenimiento */
  .auto{text-align:center}
  .auto h2{font-size:1rem;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px}
  .auto h2 i{color:var(--accent)}
  .auto input.modelo{width:100%;text-align:center;background:none;border:none;font-size:1rem;font-weight:800;outline:none;padding:2px 0}
  .kmact{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px}
  .kmact label{font-size:.8rem;font-weight:800;color:var(--text2)}
  .kmact input{flex:0 0 auto;width:118px;min-width:0;background:var(--accent-light);color:var(--accent-dark);border:1px solid var(--accent);border-radius:999px;padding:7px 12px;font-size:1rem;font-weight:800;text-align:center;outline:none;font-variant-numeric:tabular-nums}
  .kmact span{font-weight:800;color:var(--accent-dark)}
  .kmfecha{font-size:.75rem;color:var(--text2);margin-top:6px;text-align:center}
  .prox h3{font-size:.85rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .prox h3 i{color:var(--accent)}
  .pr{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;margin-top:6px;font-size:.9rem;font-weight:700}
  .pr{flex-wrap:wrap;cursor:pointer;user-select:none}
  .pr .det{flex-basis:100%;display:none;font-size:.82rem;font-weight:600;color:var(--text2);margin-top:4px}
  .pr.ab .det{display:block}
  .pr b{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
  .pr.ok{background:var(--pos-l)} .pr.ok b{color:var(--pos)}
  .pr.cerca{background:var(--warn-l)} .pr.cerca b{color:var(--warn)}
  .pr.venc{background:var(--neg-l)} .pr.venc b{color:var(--neg)}
  /* cada auto es un acordeón */
  #autos{display:flex;flex-direction:column;gap:12px}
  .car{background:var(--surface);border:.5px solid var(--border);border-left:5px solid var(--accent);border-radius:18px;overflow:hidden}
  .car-h{width:100%;display:flex;align-items:center;gap:10px;padding:14px;background:none;border:none;font-family:inherit;color:var(--text);cursor:pointer;text-align:left}
  .car-h>i.ic{color:var(--accent);font-size:1.5rem}
  .car-h .ct{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .car-h .ct b{font-size:1rem;font-weight:900;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .car-h .ct small{font-size:.78rem;color:var(--text2);font-weight:700}
  .car-h .chev{color:var(--text2);transition:transform .2s}
  .car.open>.car-h .chev{transform:rotate(180deg)}
  .car-b{display:none;flex-direction:column;gap:10px;padding:0 10px 12px}
  .car.open>.car-b{display:flex}
  .car-b>.card{background:var(--surface2);border:none}
  .car-b .regs{display:flex;flex-direction:column;gap:10px}
  .car-b .del-auto{background:none;border:none;color:var(--neg);font-family:inherit;font-size:.85rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;padding:8px;margin-top:2px}
  .reg{background:var(--surface);border:.5px solid var(--border);border-left:5px solid var(--border2);border-radius:16px;overflow:hidden}
  .reg.ok{border-left-color:var(--pos)} .reg.cerca{border-left-color:var(--warn)} .reg.venc{border-left-color:var(--neg)}
  .reg-h{width:100%;display:flex;align-items:center;gap:8px;padding:12px;background:none;border:none;font-family:inherit;color:var(--text);cursor:pointer;text-align:left}
  .reg-h .rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .reg-h .rt b{font-size:.95rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .reg-h .rt small{font-size:.76rem;color:var(--text2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .reg-h .chev{color:var(--text2);transition:transform .2s}
  .reg.open .reg-h .chev{transform:rotate(180deg)}
  .badge.cerca{background:var(--warn-l);color:var(--warn)} .badge.venc{background:var(--neg-l);color:var(--neg)}
  .reg-b{display:none;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;padding:2px 12px 12px}
  .reg.open .reg-b{display:grid}
  .reg .f{display:flex;flex-direction:column;gap:3px;min-width:0}
  .reg .f.w,.reg .w{grid-column:1/-1}
  .reg .f>span{font-size:.68rem;font-weight:800;color:var(--text2);text-transform:uppercase}
  .reg input{display:block;width:100%;max-width:100%;min-width:0;background:var(--surface2);border:1px solid transparent;border-radius:10px;padding:8px 9px;font-size:.9rem;font-weight:700;outline:none;-webkit-appearance:none;appearance:none}
  .reg input[type=date]{min-height:38px;line-height:1.2;text-align:left}
  .reg input[type=date]::-webkit-date-and-time-value{text-align:left}
  .reg input:focus{border-color:var(--accent)}
  .reg input.n{text-align:right;font-variant-numeric:tabular-nums}
  .reg .tipo{font-size:1rem;font-weight:800}

  .bgm{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .bgm.show{display:flex}
  .sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:10px}
  .sheet h3{font-size:1.1rem;text-align:center}.sheet p{color:var(--text2);text-align:center}
  .two{display:flex;gap:8px}.two .btn{flex:1}
  @media (max-width:380px){.hdr,.row,.tot{grid-template-columns:1fr 86px 64px 24px} main{padding:10px}}
  #meses{display:flex;flex-direction:column;gap:12px}
  .anio{background:var(--surface);border:.5px solid var(--border);border-radius:18px;overflow:hidden}
  .anio-h{width:100%;display:flex;align-items:center;gap:10px;padding:14px 14px;background:none;border:none;font-family:inherit;color:var(--text);cursor:pointer;text-align:left}
  .anio-h .ay{font-weight:900;font-size:1.05rem;letter-spacing:.04em}
  .anio-h .ap{flex:1;font-size:.8rem;font-weight:700;color:var(--text2)}
  .anio-h .at{font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
  .anio-h .chev{color:var(--text2);transition:transform .2s}
  .anio.open>.anio-h .chev{transform:rotate(180deg)}
  .anio-b{display:none;padding:0 10px 10px;flex-direction:column;gap:10px}
  .anio.open>.anio-b{display:flex}

  /* ===== PC: más ancho, meses y mantenimientos en dos columnas ===== */
  @media (min-width:900px){
    main{max-width:1180px;padding:22px}
    .tabs{max-width:520px;width:100%;margin:0 auto}
    #tabG>.card{max-width:640px;width:100%;margin:0 auto}
    .anio.open>.anio-b{display:block !important;columns:2;column-gap:14px}
    .anio-b>.mes{break-inside:avoid;margin-bottom:12px}
    #tabG>.add{max-width:640px;width:100%;margin:0 auto}
    #tabM>.add{max-width:640px;width:100%;margin:0 auto}
    .car.open>.car-b{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
    .car-b .regs{grid-column:1/-1;display:block;columns:2;column-gap:14px}
    .car-b .regs>.reg{break-inside:avoid;margin-bottom:12px}
    .car-b>.add,.car-b>.del-auto{grid-column:1/-1;max-width:640px;width:100%;margin:0 auto}
    .hdr,.row,.tot{grid-template-columns:1fr 110px 96px 28px}
  }
  /* botón PDF a la derecha del header (solo en Mantenimiento) */
  .pdf-btn{position:absolute;right:8px;top:calc(env(safe-area-inset-top,0px) + 12px);width:40px;height:40px;border:none;background:none;color:var(--accent);font-size:1.7rem;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:10px}
  .pdf-btn[hidden]{display:none}
  .pdf-btn:active{transform:scale(.88);opacity:.8}
  .pdf-btn:disabled{opacity:.35;cursor:default}
  .pdf-btn.cargando i{animation:pdfGira 1s linear infinite !important}
  @keyframes pdfGira{to{transform:rotate(360deg)}}
</style>

<main>
  <div class="tabs desliz">
    <button id="tbG" class="on" onclick="tab('g')"><i class="ti ti-receipt"></i> Gastos</button>
    <button id="tbM" onclick="tab('m')"><i class="ti ti-tool"></i> Mantenimiento</button>
  </div>

  <section class="tab on" id="tabG">
    <div class="card"><div class="res">
      <div><small>Este mes</small><b id="rMes">$ 0</b></div>

    </div></div>

  <div class="sheet"><h3 id="dT"></h3><p id="dM"></p>
    <div class="two"><button class="btn ghost" onclick="cerrar()">Cancelar</button><button class="btn danger" id="dOk">Eliminar</button></div></div>

<script>
/* ================= utilidades ================= */
const LS='copito_v1';
const MESES=['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
function ev(x){let s=String(x??'').trim();if(!s)return 0;s=s.replace(/\.(?=\d{3}(\D|$))/g,'').replace(/,/g,'.');
  if(!/^[0-9+\-*/().\s]+$/.test(s))return NaN;try{const v=Function('"use strict";return ('+s+')')();return isFinite(v)?v:NaN}catch(e){return NaN}}
const n0=x=>{const v=ev(x);return isNaN(v)?0:v};
const fmt=n=>(n<0?'-':'')+'$ '+Math.abs(Math.round(n)).toLocaleString('es-AR');
const fkm=n=>Math.round(n).toLocaleString('es-AR');
/* fecha de hoy en hora de Argentina (toISOString usa UTC y de noche daba el día siguiente) */
const hoyLocal=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const fFecha=f=>{if(!f)return '';const [y,m,d]=f.split('-');return `${+d}/${+m}/${y}`};
const rd=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

/* ================= datos iniciales (de la planilla) ================= */
function semilla(){
  const L=(...p)=>p.map(([d,m])=>({id:uid(),d,m:m==null?'':String(m)}));
  const vacio=()=>L(['CUOTA X18'],['SEGURO'],['NAFTA Prom'],['SERVIS YPF BOX'],['COCHERA'],['CUOTA SOCIO ARG']);
  const mes=(y,k,lineas)=>({id:`m${y}_${k}`,y,k,pagado:false,lineas});
  return{
    meses:[
      mes(2026,7,L(['CUOTA X18',316000],['SEGURO',57900],['NAFTA Prom',80000],['COCHERA'],['CUOTA SOCIO ARG',13500])),
      mes(2026,8,L(['CUOTA X18',316000],['SEGURO',57900],['NAFTA Prom',80000],['SERVIS YPF BOX',18000],['COCHERA'],['CUOTA SOCIO ARG',15500])),
      mes(2026,9,L(['CUOTA X18',315794],['SEGURO',57900],['NAFTA Prom',80000],['SERVIS YPF BOX',18000],['COCHERA'],['CUOTA SOCIO ARG',15500])),
      mes(2026,10,L(['CUOTA X18',315797],['SEGURO',57900],['NAFTA Prom',80000],['SERVIS YPF BOX',18000],['CUOTA SOCIO ARG',15500],['TAZAS',36000])),
      mes(2026,11,vacio()),mes(2027,0,vacio()),mes(2027,1,vacio()),mes(2027,2,vacio()),mes(2027,3,vacio())],
    auto:{modelo:'CLIO MÍO 5P CONFORT ABS ABCP 2014',km:'216000',kmFecha:'2026-11-01'},
    mant:[

/* PDF con todo lo de la pestaña Mantenimiento: datos del auto, próximos y el historial completo */
async function exportarPDF(){
  const b=document.getElementById('bPdf');if(b.disabled)return;
  b.disabled=true;b.classList.add('cargando');b.querySelector('i').className='ti ti-loader-2';
  try{
    if(!window.jspdf)await loadScript('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js');
    const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4'});
    const W=210,H=297,MX=16,fin=H-18,acc=colorRGB(getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#1D9E75');
    const COL={venc:[226,75,74],cerca:[217,119,6],ok:[29,158,117]};
    const img=await imagenPNG('img/copito.webp?v=2');
    const hoy=new Date().toLocaleDateString('es-AR',{day:'numeric',month:'long',year:'numeric'});
    const gris=c=>doc.setTextColor(c,c,c);
    const header=()=>{
      doc.setFillColor(...acc);doc.rect(0,0,W,38,'F');
      if(img)doc.addImage(img.data,'PNG',MX-2,19-img.h/2,img.w,img.h);
      doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(20);
      doc.text('Mantenimiento',MX+38,21.5);
      doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.text('Generado el '+hoy,W-MX,33,{align:'right'});
    };
    let y;
    const nuevaPag=()=>{doc.addPage();header();y=50;};
    const titulo=t=>{if(y+16>fin)nuevaPag();
      doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(...acc);doc.text(t.toUpperCase(),MX,y);
      doc.setDrawColor(...acc);doc.setLineWidth(.5);doc.line(MX,y+2.5,W-MX,y+2.5);y+=8;};
    header();y=50;

    if(!D.autos.length){doc.setFont('helvetica','italic');doc.setFontSize(10);gris(150);doc.text('Todavía no hay autos cargados.',MX,y);}
    D.autos.forEach((A,ai)=>{
      if(ai>0)nuevaPag();
      /* --- el auto --- */
      doc.setFillColor(...mezcla(acc,.08));doc.roundedRect(MX,y-4,W-MX*2,22,3,3,'F');
      doc.setFont('helvetica','bold');doc.setFontSize(12.5);doc.setTextColor(30,30,30);
      doc.text(doc.splitTextToSize(A.modelo||'Copito',W-MX*2-70)[0],MX+5,y+3.5);
      doc.setFont('helvetica','normal');doc.setFontSize(9);gris(110);
      doc.text(A.kmFecha?'Km actualizados el '+fFecha(A.kmFecha):'Kilometraje actual',MX+5,y+10.5);
      doc.setFont('helvetica','bold');doc.setFontSize(16);doc.setTextColor(...acc);
      doc.text((A.km?fkm(n0(A.km)):'—')+' km',W-MX-5,y+6.5,{align:'right'});
      doc.setFont('helvetica','normal');doc.setFontSize(8.5);gris(110);doc.text('KM ACTUALES',W-MX-5,y+11.5,{align:'right'});
      y+=28;

      /* --- próximos --- */
      titulo('Próximos');
      const prox=proximos(A);
      if(!prox.length){doc.setFont('helvetica','italic');doc.setFontSize(9.5);gris(150);doc.text('No hay próximos cargados.',MX+2,y+1);y+=8;}
      prox.forEach(({r,e})=>{
        if(y+10>fin){nuevaPag();titulo('Próximos (cont.)');}
        const c=COL[e.c];
        doc.setFillColor(...mezcla(c,.1));doc.roundedRect(MX,y-4.5,W-MX*2,9,2,2,'F');
        doc.setFillColor(...c);doc.circle(MX+4,y-.1,1.6,'F');
        doc.setFont('helvetica','bold');doc.setFontSize(10.5);doc.setTextColor(30,30,30);doc.text(r.tipo||'Mantenimiento',MX+8,y+1.2);
        doc.setFont('helvetica','normal');doc.setFontSize(9);gris(110);
        doc.text(e.d.replace(/·/g,'-'),MX+75,y+1.2);
        doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(...c);
        doc.text(e.c==='venc'?(e.t==='Vencido'?'Vencido':'Pasado por '+e.t.replace('+','')):'Faltan '+e.t,W-MX-4,y+1.2,{align:'right'});
        y+=11;
      });
      y+=4;

      /* --- historial --- */
      const regs=regsOrd(A);
      const cab=()=>{doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(...acc);
        doc.text('FECHA',MX+2,y);doc.text('KM',MX+24,y);doc.text('QUÉ SE HIZO',MX+46,y);doc.text('COSTO',W-MX-2,y,{align:'right'});
        doc.setDrawColor(220,220,220);doc.setLineWidth(.2);doc.line(MX,y+2,W-MX,y+2);y+=7;};
      titulo('Historial de mantenimientos');cab();
      const xT=MX+46,anchoT=W-MX-2-30-xT;let total=0;
      if(!regs.length){doc.setFont('helvetica','italic');doc.setFontSize(9.5);gris(150);doc.text('Todavía no hay mantenimientos cargados.',MX+2,y);y+=8;}
      regs.forEach((r,i)=>{
        doc.setFont('helvetica','bold');doc.setFontSize(10.5);
        const tit=doc.splitTextToSize(r.tipo||'Sin título',anchoT);
        doc.setFont('helvetica','normal');doc.setFontSize(9);
        const com=r.com?doc.splitTextToSize(r.com,anchoT):[];
        const extra=[r.taller?'Taller: '+r.taller:'',r.proxKm?'Próximo: '+fkm(n0(r.proxKm))+' km':'',r.proxFecha?'Próximo: '+fFecha(r.proxFecha):''].filter(Boolean).join('   -   ');
        const ex=extra?doc.splitTextToSize(extra,anchoT):[];
        const alto=Math.max(11,4+tit.length*4.8+com.length*4+ex.length*4+3);
        if(y+alto>fin){nuevaPag();titulo('Historial (cont.)');cab();}
        if(i%2===0){doc.setFillColor(...mezcla(acc,.06));doc.rect(MX,y-4.5,W-MX*2,alto,'F');}
        doc.setFont('helvetica','bold');doc.setFontSize(9.5);doc.setTextColor(50,50,50);
        doc.text(r.fecha?fFecha(r.fecha):'Sin fecha',MX+2,y+.5);
        doc.setFont('helvetica','normal');doc.text(r.km?fkm(n0(r.km)):'—',MX+24,y+.5);
        doc.setFont('helvetica','bold');doc.setFontSize(10.5);doc.setTextColor(30,30,30);doc.text(tit,xT,y+.5);
        let yy=y+.5+tit.length*4.8;
        if(com.length){doc.setFont('helvetica','normal');doc.setFontSize(9);gris(95);doc.text(com,xT,yy-.4);yy+=com.length*4;}
        if(ex.length){doc.setFont('helvetica','normal');doc.setFontSize(8.3);gris(135);doc.text(ex,xT,yy-.4);}
        const c=n0(r.costo);total+=c;
        doc.setFont('helvetica','bold');doc.setFontSize(10.5);
        if(c){doc.setTextColor(30,30,30);doc.text(fmt(c),W-MX-2,y+.5,{align:'right'});}else{gris(160);doc.text('—',W-MX-2,y+.5,{align:'right'});}
        doc.setDrawColor(225,225,225);doc.setLineWidth(.2);doc.line(MX,y-4.5+alto,W-MX,y-4.5+alto);
        y+=alto;
      });
      if(y+16>fin)nuevaPag();
      y-=1;doc.setFillColor(...acc);doc.roundedRect(MX,y,W-MX*2,12,2.5,2.5,'F');
      doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(11);
      doc.text('TOTAL EN MANTENIMIENTO',MX+5,y+7.8);doc.setFontSize(13);doc.text(fmt(total),W-MX-5,y+7.9,{align:'right'});
    });

    const n=doc.getNumberOfPages();
    for(let p=1;p<=n;p++){doc.setPage(p);doc.setFont('helvetica','normal');doc.setFontSize(8);gris(150);
      doc.setDrawColor(230,230,230);doc.setLineWidth(.2);doc.line(MX,H-12,W-MX,H-12);
      doc.text('JuntOS · Mantenimiento',MX,H-7.5);doc.text(`Página ${p} de ${n}`,W-MX,H-7.5,{align:'right'});}

    const uno=D.autos.length===1?String(D.autos[0].modelo||'').replace(/[\\/:*?"<>|]/g,'').replace(/\s+/g,' ').trim():'';
    const nombre=(uno?'Mantenimiento - '+uno:D.autos.length>1?'Mantenimiento - autos':'Mantenimiento')+'.pdf';
    const file=new File([doc.output('blob')],nombre,{type:'application/pdf'});
    if(matchMedia('(pointer:coarse)').matches&&navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:nombre.replace(/\.pdf$/,'')});}catch(e){if(e.name!=='AbortError')doc.save(nombre);}
    }else doc.save(nombre);
  }catch(e){console.warn(e);alert('No se pudo crear el PDF. Revisá la conexión a internet y probá de nuevo.');}
  finally{b.disabled=false;b.classList.remove('cargando');b.querySelector('i').className='ti ti-file-type-pdf';}
}
function colorRGB(c){const x=document.createElement('canvas').getContext('2d');x.fillStyle='#1D9E75';x.fillStyle=c;const h=x.fillStyle;
  if(h[0]==='#')return [1,3,5].map(i=>parseInt(h.substr(i,2),16));const m=h.match(/\d+/g);return m?m.slice(0,3).map(Number):[29,158,117];}
const mezcla=(rgb,a)=>rgb.map(c=>Math.round(255-(255-c)*a));
/* la imagen de Copito como PNG con fondo transparente, sin círculo; devuelve su tamaño en mm para el header */
function imagenPNG(src){return new Promise(ok=>{const im=new Image();im.onload=()=>{try{
    const cv=document.createElement('canvas');cv.width=im.width;cv.height=im.height;cv.getContext('2d').drawImage(im,0,0);
    const h=28,w=h*im.width/im.height;ok({data:cv.toDataURL('image/png'),w,h});}catch(e){ok(null)}};im.onerror=()=>ok(null);im.src=src;});}

/* ================= confirmar ================= */
function confirmar(t,msg,cb,ok){document.getElementById('dT').textContent=t;document.getElementById('dM').textContent=msg;
  const b=document.getElementById('dOk');b.textContent=ok||'Eliminar';b.className='btn '+(ok?'':'danger');
  document.getElementById('dOk').onclick=()=>{cerrar();cb()};document.getElementById('dlg').classList.add('show');}
function cerrar(){document.getElementById('dlg').classList.remove('show')}

/* ================= guardado compartido (Firebase) =================
   Se guarda en la colección "ahorros", documento "copito", para usar las mismas reglas que ya funcionan. */
let db=null,timer=null,listo=false,avisado=false;
const ref=()=>db.collection('ahorros').doc('copito');
function fallo(e){console.warn('Copito: no se pudo guardar',e);if(avisado)return;avisado=true;
  const t=document.createElement('div');t.textContent='No se pudo guardar en la nube. Revisá la conexión.';
  t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#c0392b;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;z-index:999;font-size:.9rem';
  document.body.appendChild(t);setTimeout(()=>{t.remove();avisado=false},4000);}
/* el resto de los datos va junto; los pagos van aparte para que nadie pise el check del otro */
function guardar(){wr(LS,D);if(!db||!listo)return;clearTimeout(timer);
  timer=setTimeout(()=>ref().set({json:JSON.stringify(D),ts:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}).catch(fallo),400);}
function guardarPago(m){wr(LS,D);if(!db)return;
  ref().set({pagos:{[m.id]:m.pagado},ts:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}).catch(fallo);}
function aplicar(doc){
  if(!doc.exists){listo=true;guardar();return}
  try{const x=doc.data(),d=JSON.parse(x.json||'null');if(d&&Array.isArray(d.meses)){migrar(d);
    const pg=x.pagos||{};d.meses.forEach(m=>{if(m.id in pg)m.pagado=!!pg[m.id];});
    D=d;wr(LS,D);listo=true;
    const a=document.activeElement;if(!(a&&a.tagName==='INPUT'&&a.type!=='checkbox')){renderGastos();renderMant();}}}catch(e){}
}
function startSync(){
  ref().onSnapshot(doc=>{if(doc.metadata.hasPendingWrites)return;aplicar(doc);},e=>console.warn(e));
  /* al volver a la app (por ejemplo en el iPhone) trae lo último del servidor */
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')ref().get({source:'server'}).then(aplicar).catch(()=>{});});
}
function loadScript(src){return new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
async function initFb(){const c=window.getFbConfig&&window.getFbConfig();if(!c)return;
  try{if(typeof firebase==='undefined'){await loadScript('https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js');await loadScript('https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js');}
    if(!firebase.apps.length)firebase.initializeApp(c);db=firebase.firestore();startSync();}catch(e){}}

tab(tabAct);renderGastos();renderMant();initFb();
/* al entrar, siempre deja abierto y a la vista el mes actual */
function irMesActual(){const el=openMes&&document.getElementById('mes_'+openMes);if(el&&tabAct==='g')setTimeout(()=>el.scrollIntoView({block:'start',behavior:'smooth'}),150);}
irMesActual();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){const h=new Date(),k=h.getFullYear()*12+h.getMonth(),a=D.meses.find(m=>key(m)===k);
  if(a){openMes=a.id;aniosAb&&aniosAb.add(a.y);renderGastos();irMesActual();}}});
</script>
