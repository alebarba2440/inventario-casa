<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vacaciones">
<link rel="apple-touch-icon" href="img/apple-touch.png?v=6">
<link rel="icon" type="image/png" href="img/icono.png?v=6">
<title>Vacaciones</title>
<script src="tema.js"></script>
<script src="firebase-config.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--accent:#1D9E75;--accent-dark:#0F6E56;--accent-light:#E1F5EE;--pos:#1D9E75;--neg:#E24B4A;
        --bg:#f5f5f0;--surface:#fff;--surface2:#f5f5f0;--border:rgba(0,0,0,.1);--border2:rgba(0,0,0,.18);--text:#1a1a1a;--text2:#666;--r:12px;
        --juli:#DB2777;--juli-l:#FCE7F3;--ale:#0284C7;--ale-l:#E0F2FE;--tint:.10}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--surface:#1c1c1e;--surface2:#2c2c2e;--border:rgba(255,255,255,.1);--border2:rgba(255,255,255,.2);--text:#f5f5f5;--text2:#aaa;--juli:#F472B6;--juli-l:rgba(244,114,182,.16);--ale:#38BDF8;--ale-l:rgba(56,189,248,.16);--tint:.16}}
  :root[data-theme="dark"]{--bg:#111;--surface:#1c1c1e;--surface2:#2c2c2e;--border:rgba(255,255,255,.1);--border2:rgba(255,255,255,.2);--text:#f5f5f5;--text2:#aaa;--juli:#F472B6;--juli-l:rgba(244,114,182,.16);--ale:#38BDF8;--ale-l:rgba(56,189,248,.16);--tint:.16}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh}
  .top{background:var(--surface);border-bottom:3px solid var(--accent);padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
  .top h1{font-size:1.1rem;color:var(--accent);font-weight:800;letter-spacing:.05em}
  main{max-width:560px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:12px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 30px)}
  .pos{color:var(--pos)}.neg{color:var(--neg)}.zero{color:var(--text2)}
  .num{font-variant-numeric:tabular-nums;font-weight:800}
  input,textarea,select{font-family:inherit;color:var(--text)}

  /* buscador + botones */
  .bar{display:flex;gap:8px;align-items:center;position:relative;width:100%;max-width:560px;margin:0 auto}
  .search{flex:1;position:relative}
  .search i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text2);font-size:1.1rem}
  .search input{width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:999px;padding:11px 14px 11px 38px;font-size:.95rem;font-weight:600;outline:none}
  .search input:focus{border-color:var(--accent)}
  .results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--border2);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:20;max-height:280px;overflow-y:auto;display:none}
  .results.show{display:block}
  .results button{width:100%;display:flex;align-items:center;gap:8px;padding:12px 14px;background:none;border:none;border-bottom:.5px solid var(--border);font-family:inherit;font-size:.95rem;font-weight:700;color:var(--text);text-align:left;cursor:pointer}
  .results button:last-child{border-bottom:none}
  .results button.sel{color:var(--accent-dark);background:var(--accent-light)}
  .results button small{margin-left:auto;color:var(--text2);font-weight:600}
  .results .none{padding:14px;color:var(--text2);font-size:.9rem;text-align:center}
  .ib{width:42px;height:42px;flex-shrink:0;border:none;background:none;color:var(--accent);font-size:1.5rem;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:10px}
  .ib:active{transform:scale(.88)}
  .ib.del{color:var(--neg)}
  .ib:disabled{opacity:.3;cursor:default}

  /* cabecera del viaje */
  .trip{background:var(--surface);border:.5px solid var(--border);border-radius:16px;padding:14px}
  .trip h2{font-size:1.25rem;font-weight:800;text-transform:uppercase;letter-spacing:.03em;display:flex;align-items:center;gap:8px}
  .trip h2 i{color:var(--accent)}
  .trip .th{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .trip .th h2{min-width:0}
  .trip .th .chip{flex-shrink:0;white-space:nowrap}
  .chip{font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--accent-light);color:var(--accent-dark)}
  .trip .nota{margin-top:8px;font-size:.88rem;color:var(--text2);white-space:pre-wrap}
  .resumen{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .resumen div{background:var(--surface2);border-radius:var(--r);padding:9px 10px}
  .resumen small{display:block;font-size:.72rem;color:var(--text2);font-weight:700}
  .resumen b{font-size:1.02rem;font-weight:800;font-variant-numeric:tabular-nums}
  .resumen .wide{grid-column:1/-1}
  .resumen small.rx{font-size:.78rem;margin-top:1px}

  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);border:.5px solid var(--border);border-radius:999px;padding:5px;width:100%;max-width:560px;margin:0 auto}
  .tabs button{border:none;background:none;border-radius:999px;padding:11px 8px;font-family:inherit;font-size:.95rem;font-weight:800;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
  .tabs button.on{background:var(--accent);color:#fff}
  .cmp{display:flex;justify-content:space-between;gap:8px;margin-top:6px;padding:0 4px;font-size:.8rem;color:var(--text2);font-weight:700}
  .cmp b{font-weight:800;color:var(--text)}
  .cmp b.pos{color:var(--pos)} .cmp b.neg{color:var(--neg)}
  .dia{border:1px solid var(--border2);border-radius:14px;margin-bottom:8px;overflow:hidden;background:var(--surface)}
  .dia-h{width:100%;display:flex;align-items:center;gap:8px;padding:11px 12px;background:color-mix(in srgb,var(--c) calc(var(--tint)*100%),transparent);border:none;font-family:inherit;color:var(--text);cursor:pointer;text-align:left}
  .dia-h .dn{flex:1;min-width:0;font-weight:800;font-size:.95rem;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dia-h .dtt{font-size:.82rem;font-weight:700;color:var(--text2);font-variant-numeric:tabular-nums}
  .dia-h .dd{font-size:.85rem;font-weight:800;font-variant-numeric:tabular-nums;padding:3px 8px;border-radius:999px;white-space:nowrap}
  .dia-h .dd.pos{color:var(--pos);background:color-mix(in srgb,var(--pos) 14%,transparent)} .dia-h .dd.neg{color:var(--neg);background:color-mix(in srgb,var(--neg) 14%,transparent)} .dia-h .dd.zero{color:var(--text2)}
  .dia-h .chev{color:var(--text2);transition:transform .2s}
  .dia.open .dia-h .chev{transform:rotate(180deg)}
  .dia-b{display:none;padding:10px 12px 12px}
  .dia.open .dia-b{display:block}
  .dmon{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-bottom:8px;font-size:.78rem;font-weight:700;color:var(--text2)}
  .dmon button{border:1.5px solid var(--c);background:none;color:var(--c);border-radius:999px;padding:4px 12px;font-family:inherit;font-weight:800;font-size:.8rem;cursor:pointer}
  .dmon button.on{background:var(--c);color:#fff}
  .fd{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
  .fd span{font-size:.7rem;font-weight:800;color:var(--text2);text-transform:uppercase}
  .fd input{width:100%;background:var(--surface2);border:1px solid transparent;border-radius:10px;padding:9px 10px;font-size:.95rem;font-weight:800;outline:none;color:var(--text)}
  .fd input:focus{border-color:var(--c)}
  .delmes{background:none;border:none;color:var(--text2);font-family:inherit;font-size:.8rem;cursor:pointer;margin:10px auto 0;display:flex;align-items:center;gap:4px}
  .vs{display:flex;justify-content:space-between;gap:8px;margin-top:5px;padding:0 2px;font-size:.76rem;color:var(--text2);font-weight:700}
  .vs b{font-weight:800;color:var(--text)} .vs b.pos{color:var(--pos)} .vs b.neg{color:var(--neg)} .vs b.zero{color:var(--text2)}
  /* acordeones con color propio */
  .acc{--c:var(--accent);background:var(--surface);border:.5px solid var(--border);border-left:5px solid var(--c);border-radius:16px;overflow:hidden}
  .acc-h{width:100%;display:flex;align-items:center;gap:8px;padding:14px;background:color-mix(in srgb,var(--c) calc(var(--tint)*100%),transparent);border:none;font-family:inherit;color:var(--text);font-size:1rem;font-weight:800;cursor:pointer;text-align:left}
  .acc-h i.ic{color:var(--c);font-size:1.25rem}
  .acc-h .sum{margin-left:auto;font-size:.88rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--c);text-align:right}
  .acc-h .chev{color:var(--text2);transition:transform .2s}
  .acc.open .acc-h .chev{transform:rotate(180deg)}
  .acc-b{display:none;padding:12px 12px 14px}
  .acc.open .acc-b{display:block}
  .a-est{--c:#2563EB}.a-aho{--c:#16A34A}.a-exc{--c:#EA580C}.a-dia{--c:#CA8A04}.a-rea{--c:#DC2626}.a-com{--c:#9333EA}.a-ruta{--c:#0891B2}

  /* filas de gastos */
  .hdr,.row{display:grid;align-items:center;gap:6px}
  .two .hdr,.two .row{grid-template-columns:1fr 92px 44px 84px 26px}
  .one .hdr,.one .row{grid-template-columns:1fr 110px 26px}
  .hdr{font-size:.7rem;font-weight:800;color:var(--text2);text-transform:uppercase;padding:0 2px 6px}
  .hdr span:not(:first-child){text-align:right}
  .row{padding:5px 0;border-top:.5px solid var(--border)}
  .row input{width:100%;min-width:0;background:var(--surface2);border:1px solid transparent;border-radius:10px;padding:9px 8px;font-size:.9rem;font-weight:600;outline:none}
  .row input:focus{border-color:var(--c)}
  .row input.m{text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
  .row input.bad{border-color:var(--neg)}
  .cur{height:36px;border-radius:10px;border:1.5px solid var(--c);background:none;color:var(--c);font-family:inherit;font-weight:800;font-size:.78rem;cursor:pointer}
  .cur.ext{background:var(--c);color:#fff}
  .conv{text-align:center;font-size:.85rem;font-weight:800;color:var(--text2);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .x{background:none;border:none;color:var(--text2);font-size:1.05rem;cursor:pointer;display:flex;align-items:center;justify-content:center;width:28px;height:32px;flex-shrink:0;padding:0}
  .tot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:11px 12px;border-radius:var(--r);background:color-mix(in srgb,var(--c) calc(var(--tint)*100%),transparent);font-weight:800}
  .tot .v{text-align:right;font-variant-numeric:tabular-nums}
  .tot .v small{display:block;font-size:.78rem;color:var(--text2)}
  .add{margin-top:10px;width:100%;border:1.5px dashed var(--c);background:none;color:var(--c);border-radius:var(--r);padding:10px;font-family:inherit;font-weight:800;font-size:.9rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
  .hint{font-size:.76rem;color:var(--text2);margin-top:8px;line-height:1.35}
  .empty{text-align:center;color:var(--text2);font-size:.88rem;padding:8px 0}

  /* ahorro Juli / Ale */
  .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
  .col{border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
  .col.j{background:var(--juli-l)} .col.a{background:var(--ale-l)}
  .col h4{text-align:center;font-size:.85rem;font-weight:800;letter-spacing:.05em}
  .col.j h4,.col.j .ct{color:var(--juli)} .col.a h4,.col.a .ct{color:var(--ale)}
  .col .ar{display:flex;gap:4px;align-items:center}
  .col .ar input{flex:1;min-width:0;width:100%;background:var(--surface);border:1px solid transparent;border-radius:10px;padding:9px 8px;font-size:.9rem;font-weight:800;text-align:center;outline:none;font-variant-numeric:tabular-nums}
  .col .ar input:focus{border-color:var(--c)}
  .col .add{margin-top:2px;padding:8px}
  .col.j .add{border-color:var(--juli);color:var(--juli)} .col.a .add{border-color:var(--ale);color:var(--ale)}
  .col .ct{text-align:center;font-weight:800;font-size:1.05rem;font-variant-numeric:tabular-nums;border-top:1px dashed var(--border2);padding-top:6px}

  .it{padding:8px 0;border-top:.5px solid var(--border)}
  .it:first-child{border-top:none;padding-top:0}
  .it input{width:100%;min-width:0;background:var(--surface2);border:1px solid transparent;border-radius:10px;padding:9px 10px;font-size:.92rem;font-weight:700;outline:none}
  .it input:focus{border-color:var(--c)}
  .it input.m{text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
  .it input.bad{border-color:var(--neg)}
  .l1{display:flex;gap:6px;align-items:center}
  .l1 input{flex:1}
  .l1 .dif{min-width:90px}
  .l2{display:grid;grid-template-columns:1fr 52px 1fr;gap:6px;align-items:center;margin-top:6px}
  .l2.noext{grid-template-columns:1fr}
  .l2 .cur{height:38px}
  .conv{font-size:.92rem}
  /* comida por día */
  .com .hdr,.com .row{grid-template-columns:1fr 88px 44px 86px 26px}
  .com.one .hdr,.com.one .row{grid-template-columns:1fr 100px 92px 26px}
  .dif{text-align:right;font-weight:800;font-size:.85rem;font-variant-numeric:tabular-nums}

  /* ruta */
  .rl{display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-top:.5px solid var(--border)}
  .rl:first-child{border-top:none}
  .rn{flex-shrink:0;width:24px;height:24px;margin-top:7px;border-radius:50%;background:var(--c);color:#fff;font-size:.75rem;font-weight:800;display:flex;align-items:center;justify-content:center}
  .rl textarea{flex:1;min-width:0;background:var(--surface2);border:1px solid transparent;border-radius:10px;padding:9px 10px;font-size:.93rem;font-weight:600;line-height:1.4;outline:none;resize:none;overflow:hidden}
  .rl textarea:focus{border-color:var(--c)}
  .rl .x{margin-top:8px}
  h5.sub{font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--c);margin:2px 0 8px;display:flex;align-items:center;gap:6px}

  /* vacío */
  .vacio{text-align:center;padding:30px 16px;color:var(--text2)}
  .vacio b{display:block;color:var(--text);font-size:1.1rem;margin-bottom:6px}
  .btn{border:none;border-radius:var(--r);padding:12px 16px;font-family:inherit;font-size:.95rem;font-weight:800;cursor:pointer;color:#fff;background:var(--accent);display:inline-flex;align-items:center;justify-content:center;gap:6px}
  .btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border2)}
  .btn.danger{background:var(--neg)}

  /* ventana crear / editar */
  .bgm{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .bgm.show{display:flex}
  .sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:12px;max-height:90dvh;overflow-y:auto}
  .sheet h3{font-size:1.15rem;text-align:center}
  .sheet p{color:var(--text2);text-align:center;line-height:1.4}
  .fld{display:flex;flex-direction:column;gap:5px}
  .fld>span{font-size:.8rem;font-weight:800;color:var(--text2)}
  .fld input,.fld textarea{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r);padding:11px 12px;font-size:1rem;font-weight:600;outline:none;width:100%}
  .fld input:focus,.fld textarea:focus{border-color:var(--accent)}
  .fld textarea{min-height:80px;resize:vertical}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .seg button{padding:10px 4px;border-radius:10px;border:1.5px solid var(--border2);background:var(--surface);font-family:inherit;font-size:.82rem;font-weight:700;color:var(--text);cursor:pointer;line-height:1.2}
  .seg button b{display:block;font-size:1rem}
  .seg button.on{border-color:var(--accent);background:var(--accent-light);color:var(--accent-dark)}
  .cot{display:flex;align-items:center;gap:8px;font-weight:800}
  .cot input{flex:1}
  .two-b{display:flex;gap:8px}.two-b .btn{flex:1}
  @media (max-width:380px){
    .two .hdr,.two .row{grid-template-columns:1fr 80px 40px 74px 22px}
    .com .hdr,.com .row{grid-template-columns:1fr 76px 40px 76px 22px}
    main{padding:10px}
  }
  #body{display:flex;flex-direction:column;gap:10px;padding-bottom:45vh}

  /* ===== PC: resumen del viaje fijo a la izquierda, acordeones a la derecha ===== */
  @media (min-width:900px){
    main{max-width:1180px;padding:22px}
    #body{display:grid !important;grid-template-columns:380px minmax(0,1fr);gap:16px;align-items:start}
    #body>.trip{grid-column:1;grid-row:1 / span 20;position:sticky;top:90px}
    #body>.acc{grid-column:2}
    .two .hdr,.two .row{grid-template-columns:1fr 130px 54px 130px 30px}
    .l2{grid-template-columns:minmax(0,1fr) 60px minmax(0,1fr)}
  }
</style>

</head>
<body>
<div class="top">
  <a class="home-link" href="index.html" aria-label="Volver al inicio"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.707 2.293l9 9c.63 .63 .184 1.707 -.707 1.707h-1v6a3 3 0 0 1 -3 3h-1v-7a3 3 0 0 0 -2.824 -2.995l-.176 -.005h-2a3 3 0 0 0 -3 3v7h-1a3 3 0 0 1 -3 -3v-6h-1c-.89 0 -1.337 -1.077 -.707 -1.707l9 -9a1 1 0 0 1 1.414 0m.293 11.707a1 1 0 0 1 1 1v7h-4v-7a1 1 0 0 1 .883 -.993l.117 -.007z"/></svg></a>
  <h1>VACACIONES</h1>
</div>

<main>
  <div class="bar">
    <div class="search">
      <i class="ti ti-search"></i>
      <input type="search" id="q" placeholder="Buscar vacación…" autocomplete="off" aria-label="Buscar vacación">
      <div class="results" id="res"></div>
    </div>
    <button class="ib" onclick="abrirForm(false)" aria-label="Agregar vacación"><i class="ti ti-circle-plus-filled"></i></button>
    <button class="ib" id="bEdit" onclick="abrirForm(true)" aria-label="Editar vacación"><i class="ti ti-edit"></i></button>
    <button class="ib del" id="bDel" onclick="borrarViaje()" aria-label="Eliminar vacación"><i class="ti ti-trash"></i></button>
  </div>
  <div class="tabs" id="tabs"><button data-t="e" onclick="setTab('e')"><i class="ti ti-calculator"></i> Estimado</button><button data-t="r" onclick="setTab('r')"><i class="ti ti-receipt"></i> Real</button></div>
  <div id="body"></div>
</main>

<!-- crear / editar vacación -->
<div class="bgm" id="form" onclick="if(event.target===this)cerrar('form')">
  <div class="sheet">
    <h3 id="fT">Nueva vacación</h3>
    <label class="fld"><span>Lugar</span><input type="text" id="fLugar" placeholder="ej: Pipa, Brasil"></label>
    <div class="fld"><span>Moneda que se usa</span>
      <div class="seg" id="fMon">
        <button data-m="ARS" onclick="setMon('ARS')"><b>$</b>Pesos argentinos</button>
        <button data-m="USD" onclick="setMon('USD')"><b>US$</b>Dólares</button>
        <button data-m="BRL" onclick="setMon('BRL')"><b>R$</b>Reales</button>
      </div>
    </div>
    <label class="fld" id="fCotW"><span>Cotización (para la conversión automática)</span>
      <span class="cot"><span id="fCotL">1 R$ =</span> $ <input type="text" inputmode="decimal" id="fCot" placeholder="0"></span></label>
    <label class="fld"><span>Nota</span><textarea id="fNota" placeholder="Por las dudas…"></textarea></label>
    <div class="two-b"><button class="btn ghost" onclick="cerrar('form')">Cancelar</button><button class="btn" onclick="guardarForm()">Guardar</button></div>
  </div>
</div>

<!-- confirmar -->
<div class="bgm" id="dlg" onclick="if(event.target===this)cerrar('dlg')">
  <div class="sheet">
    <h3 id="dT"></h3><p id="dM"></p>
    <div class="two-b"><button class="btn ghost" onclick="cerrar('dlg')">Cancelar</button><button class="btn danger" id="dOk">Eliminar</button></div>
  </div>
</div>

<script>
/* ================= utilidades ================= */
const LS='viajes_v1',LS_SEL='viaje_sel';
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const SIM={ARS:'$',USD:'US$',BRL:'R$'},NOM={ARS:'Pesos',USD:'Dólares',BRL:'Reales'};
/* "28000+22000" -> 50000. Acepta 1.500.000 (puntos de miles) y coma decimal */
function ev(x){
  let s=String(x??'').trim();if(!s)return 0;
  s=s.replace(/\.(?=\d{3}(\D|$))/g,'').replace(/,/g,'.');
  if(!/^[0-9+\-*/().\s]+$/.test(s))return NaN;
  try{const v=Function('"use strict";return ('+s+')')();return isFinite(v)?v:NaN}catch(e){return NaN}
}
const n0=x=>{const v=ev(x);return isNaN(v)?0:v};
/* muestra 1250000 como 1.250.000 (si es un número solo; las sumas como 56+8 quedan como están) */
const cp=v=>{const c=String(v??'').replace(/\./g,'');return /^\d+$/.test(c)?(+c).toLocaleString('es-AR'):String(v??'');};
function miles(el){const c=el.value.replace(/\./g,'');if(/^\d+$/.test(c)){const f=(+c).toLocaleString('es-AR');if(el.value!==f)el.value=f;return c;}return el.value;}
const fmt=(n,m='ARS')=>{if(!isFinite(n))return '—';const d=m==='ARS'?0:2;
  return (n<0?'-':'')+SIM[m]+' '+Math.abs(n).toLocaleString('es-AR',{maximumFractionDigits:d,minimumFractionDigits:0});};
const cls=n=>n>0?'pos':n<0?'neg':'zero';
const rd=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

/* ================= estado ================= */
let viajes=rd(LS,[]);if(!Array.isArray(viajes))viajes=[];
let selId=rd(LS_SEL,null);
const LISTAS=['gastos','exc','diario']; // mismas filas en Estimado y en Real
/* cada fila tiene el monto estimado (monto/ext) y el real (rmonto/rext) */
function normalizar(v){
  if(!v)return v;
  if(!Array.isArray(v.ruta))v.ruta=String(v.ruta||'').split('\n').map(t=>t.trim()).filter(Boolean).map(texto=>({id:uid(),texto}));
  if(!v.v3){v.e_gastos=v.est||[];v.e_exc=v.exc||[];v.e_com=v.dia||[];v.r_gastos=v.real||[];v.r_exc=[];v.r_com=v.com||[];
    delete v.est;delete v.exc;delete v.dia;delete v.real;delete v.com;v.v3=true;}
  if(!v.v4){ // juntar Estimado y Real en una sola lista por sección
    const unir=(est,rea)=>{const out=(est||[]).map(x=>({id:x.id||uid(),label:x.label||'',monto:x.monto||'',ext:!!x.ext,rmonto:'',rext:!!x.ext}));
      (rea||[]).forEach(r=>{const m=out.find(o=>o.label.trim().toLowerCase()===String(r.label||'').trim().toLowerCase()&&!o.rmonto);
        if(m){m.rmonto=r.monto||'';m.rext=!!r.ext;}else out.push({id:r.id||uid(),label:r.label||'',monto:'',ext:!!r.ext,rmonto:r.monto||'',rext:!!r.ext});});
      return out;};
    v.gastos=unir(v.e_gastos,v.r_gastos);v.exc=unir(v.e_exc,v.r_exc);v.diario=unir(v.e_com,[]);
    v.dias=(v.r_com||[]).map(x=>({id:x.id||uid(),label:x.label||'',monto:x.monto||'',ext:!!x.ext}));
    ['e_gastos','e_exc','e_com','r_gastos','r_exc','r_com'].forEach(k=>delete v[k]);v.v4=true;
  }
  [...LISTAS,'dias'].forEach(k=>{if(!Array.isArray(v[k]))v[k]=[]});
  // días del formato anterior (un monto por día) -> día con un concepto "Total"
  v.dias=v.dias.map(d=>Array.isArray(d.items)?d:{id:d.id||uid(),label:d.label||'',items:(String(d.monto||'').trim()?[{id:uid(),label:'Total',monto:d.monto,ext:!!d.ext}]:[])});
  if(!v.aho)v.aho={j:[],a:[]};
  return v;
}
viajes.forEach(normalizar);
const cur=()=>viajes.find(v=>v.id===selId)||null;
function nuevoViaje(lugar,moneda,cot,nota){
  const ext=moneda!=='ARS',it=(label,e)=>({id:uid(),label,monto:'',ext:e,rmonto:'',rext:e});
  return{id:'v2_'+uid(),ver:2,v3:true,v4:true,creado:Date.now(),lugar,moneda,cot,nota,
    gastos:[it('Viaje + seguro',false),it('Alojamiento',false),it('Transfers',false)],exc:[],
    diario:[it('Desayuno',ext),it('Almuerzo',ext),it('Cena',ext)],dias:[],
    aho:{j:[{id:uid(),monto:''}],a:[{id:uid(),monto:''}]},ruta:[]};
}
let tab=rd('viaje_tab','e');if(tab!=='e'&&tab!=='r')tab='e';
let openAcc='gastos';

/* ================= cálculos ================= */
function cotOf(v){return v.moneda==='ARS'?1:(n0(v.cot)||0)}
const campos=modo=>modo==='r'?['rmonto','rext']:['monto','ext'];
function enPesos(v,it,modo){const [m,e]=campos(modo),x=n0(it[m]);return it[e]&&v.moneda!=='ARS'?x*cotOf(v):x}
function totLista(v,lista,modo){return (v[lista]||[]).reduce((a,it)=>a+enPesos(v,it,modo),0)}
function aExt(v,ars){const c=cotOf(v);return c?ars/c:NaN}
function calcular(v){
  const K={};
  LISTAS.forEach(l=>{K['e_'+l]=totLista(v,l,'e');K['r_'+l]=totLista(v,l,'r');});
  K.dia={};K.dias=0;v.dias.forEach(d=>{const t=d.items.reduce((a,it)=>a+enPesos(v,it,'e'),0);K.dia[d.id]=t;K.dias+=t;});
  K.diasEst=K.e_diario*v.dias.length;
  K.e=K.e_gastos+K.e_exc;               // estimado del viaje (el diario se compara día por día)
  K.r=K.r_gastos+K.r_exc+K.dias;        // lo gastado de verdad
  K.ahJ=v.aho.j.reduce((a,x)=>a+n0(x.monto),0);K.ahA=v.aho.a.reduce((a,x)=>a+n0(x.monto),0);K.aho=K.ahJ+K.ahA;
  K.bal=K.aho-K.e;K.rest=K.aho-K.r;
  return K;
}

/* ================= buscador ================= */
const q=document.getElementById('q'),res=document.getElementById('res');
function listar(){
  const t=q.value.trim().toLowerCase();
  const l=viajes.slice().sort((a,b)=>(b.creado||0)-(a.creado||0)).filter(v=>!t||v.lugar.toLowerCase().includes(t)||(v.nota||'').toLowerCase().includes(t));
  res.innerHTML=l.length?l.map(v=>`<button class="${v.id===selId?'sel':''}" onmousedown="event.preventDefault()" onclick="elegir('${v.id}')"><i class="ti ti-map-pin"></i>${esc(v.lugar)}<small>${SIM[v.moneda]}</small></button>`).join('')
    :`<div class="none">${viajes.length?'No hay coincidencias':'Todavía no hay vacaciones. Tocá + para agregar.'}</div>`;
  res.classList.add('show');
}
q.addEventListener('focus',listar);q.addEventListener('input',listar);
q.addEventListener('blur',()=>setTimeout(()=>res.classList.remove('show'),120));
function elegir(id){selId=id;wr(LS_SEL,id);q.value='';res.classList.remove('show');q.blur();openAcc='gastos';render();}
/* al cambiar de pestaña queda abierto el mismo acordeón y en el mismo lugar de la pantalla */
function setTab(t){
  if(t===tab)return;
  const antes=openAcc&&document.getElementById('acc-'+openAcc),y=antes?antes.getBoundingClientRect().top:null;
  tab=t;wr('viaje_tab',t);
  if(openAcc==='diario'&&t==='r')openAcc='dias';else if(openAcc==='dias'&&t==='e')openAcc='diario';
  render();
  const ahora=openAcc&&document.getElementById('acc-'+openAcc);
  if(ahora){if(y!==null)window.scrollBy(0,ahora.getBoundingClientRect().top-y);
    const t=ahora.getBoundingClientRect().top;if(t<70||t>window.innerHeight*0.6)window.scrollBy(0,t-80);}
}

/* ================= crear / editar ================= */
let editando=false,monSel='ARS';
function abrir(id){document.getElementById(id).classList.add('show')}
function cerrar(id){document.getElementById(id).classList.remove('show')}
function setMon(m){monSel=m;document.querySelectorAll('#fMon button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  document.getElementById('fCotW').style.display=m==='ARS'?'none':'';document.getElementById('fCotL').textContent='1 '+SIM[m]+' =';}
function abrirForm(edit){
  const v=cur();if(edit&&!v)return;editando=edit;
  document.getElementById('fT').textContent=edit?'Editar vacación':'Nueva vacación';
  document.getElementById('fLugar').value=edit?v.lugar:'';
  document.getElementById('fCot').value=edit&&v.cot?v.cot:'';
  document.getElementById('fNota').value=edit?(v.nota||''):'';
  setMon(edit?v.moneda:'ARS');abrir('form');
  setTimeout(()=>document.getElementById('fLugar').focus(),50);
}
function guardarForm(){
  const lugar=document.getElementById('fLugar').value.trim();
  if(!lugar){document.getElementById('fLugar').focus();return;}
  const cot=document.getElementById('fCot').value.trim(),nota=document.getElementById('fNota').value.trim();
  if(editando){const v=cur();Object.assign(v,{lugar,moneda:monSel,cot,nota});
    if(monSel==='ARS')[...LISTAS,'dias'].forEach(l=>v[l].forEach(it=>{it.ext=false;it.rext=false}));guardar(v);}
  else{const v=nuevoViaje(lugar,monSel,cot,nota);viajes.push(v);selId=v.id;wr(LS_SEL,selId);openAcc='gastos';guardar(v);}
  cerrar('form');render();
}
function borrarViaje(){
  const v=cur();if(!v)return;
  document.getElementById('dT').textContent='Eliminar vacación';
  document.getElementById('dM').textContent=`¿Eliminar "${v.lugar}" con todos sus datos?`;
  document.getElementById('dOk').onclick=()=>{
    viajes=viajes.filter(x=>x.id!==v.id);wr(LS,viajes);
    if(db)db.collection(COL).doc(v.id).delete().catch(()=>{});
    selId=viajes.length?viajes.slice().sort((a,b)=>(b.creado||0)-(a.creado||0))[0].id:null;wr(LS_SEL,selId);
    cerrar('dlg');render();
  };abrir('dlg');
}

/* ================= edición de filas ================= */
function item(lista,id){return cur()[lista].find(x=>x.id===id)}
function setF(lista,id,campo,el){
  const it=item(lista,id);it[campo]=(campo==='monto'||campo==='rmonto')?miles(el):el.value;
  if(campo==='monto'||campo==='rmonto')el.classList.toggle('bad',isNaN(ev(el.value)));
  if(campo==='label')document.querySelectorAll(`[data-lb="${id}"]`).forEach(x=>{if(x!==el)x.value=el.value});
  cambio();
}
function toggleExt(lista,id,campo){const it=item(lista,id);it[campo]=!it[campo];cambio();render();}
function agregar(lista){const v=cur(),e=v.moneda!=='ARS'&&lista!=='gastos';
  v[lista].push(lista==='dias'?{id:uid(),label:'',monto:'',ext:e}:{id:uid(),label:'',monto:'',ext:e,rmonto:'',rext:e});cambio();
  render(()=>{const r=document.querySelectorAll(`#acc-${lista} .it input:not(.m),#acc-${lista} .row input:not(.m)`);if(r.length)r[r.length-1].focus();});}
function quitar(lista,id){const v=cur(),it=item(lista,id);
  const borrar=()=>{v[lista]=v[lista].filter(x=>x.id!==id);cambio();render();};
  if(lista!=='dias'&&(n0(it.monto)||n0(it.rmonto))){document.getElementById('dT').textContent='Borrar';
    document.getElementById('dM').textContent=`"${it.label||'Este ítem'}" se borra de Estimado y de Real.`;
    document.getElementById('dOk').onclick=()=>{cerrar('dlg');borrar()};abrir('dlg');}
  else borrar();
}
let openDia;
let diaMon=rd('dia_mon','ext'); // 'ext' = moneda del viaje (ej. R$), 'ARS' = pesos
function setDiaMon(m){diaMon=m;wr('dia_mon',m);document.querySelectorAll('.dmon button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));recalc();}
const dia=id=>cur().dias.find(d=>d.id===id);
function agregarDia(){const v=cur(),e=v.moneda!=='ARS';
  // el día nuevo arranca con los mismos conceptos del gasto diario estimado
  const d={id:uid(),label:'',items:v.diario.map(x=>({id:uid(),label:x.label,monto:'',ext:x.ext}))};
  if(!d.items.length)d.items.push({id:uid(),label:'',monto:'',ext:e});
  v.dias.push(d);openDia=d.id;cambio();render(()=>{const el=document.querySelector(`#dia_${d.id} .dlabel`);if(el){el.scrollIntoView({block:'center'});el.focus();}});}
function toggleDia(id){openDia=openDia===id?null:id;
  document.querySelectorAll('.dia').forEach(el=>{const o=el.id==='dia_'+openDia;el.classList.toggle('open',o);el.querySelector('.dia-h').setAttribute('aria-expanded',o)});}
function setDia(id,el){dia(id).label=el.value;const h=document.querySelector(`#dia_${id} .dn`);if(h)h.textContent=el.value||'Día sin nombre';cambio(false);}
function quitarDia(id){const d=dia(id);document.getElementById('dT').textContent='Borrar día';
  document.getElementById('dM').textContent=`¿Borrar "${d.label||'este día'}" con sus gastos?`;
  document.getElementById('dOk').onclick=()=>{cerrar('dlg');cur().dias=cur().dias.filter(x=>x.id!==id);cambio();render();};abrir('dlg');}
function agregarConc(did){const v=cur();dia(did).items.push({id:uid(),label:'',monto:'',ext:v.moneda!=='ARS'});cambio();
  render(()=>{const r=document.querySelectorAll(`#dia_${did} .it input:not(.m)`);if(r.length)r[r.length-1].focus();});}
function setConc(did,cid,campo,el){const it=dia(did).items.find(x=>x.id===cid);it[campo]=campo==='monto'?miles(el):el.value;
  if(campo==='monto')el.classList.toggle('bad',isNaN(ev(el.value)));cambio();}
function extConc(did,cid){const it=dia(did).items.find(x=>x.id===cid);it.ext=!it.ext;cambio();render();}
function quitarConc(did,cid){const d=dia(did);d.items=d.items.filter(x=>x.id!==cid);cambio();render();}
function setAho(p,id,el){cur().aho[p].find(x=>x.id===id).monto=miles(el);el.classList.toggle('bad',isNaN(ev(el.value)));cambio();}
function agregarAho(p){cur().aho[p].push({id:uid(),monto:''});cambio();render(()=>{const r=document.querySelectorAll(`.col.${p} input`);if(r.length)r[r.length-1].focus();});}
function quitarAho(p,id){const v=cur();v.aho[p]=v.aho[p].filter(x=>x.id!==id);if(!v.aho[p].length)v.aho[p].push({id:uid(),monto:''});cambio();render();}
function cambio(re=true){const v=cur();guardar(v);if(re)recalc();}
function toggleAcc(k){openAcc=openAcc===k?null:k;
  document.querySelectorAll('.acc').forEach(a=>{const o=a.id==='acc-'+openAcc;a.classList.toggle('open',o);a.querySelector('.acc-h').setAttribute('aria-expanded',o)});}

/* ================= dibujar ================= */
/* modo 'e' = estimado, 'r' = real (misma fila, otro monto) */
function filas(v,lista,ph,modo){
  const ext=v.moneda!=='ARS',S=SIM[v.moneda],[mc,ec]=campos(modo),real=modo==='r'&&lista!=='dias';
  if(!v[lista].length)return '<p class="empty">Sin ítems todavía</p>';
  return v[lista].map(it=>`<div class="it">
      <div class="l1"><input type="text" data-lb="${it.id}" value="${esc(it.label)}" placeholder="${ph}" oninput="setF('${lista}','${it.id}','label',this)">
        ${lista==='dias'?`<span class="dif" data-dd="${it.id}"></span>`:''}
        <button class="x" onclick="quitar('${lista}','${it.id}')" aria-label="Borrar"><i class="ti ti-trash"></i></button></div>
      <div class="l2${ext?'':' noext'}"><input type="text" class="m" inputmode="decimal" value="${esc(cp(it[mc]))}" placeholder="${real?'Real':'0'}" oninput="setF('${lista}','${it.id}','${mc}',this)">
        ${ext?`<button class="cur${it[ec]?' ext':''}" onclick="toggleExt('${lista}','${it.id}','${ec}')" aria-label="Moneda">${it[ec]?S:'$'}</button>
        <span class="conv" data-cv="${lista}:${it.id}:${modo}"></span>`:''}</div>
      ${real?`<div class="vs"><span>Estimado <b data-ve="${lista}:${it.id}"></b></span><span>Diferencia <b data-vd="${lista}:${it.id}"></b></span></div>`:''}
    </div>`).join('');
}
const addB=(lista,txt)=>`<button class="add" onclick="agregar('${lista}')"><i class="ti ti-plus"></i> ${txt}</button>`;
const acc=(k,cl,ic,titulo,inner)=>`<section class="acc ${cl}${openAcc===k?' open':''}" id="acc-${k}">
  <button class="acc-h" onclick="toggleAcc('${k}')" aria-expanded="${openAcc===k}"><i class="ti ti-${ic} ic"></i>${titulo}<span class="sum" data-h="${k}"></span><i class="ti ti-chevron-down chev"></i></button>
  <div class="acc-b">${inner}</div></section>`;
const totRow=(label,k)=>`<div class="tot"><span>${label}</span><span class="v"><span data-t="${k}"></span><small data-tx="${k}"></small></span></div>`;

function render(after){
  const v=cur(),body=document.getElementById('body');
  document.getElementById('bEdit').disabled=!v;document.getElementById('bDel').disabled=!v;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  document.getElementById('tabs').style.display=v?'':'none';
  if(!v){body.innerHTML=`<div class="trip vacio"><b>${viajes.length?'Elegí una vacación':'Todavía no hay vacaciones'}</b>${viajes.length?'Buscala arriba.':'Tocá <i class="ti ti-circle-plus-filled" style="color:var(--accent)"></i> para crear la primera.'}</div>`;return;}
  const ext=v.moneda!=='ARS',S=SIM[v.moneda],R=tab==='r';
  const trip=`<div class="trip">
    <div class="th"><h2><i class="ti ti-map-pin-filled"></i>${esc(v.lugar)}</h2>${ext?`<span class="chip">1 ${S} = ${fmt(n0(v.cot))}</span>`:''}</div>
    ${v.nota?`<div class="nota">${esc(v.nota)}</div>`:''}
    <div class="resumen">
      <div><small>Plata ahorrada</small><b data-r="aho"></b><small class="rx" data-rx="aho"></small></div>
      <div><small>Gasto estimado</small><b data-r="e"></b><small class="rx" data-rx="e"></small></div>
      <div class="wide"><small>BALANCE (ahorrado − estimado)</small><b data-r="bal"></b><small class="rx" data-rx="bal"></small></div>
      <div><small>Gastado real</small><b data-r="r"></b><small class="rx" data-rx="r"></small></div>
      <div><small>RESTANTE (ahorrado − gastado)</small><b data-r="rest"></b><small class="rx" data-rx="rest"></small></div>
    </div>
    ${ext&&!n0(v.cot)?'<p class="hint" style="color:var(--neg)">Falta cargar la cotización (tocá editar) para que haga la conversión.</p>':''}
  </div>`;
  const hint=ext?`<p class="hint">Tocá <b>$</b> / <b>${S}</b> para elegir la moneda de cada monto; al lado aparece convertido. Podés sumar: 2000+1500.</p>`:'<p class="hint">Podés sumar en el campo: 2000+1500.</p>';
  const cmp=l=>R?`<div class="cmp"><span>Estimado <b data-t="e_${l}"></b></span><span>Diferencia <b data-d="${l}"></b></span></div>`:'';
  const M=R?'r':'e';
  const sec=(l,cl,ic,tE,tR,ph,txt,extra)=>acc(l,cl,ic,R?tR:tE,
    filas(v,l,ph,M)+totRow(R?'TOTAL REAL':'TOTAL ESTIMADO',M+'_'+l)+cmp(l)+addB(l,txt)+(extra||''));
  const aho=`<div class="cols">
      ${['j','a'].map(p=>`<div class="col ${p}"><h4>${p==='j'?'JULI':'ALE'}</h4>
        ${v.aho[p].map(x=>`<div class="ar"><input type="text" inputmode="decimal" value="${esc(cp(x.monto))}" placeholder="$ 0" oninput="setAho('${p}','${x.id}',this)"><button class="x" onclick="quitarAho('${p}','${x.id}')" aria-label="Borrar"><i class="ti ti-x"></i></button></div>`).join('')}
        <button class="add" onclick="agregarAho('${p}')"><i class="ti ti-plus"></i></button>
        <div class="ct" data-a="${p}"></div></div>`).join('')}
    </div>${totRow('TOTAL DE LOS DOS','aho')}<p class="hint">Montos en pesos.</p>`;
  if(openDia===undefined&&v.dias.length)openDia=v.dias[v.dias.length-1].id;
  const diaHTML=d=>{const op=d.id===openDia;return `<div class="dia${op?' open':''}" id="dia_${d.id}">
      <button class="dia-h" onclick="toggleDia('${d.id}')" aria-expanded="${op}">
        <span class="dn">${esc(d.label)||'Día sin nombre'}</span>
        <span class="dtt" data-dt="${d.id}"></span><span class="dd" data-dd="${d.id}"></span><i class="ti ti-chevron-down chev"></i></button>
      <div class="dia-b">
        <label class="fd"><span>Día</span><input class="dlabel" value="${esc(d.label)}" placeholder="ej: Lunes 9" oninput="setDia('${d.id}',this)"></label>
        ${d.items.map(it=>`<div class="it">
          <div class="l1"><input type="text" value="${esc(it.label)}" placeholder="Concepto" oninput="setConc('${d.id}','${it.id}','label',this)">
            <button class="x" onclick="quitarConc('${d.id}','${it.id}')" aria-label="Borrar"><i class="ti ti-trash"></i></button></div>
          <div class="l2${ext?'':' noext'}"><input type="text" class="m" inputmode="decimal" value="${esc(cp(it.monto))}" placeholder="0" oninput="setConc('${d.id}','${it.id}','monto',this)">
            ${ext?`<button class="cur${it.ext?' ext':''}" onclick="extConc('${d.id}','${it.id}')">${it.ext?S:'$'}</button><span class="conv" data-cc="${d.id}:${it.id}"></span>`:''}</div></div>`).join('')}
        <button class="add" onclick="agregarConc('${d.id}')"><i class="ti ti-plus"></i> Concepto</button>
        <div class="tot"><span>TOTAL DEL DÍA</span><span class="v"><span data-dt2="${d.id}"></span><small data-dx="${d.id}"></small></span></div>
        <div class="cmp"><span>Estimado <b data-t="e_diario"></b></span><span>Diferencia <b data-dd2="${d.id}"></b></span></div>
        <button class="delmes" onclick="quitarDia('${d.id}')"><i class="ti ti-trash"></i> Borrar día</button>
      </div></div>`};
  const dmon=ext?`<div class="dmon"><span>Ver los días en</span><button data-m="ext" class="${diaMon!=='ARS'?'on':''}" onclick="setDiaMon('ext')">${S}</button><button data-m="ARS" class="${diaMon==='ARS'?'on':''}" onclick="setDiaMon('ARS')">$</button></div>`:'';
  const dias=dmon+(v.dias.length?v.dias.map(diaHTML).join(''):'<p class="empty">Agregá un día cuando estén de viaje</p>')+
    `<button class="add" onclick="agregarDia()"><i class="ti ti-calendar-plus"></i> Día</button>`+
    totRow('TOTAL GASTADO','dias')+
    `<div class="cmp"><span>Estimado (${v.dias.length} día${v.dias.length===1?'':'s'}) <b data-t="diasEst"></b></span><span>Diferencia <b data-d="dias"></b></span></div>
     <p class="hint">Cada día se compara con el gasto diario estimado (<b data-t="e_diario"></b>). Verde: les sobró; rojo: se pasaron.</p>`;
  body.innerHTML=trip+
    sec('gastos','a-est','calculator','Gastos estimados','Gastos reales','Concepto','Gasto',hint)+
    sec('exc','a-exc','ticket','Excursiones estimadas','Excursiones reales','Excursión','Excursión')+
    (R?acc('dias','a-com','sun','Gasto diario real',dias)
      :sec('diario','a-com','sun','Gasto diario estimado','','Desayuno, almuerzo…','Concepto','<p class="hint">Lo que calculan gastar por día. En Real cada día se compara con este total.</p>'))+
    acc('aho','a-aho','pig-money','Plata ahorrada',aho);
  document.querySelectorAll('.it input.m,.ar input').forEach(el=>el.classList.toggle('bad',isNaN(ev(el.value))));
  recalc();
  if(typeof after==='function')after();
}

function recalc(){
  const v=cur();if(!v)return;const K=calcular(v),ext=v.moneda!=='ARS',m=v.moneda,M=tab==='r'?'r':'e';
  const put=(sel,txt,n,color)=>document.querySelectorAll(sel).forEach(e=>{e.textContent=txt;if(color)e.className=e.className.replace(/\b(pos|neg|zero)\b/g,'').trim()+' '+cls(n)});
  document.querySelectorAll('[data-cv]').forEach(e=>{const [l,id,mo]=e.dataset.cv.split(':'),it=v[l].find(x=>x.id===id);if(!it)return;
    const [mc,ec]=campos(mo),x=n0(it[mc]);e.textContent=it[ec]?fmt(x*cotOf(v)):fmt(aExt(v,x),m);});
  // en Real: estimado y diferencia de cada fila
  document.querySelectorAll('[data-ve]').forEach(e=>{const [l,id]=e.dataset.ve.split(':'),it=v[l].find(x=>x.id===id);if(!it)return;
    const es=enPesos(v,it,'e'),re=enPesos(v,it,'r'),d=es-re;e.textContent=fmt(es);
    const dd=document.querySelector(`[data-vd="${l}:${id}"]`);if(dd){dd.textContent=String(it.rmonto??'').trim()?fmt(d):'—';dd.className=String(it.rmonto??'').trim()?cls(d):'zero';}});
  LISTAS.forEach(l=>['e','r'].forEach(t=>{const n=K[t+'_'+l];put(`[data-t="${t}_${l}"]`,fmt(n),0,false);put(`[data-tx="${t}_${l}"]`,ext?fmt(aExt(v,n),m):'',0,false);}));
  LISTAS.forEach(l=>{const d=K['e_'+l]-K['r_'+l];put(`[data-d="${l}"]`,fmt(d),d,true);put(`[data-h="${l}"]`,fmt(K[M+'_'+l]),0,false);});
  // en "Gasto diario real" todo se muestra en la moneda elegida con el botón (R$ / $); la otra queda chica abajo
  const verExt=ext&&diaMon!=='ARS'&&cotOf(v),fD=n=>verExt?fmt(aExt(v,n),m):fmt(n),fO=n=>ext&&cotOf(v)?(verExt?fmt(n):fmt(aExt(v,n),m)):'';
  put('[data-t="dias"]',fD(K.dias),0,false);put('[data-tx="dias"]',fO(K.dias),0,false);
  put('[data-t="diasEst"]',fD(K.diasEst),0,false);put('[data-d="dias"]',fD(K.diasEst-K.dias),K.diasEst-K.dias,true);
  document.querySelectorAll('#acc-dias [data-t="e_diario"]').forEach(e=>e.textContent=fD(K.e_diario));
  put('[data-h="dias"]',(ext&&diaMon!=='ARS'&&cotOf(v))?fmt(aExt(v,K.dias),m):fmt(K.dias),0,false);
  v.dias.forEach(d=>{const t=K.dia[d.id],x=K.e_diario-t;
    const enExt=ext&&diaMon!=='ARS'&&cotOf(v),fd=n=>enExt?fmt(aExt(v,n),m):fmt(n);
    put(`[data-dt="${d.id}"]`,fd(t),0,false);put(`[data-dt2="${d.id}"]`,fD(t),0,false);put(`[data-dx="${d.id}"]`,fO(t),0,false);
    put(`[data-dd="${d.id}"]`,(x>0?'+':'')+fd(x),x,true);put(`[data-dd2="${d.id}"]`,fD(x),x,true);});
  document.querySelectorAll('[data-cc]').forEach(e=>{const [did,cid]=e.dataset.cc.split(':'),d=v.dias.find(x=>x.id===did),it=d&&d.items.find(x=>x.id===cid);if(!it)return;
    const x=n0(it.monto);e.textContent=it.ext?fmt(x*cotOf(v)):fmt(aExt(v,x),m);});
  put('[data-t="aho"]',fmt(K.aho),0,false);put('[data-tx="aho"]',ext?fmt(aExt(v,K.aho),m):'',0,false);put('[data-h="aho"]',fmt(K.aho),0,false);
  put('[data-a="j"]',fmt(K.ahJ),0,false);put('[data-a="a"]',fmt(K.ahA),0,false);
  const RR={aho:K.aho,e:K.e,bal:K.bal,r:K.r,rest:K.rest};
  Object.entries(RR).forEach(([k,n])=>{put(`[data-r="${k}"]`,fmt(n),n,k==='bal'||k==='rest');put(`[data-rx="${k}"]`,ext&&cotOf(v)?fmt(aExt(v,n),m):'',0,false);});
}

/* ================= guardado + Firebase ================= */
const COL='vacaciones'; // misma colección de antes; los viajes nuevos tienen ver:2 y se ignoran los viejos
let db=null;const timers={};
function guardar(v){
  wr(LS,viajes);if(!db||!v)return;
  clearTimeout(timers[v.id]);
  timers[v.id]=setTimeout(()=>db.collection(COL).doc(v.id).set({json:JSON.stringify(v),ts:firebase.firestore.FieldValue.serverTimestamp()}).catch(()=>{}),600);
}
function startSync(){
  db.collection(COL).onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites)return;
    const r=[];snap.docs.forEach(d=>{try{const v=JSON.parse(d.data().json);if(v&&v.id&&v.ver===2)r.push(normalizar(v))}catch(e){}});
    if(!r.length){viajes.forEach(v=>guardar(v));if(!viajes.length)render();return}
    viajes=r;wr(LS,viajes);
    if(!cur())selId=viajes.length?viajes.slice().sort((a,b)=>(b.creado||0)-(a.creado||0))[0].id:null;
    const a=document.activeElement;if(!(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')))render();
  },()=>{});
}
function loadScript(src){return new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
async function initFb(){
  const c=window.getFbConfig&&window.getFbConfig();if(!c)return;
  try{
    if(typeof firebase==='undefined'){
      await loadScript('https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js');
      await loadScript('https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js');
    }
    if(!firebase.apps.length)firebase.initializeApp(c);
    db=firebase.firestore();startSync();
  }catch(e){}
}
if(!cur()&&viajes.length)selId=viajes.slice().sort((a,b)=>(b.creado||0)-(a.creado||0))[0].id;
render();initFb();
</script>
