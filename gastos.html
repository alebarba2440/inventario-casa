<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gastos">
<link rel="apple-touch-icon" href="img/apple-touch.png?v=11">
<link rel="icon" type="image/png" href="img/icono.png?v=12">
<title>Gastos personales</title>
<script src="tema.js"></script>
<script src="sonidos.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{--accent:#1D9E75;--accent-dark:#0F6E56;--accent-light:#E1F5EE;--pos:#1D9E75;--neg:#E24B4A;--warn:#D97706;
        --bg:#f5f5f0;--surface:#fff;--surface2:#f5f5f0;--border:rgba(0,0,0,.1);--border2:rgba(0,0,0,.18);--text:#1a1a1a;--text2:#666;--r:12px;
        --paid-bg:rgba(29,158,117,.10)}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--surface:#1c1c1e;--surface2:#2c2c2e;--border:rgba(255,255,255,.1);--border2:rgba(255,255,255,.2);--text:#f5f5f5;--text2:#aaa;--paid-bg:rgba(29,158,117,.18)}}
  :root[data-theme="dark"]{--bg:#111;--surface:#1c1c1e;--surface2:#2c2c2e;--border:rgba(255,255,255,.1);--border2:rgba(255,255,255,.2);--text:#f5f5f5;--text2:#aaa;--paid-bg:rgba(29,158,117,.18)}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Nunito',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh}
  .top{background:var(--surface);border-bottom:3px solid var(--accent);padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
  .top h1{font-size:1.1rem;color:var(--accent);font-weight:800;letter-spacing:.05em}
  main{max-width:520px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:12px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 30px)}
  .card{background:var(--surface);border:.5px solid var(--border);border-radius:16px;padding:14px}
  .acc{background:var(--surface);border:.5px solid var(--border);border-radius:16px;overflow:hidden}
  .acc-h{width:100%;display:flex;align-items:center;gap:8px;padding:15px 14px;background:none;border:none;font-family:inherit;color:var(--text);font-size:1rem;font-weight:700;cursor:pointer;text-align:left}
  .acc-h i.ic{color:var(--accent);font-size:1.2rem}
  .acc-h .sum{margin-left:auto;font-size:.92rem;font-weight:800;font-variant-numeric:tabular-nums}
  .acc-h .chev{color:var(--text2);transition:transform .2s;font-size:1.1rem}
  .acc.open .acc-h .chev{transform:rotate(180deg)}
  .acc-b{display:none;padding:0 14px 14px}
  .acc.open .acc-b{display:block}
  .card h2{font-size:.95rem;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
  .card h2 i{color:var(--accent);font-size:1.15rem}
  .num{font-variant-numeric:tabular-nums;font-weight:800}
  .pos{color:var(--pos)}.neg{color:var(--neg)}.zero{color:var(--text2)}

  /* mes y año */
  .periodo{display:flex;gap:8px;align-items:center}
  .sel{flex:1;font-family:inherit;font-size:1rem;font-weight:800;color:var(--accent-dark);background:var(--accent-light);border:1px solid var(--accent);border-radius:999px;padding:9px 14px;cursor:pointer;outline:none;text-align:center;text-align-last:center}
  .sel.anio{flex:0 0 auto}
  .icon-btn{width:42px;height:42px;flex-shrink:0;border-radius:50%;border:1px solid var(--border2);background:var(--surface);color:var(--accent);font-size:1.3rem;display:flex;align-items:center;justify-content:center;cursor:pointer}

  /* botones */
  .actions{display:flex;gap:8px;margin-bottom:12px}
  .btn{border:none;border-radius:var(--r);padding:11px 14px;font-family:inherit;font-size:.92rem;font-weight:700;cursor:pointer;color:#fff;background:var(--accent);display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
  .btn.grow{flex:1}
  .btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border2)}
  .btn.danger{background:var(--neg)}
  .btn.danger.naranja{background:#EA580C}   /* Limpiar mes: distinto del rojo de Limpiar todo */

  /* categorías (acordeón) y gastos */
  .grp{border:.5px solid var(--border2);border-radius:14px;margin-bottom:8px;overflow:hidden;background:var(--surface)}
  /* mantener apretado un grupo para cambiarlo de lugar */
  .grp-h{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .grp.arrastrando{position:relative;z-index:5;transform:scale(1.03);box-shadow:0 12px 28px rgba(0,0,0,.25);outline:2px solid var(--accent);transition:transform .15s,box-shadow .15s}
  body.ordenando .grp-b{display:none !important}
  body.ordenando{-webkit-user-select:none;user-select:none}
  .grp-h{width:100%;display:flex;align-items:center;gap:8px;padding:11px 12px;background:var(--surface2);border:none;font-family:inherit;color:var(--text);cursor:pointer;text-align:left;font-size:.95rem;font-weight:700}
  .grp-h .ic{font-size:1.15rem}
  .grp-h .lbl{flex:1;min-width:0}
  .grp-h .lbl span{cursor:text;border-bottom:1px dashed transparent}
  .grp-h .lbl span:hover{border-bottom-color:var(--border2)}
  .grp-h .chev{color:var(--text2);transition:transform .2s}
  .grp.open .grp-h .chev{transform:rotate(180deg)}
  .grp-b{display:none}
  .grp.open .grp-b{display:block}
  .row{display:grid;grid-template-columns:38px 1fr 96px 36px 30px;align-items:center;gap:4px;padding:6px 8px;border-top:.5px solid var(--border)}
  .row.paid{background:var(--paid-bg)}
  .row input[type=text]{width:100%;min-width:0;background:transparent;border:1px solid transparent;border-radius:8px;padding:7px 6px;font-family:inherit;font-size:.92rem;font-weight:600;color:var(--text);outline:none}
  .row input[type=text]:focus{border-color:var(--accent);background:var(--surface)}
  .row input.imp{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
  /* menú para crear gasto */
  .nuevo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:12px}
  .nuevo[hidden]{display:none}
  .nuevo label{display:flex;flex-direction:column;gap:4px;font-size:.72rem;font-weight:800;color:var(--text2);letter-spacing:.03em}
  .nuevo .nv-cat{grid-column:1/-1}
  .nuevo select,.nuevo input{font-family:inherit;font-size:1rem;font-weight:700;color:var(--text);background:var(--surface);border:1px solid var(--border2);border-radius:10px;padding:10px;outline:none;width:100%;box-sizing:border-box}
  .nuevo select:focus,.nuevo input:focus{border-color:var(--accent)}
  .nuevo .nv-imp input{text-align:right;font-variant-numeric:tabular-nums}
  .nuevo .nv-bt{grid-column:1/-1;display:flex;gap:8px}
  .nuevo .nv-bt .btn{flex:1}
  /* hoja de categorías */
  .cat-list{display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow-y:auto}
  /* acordeones dentro de Opciones */
  .oacc{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--surface)}
  .oacc-h{width:100%;display:flex;align-items:center;gap:8px;padding:13px 14px;background:none;border:none;font-family:inherit;font-size:.98rem;font-weight:800;color:var(--text);cursor:pointer;text-align:left}
  .oacc-h>i:first-child{color:var(--accent);font-size:1.15rem}
  .oacc-h .chev{margin-left:auto;color:var(--text2);transition:transform .2s}
  .oacc.open .oacc-h .chev{transform:rotate(180deg)}
  .oacc-b{display:none;flex-direction:column;gap:8px;padding:0 12px 12px}
  .oacc.open .oacc-b{display:flex}
  .cat-it{display:flex;align-items:center;gap:8px;padding:4px 0}
  .cat-it input{flex:1;min-width:0;font-family:inherit;font-size:.98rem;font-weight:700;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px;outline:none}
  .cat-it input:focus{border-color:var(--accent)}
  .emo-b{width:44px;height:44px;flex-shrink:0;font-size:1.4rem;border-radius:12px;border:1px solid var(--border2);background:var(--surface);cursor:pointer}
  .cat-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
  .cat-it .del{width:40px;height:40px;flex-shrink:0;border:none;background:none;color:var(--neg);font-size:1.15rem;cursor:pointer}
  .cat-fija{width:40px;flex-shrink:0;text-align:center;font-size:.7rem;font-weight:800;color:var(--text2)}
  .emo-grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
  .emo-grid button{aspect-ratio:1;font-size:1.35rem;border:none;background:var(--surface2);border-radius:10px;cursor:pointer}
  .emo-otro{display:flex;flex-direction:column;gap:4px;font-size:.78rem;font-weight:700;color:var(--text2)}
  .emo-otro input{font-size:1.3rem;padding:8px;border-radius:10px;border:1px solid var(--border2);background:var(--surface2);text-align:center;color:var(--text)}
  /* se ve el emoji; al tocarlo se abre la lista con emoji y nombre */
  .cat-pick{position:relative;display:flex;align-items:center;justify-content:center;width:36px;height:36px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;font-size:1.1rem}
  .cat-pick select{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:16px}
  .cat-select{appearance:none;-webkit-appearance:none;background:var(--surface2);border:1px solid var(--border);border-radius:10px;font-size:1.1rem;text-align:center;text-align-last:center;width:36px;height:36px;cursor:pointer;padding:0}
  .del{background:none;border:none;color:var(--text2);font-size:1.05rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .empty{text-align:center;padding:18px 0;color:var(--text2);font-size:.9rem}

  /* check pagado */
  .chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--neg);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;color:transparent;font-size:1rem;margin:0 auto;transition:all .15s}
  .chk.on{background:var(--pos);border-color:var(--pos);color:#fff}

  /* ingresos y resumen */
  .ing{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .ing label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--text2);font-weight:700}
  .ing input,.semanas select{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r);padding:10px;font-size:.95rem;font-family:inherit;font-weight:800;color:var(--text);width:100%;min-width:0;outline:none;text-align:right;font-variant-numeric:tabular-nums}
  .ing input:focus{border-color:var(--accent)}
  .big{display:flex;justify-content:space-between;align-items:center;padding:12px;border-radius:var(--r);margin-top:10px;font-weight:700}
  .big b{font-size:1.25rem;font-weight:800;font-variant-numeric:tabular-nums}
  .big.rest{background:var(--accent-light);color:var(--accent-dark)}
  .big.sem{background:var(--surface2)}
  .big.sem b{color:var(--warn)}
  .semanas{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;font-weight:700;font-size:.9rem}
  .semanas select{width:auto;text-align:left;padding:8px 10px}
  .line{display:flex;justify-content:space-between;font-size:.88rem;padding:4px 2px;color:var(--text2);font-weight:600}
  .line b{color:var(--text)}

  /* gráfico */
  .chart{position:relative;height:260px}
  .sub-t{font-size:.95rem;font-weight:800;margin:18px 0 8px}
  /* comparación con el mes anterior */
  .ct-row{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr) 58px;gap:6px;align-items:center;font-size:.84rem;padding:8px 0;border-top:1px solid var(--border)}
  .ct-row.h{border-top:none;font-size:.7rem;font-weight:800;color:var(--text2);letter-spacing:.04em;padding-top:0}
  .ct-row span:nth-child(2),.ct-row span:nth-child(3){text-align:right;font-variant-numeric:tabular-nums}
  .ct-row span:nth-child(1){font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ct-row span:nth-child(2){color:var(--text2)}
  .ct-row span:nth-child(3){font-weight:800}
  .ct-row .v{text-align:right;font-weight:900;font-size:.8rem;white-space:nowrap}
  .v.mas{color:var(--neg)} .v.menos{color:var(--pos)} .v.igual{color:var(--text2)}
  .ct-tot{display:flex;justify-content:space-between;align-items:center;gap:8px;border-radius:12px;padding:10px 12px;margin-top:6px;font-weight:900;font-size:.88rem;background:var(--surface2)}
  .ct-tot.mas{background:color-mix(in srgb,var(--neg) 12%,transparent);color:var(--neg)}
  .ct-tot.menos{background:color-mix(in srgb,var(--pos) 12%,transparent);color:var(--pos)}
  /* tendencia */
  .filtros{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .filtros::-webkit-scrollbar{display:none}
  /* flechitas para correr las categorías (en PC no se puede deslizar con el dedo) */
  .filtros-w{position:relative;display:flex;align-items:center;gap:4px}
  .filtros-w .filtros{flex:1;min-width:0;scroll-behavior:smooth}
  .fl-b{flex-shrink:0;width:30px;height:30px;border-radius:4px 12px 4px 12px;border:1px solid var(--border2);background:var(--surface);color:var(--text);display:grid;place-items:center;cursor:pointer;padding:0;margin-bottom:4px;transition:opacity .15s}
  .fl-b i{font-size:1rem}
  .fl-b:disabled{opacity:.3;cursor:default}
  .filtros-w.sin-scroll .fl-b{display:none}
  .chip{flex-shrink:0;border:1px solid var(--border2);background:var(--surface);color:var(--text);border-radius:999px;padding:7px 12px;font-family:inherit;font-size:.82rem;font-weight:700;cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .chart.tend{height:210px;margin-top:8px}

  /* hojas (ajustes / confirmar) */
  .bgm{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .bgm.show{display:flex}
  .sheet{background:var(--surface);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:10px;max-height:88dvh;overflow-y:auto;-webkit-overflow-scrolling:touch}
  /* en pantallas bajas la hoja se desplaza; antes achicaba las partes y cortaba el botón "Nueva categoría" */
  .sheet>*,.oacc-b>*{flex-shrink:0}
  .sheet h3{font-size:1.1rem;text-align:center}
  .sheet p{color:var(--text2);text-align:center;line-height:1.4}
  .sheet .two{display:flex;gap:8px}
  .sheet .two .btn{flex:1}

  /* ===== PC: gastos a la izquierda; ingresos y gráfico a la derecha, todo abierto ===== */
  @media (min-width:900px){
    main{max-width:1180px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start;padding:22px}
    .periodo{grid-column:1/-1;max-width:520px;width:100%;justify-self:center}
    #accGas{grid-column:1;grid-row:2 / span 2}
    #accIng{grid-column:2;grid-row:2} #accCat{grid-column:2;grid-row:3}
    .acc .acc-b{display:block !important}
    .acc .acc-h{cursor:default;pointer-events:none}
    .acc .acc-h .chev{display:none}
    .chart{height:300px}
  }
  /* botón de Opciones arriba a la derecha, igual que en las otras secciones */
  .top .cfg{position:absolute;right:8px;top:calc(env(safe-area-inset-top,0px) + 12px);width:40px;height:40px;border:none;border-radius:12px;background:var(--accent-light);color:var(--accent);font-size:1.35rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .top .cfg:active{transform:scale(.94)}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .top .cfg{background:rgba(255,255,255,.08)}}
  :root[data-theme="dark"] .top .cfg{background:rgba(255,255,255,.08)}
</style>
<link rel="stylesheet" href="fondo.css">
<link rel="stylesheet" href="comun.css">
</head>
<body>
<div class="top">
  <a class="home-link" href="index.html" aria-label="Volver al inicio"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.707 2.293l9 9c.63 .63 .184 1.707 -.707 1.707h-1v6a3 3 0 0 1 -3 3h-1v-7a3 3 0 0 0 -2.824 -2.995l-.176 -.005h-2a3 3 0 0 0 -3 3v7h-1a3 3 0 0 1 -3 -3v-6h-1c-.89 0 -1.337 -1.077 -.707 -1.707l9 -9a1 1 0 0 1 1.414 0m.293 11.707a1 1 0 0 1 1 1v7h-4v-7a1 1 0 0 1 .883 -.993l.117 -.007z"/></svg></a>
  <h1>GASTOS</h1>
  <button class="cfg" onclick="abrirOpts()" aria-label="Opciones"><i class="ti ti-adjustments-horizontal"></i></button>
</div>

<main>
  <div class="periodo">
    <select id="mes" class="sel" aria-label="Mes"></select>
    <select id="anio" class="sel anio" aria-label="Año"></select>
  </div>

  <section class="acc open" id="accGas">
    <button class="acc-h" onclick="openAcc('accGas')" aria-expanded="true"><i class="ti ti-receipt ic"></i> Gastos del mes <span class="sum" id="totGastos"></span><i class="ti ti-chevron-down chev"></i></button>
    <div class="acc-b">
    <div class="actions">
      <button class="btn grow" id="bNuevo" onclick="toggleNuevo()" aria-expanded="false"><i class="ti ti-plus"></i> Gasto</button>
      <button class="btn ghost" onclick="copiarMesAnterior()"><i class="ti ti-copy"></i> Copiar mes ant.</button>
    </div>
    <form class="nuevo" id="nuevo" hidden onsubmit="event.preventDefault();agregarGasto()">
      <label class="nv-cat"><span>Categoría</span><select id="nvCat"></select></label>
      <label class="nv-nom"><span>Nombre</span><input type="text" id="nvNom" placeholder="ej: Super" autocomplete="off"></label>
      <label class="nv-imp"><span>Monto</span><input type="text" id="nvImp" inputmode="numeric" placeholder="0" autocomplete="off" oninput="this.value=this.value===''?'':fmtN(parseN(this.value))"></label>
      <div class="nv-bt"><button type="button" class="btn ghost" onclick="toggleNuevo(false)">Cancelar</button><button type="submit" class="btn"><i class="ti ti-check"></i> Agregar</button></div>
    </form>
    <div id="lista"></div>
    </div>
  </section>

  <section class="acc" id="accIng">
    <button class="acc-h" onclick="openAcc('accIng')" aria-expanded="false"><i class="ti ti-wallet ic"></i> Ingresos <span class="sum" id="sumRest"></span><i class="ti ti-chevron-down chev"></i></button>
    <div class="acc-b">
    <div class="ing">
      <label>Sueldo<input type="text" id="sueldo" inputmode="numeric" placeholder="0"></label>
      <label>SAC<input type="text" id="aguinaldo" inputmode="numeric" placeholder="0"></label>
      <label>Extra<input type="text" id="extra" inputmode="numeric" placeholder="0"></label>
    </div>
    <div class="line" style="margin-top:10px"><span>Ingresos</span><b id="totIng">$ 0</b></div>
    <div class="line"><span>Gastos</span><b id="totGas2">$ 0</b></div>
    <div class="line"><span>Pagado / Falta pagar</span><b><span class="pos" id="pagado">$ 0</span> / <span class="neg" id="falta">$ 0</span></b></div>
    <div class="big rest"><span>Restante</span><b id="restante">$ 0</b></div>
    <div class="semanas"><span>Dividir en</span><select id="dividir"><option value="4">4 semanas</option><option value="5">5 semanas</option></select></div>
    <div class="big sem"><span>Gasto semanal</span><b id="semanal">$ 0</b></div>
    </div>
  </section>

  <section class="acc" id="accCat">
    <button class="acc-h" onclick="openAcc('accCat')" aria-expanded="false"><i class="ti ti-chart-donut-3 ic"></i> Por categoría <i class="ti ti-chevron-down chev" style="margin-left:auto"></i></button>
    <div class="acc-b">
    <div class="chart"><canvas id="grafico"></canvas></div>
    <h3 class="sub-t" id="compT"></h3>
    <div id="compTabla"></div>
    <h3 class="sub-t">Tendencia del año</h3>
    <div class="filtros-w" id="filtrosW"><button class="fl-b izq" type="button" aria-label="Ver categorías anteriores" onclick="moverFiltros(-1)"><i class="ti ti-chevron-left"></i></button><div class="filtros" id="filtros" role="group" aria-label="Filtrar por categoría"></div><button class="fl-b der" type="button" aria-label="Ver más categorías" onclick="moverFiltros(1)"><i class="ti ti-chevron-right"></i></button></div>
    <div class="chart tend"><canvas id="tendencia"></canvas></div>
    </div>
  </section>
</main>

<script>
/* ---------- acordeones: uno abierto a la vez ---------- */
function openAcc(id){
  document.querySelectorAll('.acc').forEach(el=>{const o=el.id===id&&!el.classList.contains('open');el.classList.toggle('open',o);el.querySelector('.acc-h').setAttribute('aria-expanded',o)});
  // al abrir "Por categoría" los gráficos se dibujan con animación (antes aparecían de golpe, con un salto)
  if(id==='accCat'&&document.getElementById('accCat').classList.contains('open'))requestAnimationFrame(()=>{
    [chart,tendChart].forEach(c=>{if(!c)return;c.resize();c.reset();c.update();});});
}
/* ---------- ventanas ---------- */
function abrir(id){document.getElementById(id).classList.add('show')}
function cerrar(id){document.getElementById(id).classList.remove('show')}
function aviso(msg,titulo='Listo'){
  dlgT.textContent=titulo;dlgM.textContent=msg;dlgNo.style.display='none';
  dlgSi.className='btn';dlgSi.textContent='Aceptar';dlgSi.onclick=()=>cerrar('dlg');abrir('dlg');
}
function confirmar(msg,cb,titulo='Confirmar',borrar=false){
  dlgT.textContent=titulo;dlgM.textContent=msg;dlgNo.style.display='';dlgNo.onclick=()=>cerrar('dlg');
  dlgSi.className='btn'+(borrar?' danger':'');dlgSi.textContent=borrar?'Eliminar':'Confirmar';
  dlgSi.onclick=()=>{cerrar('dlg');cb();};abrir('dlg');
}

/* ---------- datos (se guardan en este celu, como en la app original) ---------- */
const LS='gastos-mensuales';
const MESES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const CATS_BASE=[
  {id:'varios',icon:'📦',label:'Varios'},{id:'casa',icon:'🏠',label:'Casa'},{id:'comida',icon:'🍔',label:'Comida'},
  {id:'transporte',icon:'🚗',label:'Transp.'},{id:'servicios',icon:'💡',label:'Servic.'},{id:'tarjetas',icon:'💳',label:'Tarjetas'},
  {id:'salud',icon:'💊',label:'Salud'},{id:'ocio',icon:'🎉',label:'Ocio'},{id:'ahorro',icon:'🐷',label:'Ahorro'}
];
const rd=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||'')??d}catch(e){return d}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let datos=rd(LS,{})||{};
let colapsados=rd('grupos-colapsados',{})||{};
/* categorías: se pueden crear, borrar, renombrar y cambiar el emoji (se guardan en este celu, como los gastos).
   Cada una tiene su color fijo (h) para que no cambie al borrar otras. "Varios" no se borra: es donde van los gastos sin categoría. */
let CATS=(function(){
  let l=rd('categorias',null);
  if(!Array.isArray(l)||!l.length){const viejos=rd('nombres-categoria',{})||{};          // primera vez: las de siempre + los nombres que ya habías puesto
    l=CATS_BASE.map((c,i)=>({id:c.id,icon:c.icon,label:viejos[c.id]||c.label,h:(i*137.5+150)%360}));wr('categorias',l);}
  if(!l.some(c=>c.id==='varios'))l.unshift({id:'varios',icon:'📦',label:'Varios',h:150});
  return l;
})();
const guardarCats=()=>wr('categorias',CATS);
const catDe=id=>CATS.find(c=>c.id===id);
const nombreCat=id=>(catDe(id)||{label:id}).label;
const colorCat=(id,a=1)=>{const c=catDe(id);return !c?`hsla(210 10% 60% / ${a})`:`hsla(${c.h??150} 60% 52% / ${a})`;};
const iconCat=id=>(catDe(id)||{icon:'📂'}).icon;
const fmt=n=>(n<0?'-':'')+'$ '+Math.abs(Math.round(n)).toLocaleString('es-AR');
const fmtN=n=>Math.round(n).toLocaleString('es-AR');
const parseN=t=>parseInt(String(t).replace(/\./g,'').replace(/[^\d-]/g,''))||0;
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

/* claves viejas sin año -> con año actual; categoría y semanas por defecto */
(function migrar(){
  const y=new Date().getFullYear(),out={};let cambio=false;
  Object.keys(datos).forEach(k=>{const nk=k.includes('-')?k:k+'-'+y;if(nk!==k)cambio=true;out[nk]=out[nk]||datos[k];});
  Object.values(out).forEach(d=>{(d.gastos||[]).forEach(g=>{if(!g.categoria){g.categoria='varios';cambio=true}});if(!d.semanas){d.semanas='4';cambio=true}});
  datos=out;if(cambio)wr(LS,datos);
})();

/* ---------- selectores ---------- */
const selMes=document.getElementById('mes'),selAnio=document.getElementById('anio');
selMes.innerHTML=MESES.map(m=>`<option>${m}</option>`).join('');
(function anios(){
  const y=new Date().getFullYear(),ys=new Set([y-1,y,y+1]);
  Object.keys(datos).forEach(k=>{const n=+k.split('-')[1];if(n)ys.add(n)});
  selAnio.innerHTML=[...ys].sort((a,b)=>a-b).map(n=>`<option value="${n}"${n===y?' selected':''}>${n}</option>`).join('');
})();
selMes.selectedIndex=new Date().getMonth();
const periodo=()=>`${selMes.value}-${selAnio.value}`;
function asegurarMes(){const p=periodo();if(!datos[p])datos[p]={gastos:[],sueldo:0,aguinaldo:0,extra:0,semanas:'4'};}
function guardar(){wr(LS,datos)}

/* ---------- gastos ---------- */
function render(){
  asegurarMes();
  const d=datos[periodo()],lista=document.getElementById('lista');
  const grupos={};d.gastos.forEach((g,i)=>{const c=g.categoria||'varios';(grupos[c]=grupos[c]||[]).push({...g,i});});
  const orden=CATS.map(c=>c.id).concat(Object.keys(grupos).filter(k=>!CATS.some(c=>c.id===k)));
  const html=orden.filter(c=>grupos[c]&&grupos[c].length).map(c=>{
    const items=grupos[c],sub=items.reduce((a,x)=>a+(+x.importe||0),0),todo=items.every(x=>x.pagado),op=!colapsados[c];
    return `<div class="grp${op?' open':''}" data-c="${c}">
      <button class="grp-h" onclick="toggleGrupo('${c}')" aria-expanded="${op}">
        <span class="ic">${iconCat(c)}</span>
        <span class="lbl"><span onclick="editarCat(event,'${c}')">${esc(nombreCat(c))}</span></span>
        <span class="num ${todo?'pos':'neg'}" id="sub_${c}">${fmt(sub)}</span>
        <i class="ti ti-chevron-down chev"></i>
      </button>
      <div class="grp-b">${items.map(x=>`
        <div class="row${x.pagado?' paid':''}">
          <span class="cat-pick">${iconCat(c)}<select onchange="cambiarCat(${x.i},this.value)" aria-label="Categoría">${CATS.map(k=>`<option value="${k.id}"${k.id===c?' selected':''}>${k.icon} ${esc(k.label)}</option>`).join('')}</select></span>
          <input type="text" value="${esc(x.nombre)}" onchange="cambiarNombre(${x.i},this.value)" onfocus="this.select()" aria-label="Gasto">
          <input type="text" class="imp" value="${fmtN(+x.importe||0)}" inputmode="numeric" oninput="cambiarImporte(${x.i},this)" onfocus="this.select()" aria-label="Importe">
          <button class="chk${x.pagado?' on':''}" onclick="togglePagado(${x.i})" aria-label="${x.pagado?'Pagado':'Sin pagar'}"><i class="ti ti-check"></i></button>
          <button class="del" onclick="eliminar(${x.i})" aria-label="Eliminar"><i class="ti ti-trash"></i></button>
        </div>`).join('')}</div>
    </div>`;}).join('');
  lista.innerHTML=html||'<p class="empty">No hay gastos cargados</p>';
  renderIngresos();totales();
}
/* ===== mantener apretado el título de un grupo y arrastrarlo para ordenar (el orden es el de las categorías) ===== */
(function(){
  const L=document.getElementById('lista');let t=null,drag=null,y0=0,sinClick=false;
  const cancelar=()=>{clearTimeout(t);t=null;};
  L.addEventListener('pointerdown',e=>{const h=e.target.closest('.grp-h');if(!h||e.button>0)return;y0=e.clientY;
    t=setTimeout(()=>empezar(h.parentElement),450);});
  L.addEventListener('pointermove',e=>{if(t&&Math.abs(e.clientY-y0)>8)cancelar();});   // si se mueve antes, es para desplazar la pantalla
  ['pointerup','pointercancel'].forEach(ev=>L.addEventListener(ev,cancelar));
  L.addEventListener('contextmenu',e=>{if(e.target.closest('.grp-h'))e.preventDefault();});
  // mientras se ordena, la pantalla no se desplaza con el dedo
  document.addEventListener('touchmove',e=>{if(drag)e.preventDefault();},{passive:false});
  // el toque que termina el arrastre no abre/cierra el grupo ni edita el nombre
  L.addEventListener('click',e=>{if(sinClick){e.stopPropagation();e.preventDefault();sinClick=false;}},true);
  function empezar(g){t=null;const y=g.getBoundingClientRect().top;drag={g};sinClick=true;
    document.body.classList.add('ordenando');g.classList.add('arrastrando');
    window.scrollBy(0,g.getBoundingClientRect().top-y);              // que el grupo quede bajo el dedo al cerrarse los demás
    if(navigator.vibrate)navigator.vibrate(15);
    document.addEventListener('pointermove',mover);document.addEventListener('pointerup',soltar);document.addEventListener('pointercancel',soltar);}
  function mover(e){if(!drag)return;const y=e.clientY,gs=[...L.querySelectorAll('.grp')],i=gs.indexOf(drag.g),prev=gs[i-1],next=gs[i+1];
    if(next){const r=next.getBoundingClientRect();if(y>r.top+r.height/2)L.insertBefore(next,drag.g);}
    if(prev){const r=prev.getBoundingClientRect();if(y<r.top+r.height/2)L.insertBefore(drag.g,prev);}
    if(y<90)window.scrollBy(0,-10);else if(y>innerHeight-90)window.scrollBy(0,10);}
  function soltar(){if(!drag)return;
    document.removeEventListener('pointermove',mover);document.removeEventListener('pointerup',soltar);document.removeEventListener('pointercancel',soltar);
    const nuevo=[...L.querySelectorAll('.grp')].map(g=>g.dataset.c).filter(id=>catDe(id)),vis=new Set(nuevo);let k=0;
    CATS=CATS.map(c=>vis.has(c.id)?catDe(nuevo[k++]):c);           // las categorías sin gastos este mes quedan donde estaban
    guardarCats();drag=null;document.body.classList.remove('ordenando');render();setTimeout(()=>{sinClick=false;},400);}
})();
function toggleGrupo(c){if(colapsados[c])delete colapsados[c];else colapsados[c]=true;wr('grupos-colapsados',colapsados);render();}
async function editarCat(e,c){e.stopPropagation();const n=await pedirTexto('Cambiar nombre','Nuevo nombre para la categoría:',{valor:nombreCat(c)});const k=catDe(c);if(k&&n&&n.trim()){k.label=n.trim();guardarCats();render();}}
let ultCat=rd('ultima-categoria','varios');
function opcionesCat(sel){return CATS.map(k=>`<option value="${k.id}"${k.id===sel?' selected':''}>${k.icon} ${esc(k.label)}</option>`).join('');}
function toggleNuevo(abrirlo){const f=document.getElementById('nuevo'),b=document.getElementById('bNuevo');
  const ab=abrirlo===undefined?f.hidden:abrirlo;f.hidden=!ab;b.setAttribute('aria-expanded',ab);
  if(ab){if(!catDe(ultCat))ultCat='varios';document.getElementById('nvCat').innerHTML=opcionesCat(ultCat);
    document.getElementById('nvNom').value='';document.getElementById('nvImp').value='';document.getElementById('nvNom').focus();}}
function agregarGasto(){
  asegurarMes();const c=document.getElementById('nvCat').value||'varios',nom=document.getElementById('nvNom').value.trim()||'Nuevo',imp=parseN(document.getElementById('nvImp').value);
  datos[periodo()].gastos.push({nombre:nom,importe:imp,pagado:false,categoria:c});
  ultCat=c;wr('ultima-categoria',c);delete colapsados[c];wr('grupos-colapsados',colapsados);guardar();toggleNuevo(false);render();
}
function cambiarNombre(i,v){datos[periodo()].gastos[i].nombre=v;guardar();}
function cambiarCat(i,v){datos[periodo()].gastos[i].categoria=v;guardar();render();}
function cambiarImporte(i,el){
  const n=parseN(el.value);el.value=el.value===''?'':fmtN(n);
  const d=datos[periodo()],g=d.gastos[i];g.importe=n;guardar();
  const c=g.categoria||'varios',items=d.gastos.filter(x=>(x.categoria||'varios')===c),s=document.getElementById('sub_'+c);
  if(s){s.textContent=fmt(items.reduce((a,x)=>a+(+x.importe||0),0));s.className='num '+(items.every(x=>x.pagado)?'pos':'neg');}
  totales();
}
function togglePagado(i){const g=datos[periodo()].gastos[i];g.pagado=!g.pagado;guardar();render();}
function eliminar(i){confirmar('¿Eliminar este gasto?',()=>{datos[periodo()].gastos.splice(i,1);guardar();render();},'Eliminar gasto',true);}
function copiarMesAnterior(){
  const idx=MESES.indexOf(selMes.value),y=+selAnio.value;
  const [mA,yA]=idx===0?[MESES[11],y-1]:[MESES[idx-1],y],kA=`${mA}-${yA}`;
  if(!datos[kA]||!(datos[kA].gastos||[]).length){aviso(`No hay datos en ${mA} ${yA} para copiar.`,'Sin datos');return;}
  confirmar(`¿Copiar los gastos de ${mA} ${yA}?`,()=>{
    const d=datos[periodo()],ya=new Set(d.gastos.map(g=>g.nombre));
    const nuevos=datos[kA].gastos.filter(g=>g.importe>0&&!ya.has(g.nombre)).map(g=>({...g,pagado:false}));
    if(!nuevos.length){aviso('Todos los gastos ya están en este mes.');return;}
    d.gastos.push(...nuevos);guardar();render();
  },'Copiar gastos');
}

/* ---------- ingresos y totales ---------- */
const inIng=['sueldo','aguinaldo','extra'].map(id=>document.getElementById(id));
const selDiv=document.getElementById('dividir');
function renderIngresos(){const d=datos[periodo()];inIng.forEach(el=>{const v=+d[el.id]||0;el.value=v?fmtN(v):''});selDiv.value=d.semanas||'4';}
inIng.forEach(el=>el.addEventListener('input',()=>{const n=parseN(el.value);el.value=el.value===''?'':fmtN(n);datos[periodo()][el.id]=n;guardar();totales();}));
selDiv.addEventListener('change',()=>{datos[periodo()].semanas=selDiv.value;guardar();totales();});
function totales(){
  const d=datos[periodo()],ing=(+d.sueldo||0)+(+d.aguinaldo||0)+(+d.extra||0);
  const gas=d.gastos.reduce((a,g)=>a+(+g.importe||0),0),pag=d.gastos.filter(g=>g.pagado).reduce((a,g)=>a+(+g.importe||0),0);
  const rest=ing-gas,set=(id,t)=>document.getElementById(id).textContent=t;
  set('totGastos',fmt(gas));set('totIng',fmt(ing));set('totGas2',fmt(gas));set('pagado',fmt(pag));set('falta',fmt(gas-pag));
  const r=document.getElementById('restante');r.textContent=fmt(rest);r.style.color=rest<0?'var(--neg)':'';
  set('semanal',fmt(rest/(parseInt(selDiv.value)||4)));
  {const e=document.getElementById('sumRest');e.textContent='Restante '+fmt(rest);e.style.color=rest<0?'var(--neg)':'var(--accent-dark)';}
  grafico();comparacion();
}
function comparacion(){compTabla();tendencia();} // la comparación ahora es la tabla por categoría (con el total abajo)

/* ---------- comparación por categoría con el mes anterior ---------- */
const porCat=k=>{const o={};((datos[k]||{}).gastos||[]).forEach(g=>{const v=+g.importe||0;if(v>0){const c=g.categoria||'varios';o[c]=(o[c]||0)+v;}});return o;};
function varPct(a,b){ // de a (mes anterior) a b (este mes)
  if(Math.round(a)===Math.round(b))return{c:'igual',t:'— 0%'};
  if(!a)return{c:'mas',t:'▲ nuevo'};
  const p=(b-a)/a*100,r=Math.abs(p)<1?Math.abs(p).toFixed(1).replace('.',','):Math.round(Math.abs(p));
  return b>a?{c:'mas',t:`▲ ${r}%`}:{c:'menos',t:`▼ ${r}%`};
}
function compTabla(){
  const idx=MESES.indexOf(selMes.value),y=+selAnio.value,[mA,yA]=idx===0?[MESES[11],y-1]:[MESES[idx-1],y];
  const kA=`${mA}-${yA}`,act=porCat(periodo()),ant=porCat(kA),T=document.getElementById('compTabla');
  document.getElementById('compT').textContent='Comparado con '+mA.toLowerCase();
  if(!((datos[kA]||{}).gastos||[]).length){T.innerHTML='<p style="color:var(--text2);font-size:.88rem;text-align:center">Sin datos del mes anterior para comparar.</p>';return;}
  // mismo orden que las categorías (el que elegiste arrastrando los grupos)
  const usadas=new Set([...Object.keys(act),...Object.keys(ant)]);
  const cats=CATS.map(c=>c.id).filter(id=>usadas.has(id)).concat([...usadas].filter(id=>!catDe(id)));
  const filas=cats.map(c=>{const a=ant[c]||0,b=act[c]||0,v=varPct(a,b);
    return `<div class="ct-row"><span>${iconCat(c)} ${esc(nombreCat(c))}</span><span>${fmt(a)}</span><span>${fmt(b)}</span><span class="v ${v.c}">${v.t}</span></div>`;}).join('');
  const tA=Object.values(ant).reduce((x,z)=>x+z,0),tB=Object.values(act).reduce((x,z)=>x+z,0),v=varPct(tA,tB),d=tB-tA;
  T.innerHTML=`<div class="ct-row h"><span>CATEGORÍA</span><span>${mA.toUpperCase()}</span><span>${selMes.value.toUpperCase()}</span><span style="text-align:right">VAR.</span></div>${filas}
    <div class="ct-tot ${v.c}"><span>Total</span><span>${d>0?fmt(d)+' más':d<0?fmt(-d)+' menos':'Igual'} · ${v.t}</span></div>`;
}

/* ---------- tendencia del año (total o por categoría) ---------- */
let tendChart=null,tendCat=rd('tend-cat','todas');
function tendencia(){
  if(typeof Chart==='undefined')return;
  const y=+selAnio.value,usadas=new Set();
  MESES.forEach(m=>((datos[`${m}-${y}`]||{}).gastos||[]).forEach(g=>{if(+g.importe>0)usadas.add(g.categoria||'varios')}));
  const cats=CATS.map(c=>c.id).filter(id=>usadas.has(id));
  if(tendCat!=='todas'&&!cats.includes(tendCat))tendCat='todas';
  document.getElementById('filtros').innerHTML=[['todas','Todas']].concat(cats.map(id=>[id,iconCat(id)+' '+nombreCat(id)]))
    .map(([id,t])=>`<button class="chip${id===tendCat?' on':''}" aria-pressed="${id===tendCat}" ${id!=='todas'&&id===tendCat?`style="background:${colorCat(id)};border-color:${colorCat(id)}"`:''} onclick="setTendCat('${id}')">${esc(t)}</button>`).join('');
  requestAnimationFrame(()=>{verChipActivo();flechasFiltros();});
  const vals=MESES.map(m=>{const d=datos[`${m}-${y}`];if(!d||!(d.gastos||[]).length)return null;
    return (d.gastos||[]).reduce((a,g)=>a+((tendCat==='todas'||(g.categoria||'varios')===tendCat)?(+g.importe||0):0),0);});
  const con=vals.filter(v=>v!==null),prom=con.length?con.reduce((a,b)=>a+b,0)/con.length:null;
  const sel=MESES.indexOf(selMes.value);
  const acc=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#1D9E75';
  const txt2=getComputedStyle(document.documentElement).getPropertyValue('--text2').trim()||'#888';
  const lc=tendCat==='todas'?acc:colorCat(tendCat),lf=tendCat==='todas'?acc+'22':colorCat(tendCat,.15);
  const ds=[{label:tendCat==='todas'?'Total':nombreCat(tendCat),data:vals,borderColor:lc,backgroundColor:lf,fill:true,tension:.3,spanGaps:true,borderWidth:2.5,
      pointRadius:vals.map((_,i)=>i===sel?6:3),pointBackgroundColor:vals.map((_,i)=>i===sel?lc:'#fff'),pointBorderColor:lc,pointBorderWidth:2},
    {label:'Promedio',data:MESES.map(()=>prom),borderColor:txt2,borderDash:[5,5],borderWidth:1.5,pointRadius:0,fill:false}];
  const tope=con.length?Math.max(...con)*2:undefined;   // así la línea queda más o menos a la mitad del gráfico
  if(tendChart){tendChart.data.datasets=ds;tendChart.options.scales.y.suggestedMax=tope;tendChart.update();return;}
  tendChart=new Chart(document.getElementById('tendencia'),{type:'line',data:{labels:MESES.map(m=>m.slice(0,3)),datasets:ds},
    options:{responsive:true,maintainAspectRatio:false,animation:{duration:700,easing:'easeOutQuart'},interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.parsed.y==null?'':` ${c.dataset.label}: ${fmt(c.parsed.y)}`}}},
      scales:{x:{grid:{display:false},ticks:{color:txt2,font:{family:'Nunito',size:10,weight:'700'}}},
        y:{beginAtZero:true,suggestedMax:tope,grid:{color:'rgba(128,128,128,.12)'},ticks:{color:txt2,font:{family:'Nunito',size:10},callback:v=>v>=1e6?(v/1e6).toLocaleString('es-AR')+' M':v>=1e3?Math.round(v/1e3)+' k':v}}}}});
}
function setTendCat(id){tendCat=id;wr('tend-cat',id);tendencia();}
/* flechitas de las categorías: corren de a "una pantalla" y se apagan en los extremos */
function moverFiltros(dir){const f=document.getElementById('filtros');f.scrollBy({left:dir*f.clientWidth*.7,behavior:'smooth'});}
function flechasFiltros(){const f=document.getElementById('filtros'),w=document.getElementById('filtrosW');if(!f||!w)return;
  const max=f.scrollWidth-f.clientWidth;w.classList.toggle('sin-scroll',max<=2);
  w.querySelector('.izq').disabled=f.scrollLeft<=2;w.querySelector('.der').disabled=f.scrollLeft>=max-2;}
document.getElementById('filtros').addEventListener('scroll',flechasFiltros,{passive:true});
addEventListener('resize',flechasFiltros);
if(window.ResizeObserver)new ResizeObserver(flechasFiltros).observe(document.getElementById('filtros'));   // cuando aparece la sección de gráficos
/* la categoría elegida siempre a la vista */
function verChipActivo(){const c=document.querySelector('#filtros .chip.on');if(c)c.scrollIntoView({block:'nearest',inline:'nearest'});}

/* ---------- gráfico ---------- */
let chart=null;
function grafico(){
  if(typeof Chart==='undefined')return;
  const por={};(datos[periodo()].gastos||[]).forEach(g=>{const v=+g.importe||0;if(v>0){const c=g.categoria||'varios';por[c]=(por[c]||0)+v;}});
  const e=Object.entries(por).sort((a,b)=>b[1]-a[1]);
  const total=e.reduce((t,x)=>t+x[1],0);
  /* porcentaje de cada categoría al lado del nombre (ej: "Comida 35%") */
  const pct=v=>{const p=total?v/total*100:0;return p>0&&p<1?'<1%':Math.round(p)+'%';};
  const labels=e.map(([c,v])=>`${iconCat(c)} ${nombreCat(c)} ${pct(v)}`),vals=e.map(x=>x[1]);
  const cols=e.map(([c])=>colorCat(c));
  /* comparación de cada categoría con el mes anterior: 1 = gasté más, -1 = gasté menos, 0 = igual */
  const idx=MESES.indexOf(selMes.value),y=+selAnio.value,[mA,yA]=idx===0?[MESES[11],y-1]:[MESES[idx-1],y];
  const gAnt=(datos[`${mA}-${yA}`]||{}).gastos||[],ant={};
  gAnt.forEach(g=>{const v=+g.importe||0;if(v>0){const c=g.categoria||'varios';ant[c]=(ant[c]||0)+v;}});
  const flechas=gAnt.length?e.map(([c,v])=>{const a=ant[c]||0;return Math.round(v)>Math.round(a)?1:Math.round(v)<Math.round(a)?-1:0;}):[];
  const difs=e.map(([c,v])=>v-(ant[c]||0));
  const txt=getComputedStyle(document.documentElement).getPropertyValue('--text').trim()||'#1a1a1a';
  if(chart){chart.$flechas=flechas;chart.$difs=difs;chart.$mA=mA;chart.data.labels=labels;chart.data.datasets[0].data=vals;chart.data.datasets[0].backgroundColor=cols;chart.options.plugins.legend.labels.color=txt;chart.update();return;}
  chart=new Chart(document.getElementById('grafico'),{type:'pie',plugins:[flechasPlugin],
    data:{labels,datasets:[{data:vals,backgroundColor:cols,borderWidth:2,borderColor:getComputedStyle(document.documentElement).getPropertyValue('--surface').trim()||'#fff'}]},
    options:{responsive:true,maintainAspectRatio:false,animation:{animateRotate:true,animateScale:true,duration:700,easing:'easeOutQuart'},
      plugins:{legend:{position:'right',labels:{color:txt,boxWidth:10,font:{family:'Nunito',size:11,weight:'600'}}},
        tooltip:{callbacks:{label:c=>' '+fmt(c.parsed),
          afterLabel:c=>{const f=(chart.$flechas||[])[c.dataIndex];if(f===undefined)return '';const d=(chart.$difs||[])[c.dataIndex];
            return f>0?` ▲ ${fmt(d)} más que en ${chart.$mA}`:f<0?` ▼ ${fmt(-d)} menos que en ${chart.$mA}`:` = igual que en ${chart.$mA}`;}}}}}});
  chart.$flechas=flechas;chart.$difs=difs;chart.$mA=mA;chart.update();
}
/* escribe el % adentro de cada color de la torta */
const flechasPlugin={id:'porcentajes',afterDatasetsDraw(ch){
  const ds=ch.data.datasets[0],tot=(ds.data||[]).reduce((a,b)=>a+(+b||0),0);if(!tot)return;const ctx=ch.ctx;
  const rFinal=Math.min(ch.chartArea.width,ch.chartArea.height)/2;
  ch.getDatasetMeta(0).data.forEach((arc,i)=>{
    if(arc.outerRadius<rFinal*.85)return;                     // mientras la torta se está armando, todavía no
    const p=ds.data[i]/tot*100;if(p<5)return;                 // en porciones muy chicas no entra
    const a=(arc.startAngle+arc.endAngle)/2,r=arc.outerRadius*(p>40?.55:.66);
    const x=arc.x+Math.cos(a)*r,y=arc.y+Math.sin(a)*r;
    ctx.save();ctx.font="800 14px Nunito, sans-serif";ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=3;ctx.fillText(Math.round(p)+'%',x,y);ctx.restore();
  });
}};

/* ---------- backup ---------- */
async function descargarBackup(){
  const nombre=`gastos-backup-${new Date().toISOString().slice(0,10)}.json`,blob=new Blob([JSON.stringify(datos,null,2)],{type:'application/json'});
  try{const f=new File([blob],nombre,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Backup de gastos'});return;}}
  catch(err){if(err.name==='AbortError')return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nombre;document.body.appendChild(a);a.click();a.remove();
}
document.getElementById('fileIn').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(typeof d!=='object'||Array.isArray(d))throw 0;datos=d;guardar();location.reload();}
    catch(err){aviso('No se pudo leer el archivo.','Error');}};
  r.readAsText(f);e.target.value='';cerrar('opts');
});
/* ---------- categorías ---------- */
const EMOJIS='📦 🏠 🍔 🚗 💡 💳 💊 🎉 🐷 🛒 ☕ 🍕 🍺 🎁 👕 👟 💇 🐶 🐱 📱 💻 🎮 📚 🎓 ✈️ 🏖️ 🚌 ⛽ 🔧 🏋️ ⚽ 🎬 🎵 🧾 🏦 💰 👶 🧸 🌱 🧴 🧹 🛠️ 📺 🍷 🍰 ❤️ ⭐'.split(' ');
let emoPara=null;
/* acordeones de Opciones: abrir uno cierra el otro */
function toggleOpt(id,forzar){document.querySelectorAll('.oacc').forEach(el=>{const o=el.id===id&&(forzar||!el.classList.contains('open'));
  el.classList.toggle('open',o);el.querySelector('.oacc-h').setAttribute('aria-expanded',o);});if(id==='oCat')dibujarCats();}
function abrirCats(){dibujarCats();toggleOpt('oCat',true);abrir('opts');}
function abrirOpts(){dibujarCats();document.getElementById('lmTxt').textContent='Limpiar '+selMes.value+' '+selAnio.value;abrir('opts');}
function cerrarOpts(){cerrar('opts');render();}   // al cerrar se aplican los cambios de categorías
function usosCat(id){let n=0;Object.values(datos).forEach(d=>(d.gastos||[]).forEach(g=>{if((g.categoria||'varios')===id)n++;}));return n;}
function dibujarCats(){
  document.getElementById('catList').innerHTML=CATS.map(c=>`<div class="cat-it">
    <button class="emo-b" onclick="abrirEmo('${c.id}')" aria-label="Cambiar emoji de ${esc(c.label)}">${c.icon}</button>
    <span class="cat-dot" style="background:${colorCat(c.id)}"></span>
    <input type="text" value="${esc(c.label)}" maxlength="24" aria-label="Nombre de la categoría" onchange="renombrarCat('${c.id}',this.value)" onfocus="this.select()">
    ${c.id==='varios'?'<span class="cat-fija" title="No se puede borrar">fija</span>':`<button class="del" onclick="borrarCat('${c.id}')" aria-label="Borrar ${esc(c.label)}"><i class="ti ti-trash"></i></button>`}
  </div>`).join('');
}
function renombrarCat(id,v){const c=catDe(id);if(!c)return;v=v.trim();if(v)c.label=v;guardarCats();dibujarCats();}
function nuevaCat(){
  // color: el siguiente de la serie, salteando los que ya están en uso
  const usados=CATS.map(c=>c.h);let i=CATS.length,h;do{h=(i*137.5+150)%360;i++;}while(usados.some(u=>Math.abs(u-h)<8)&&i<200);
  const c={id:'c'+Date.now().toString(36),icon:'🏷️',label:'Nueva',h};CATS.push(c);guardarCats();dibujarCats();
  const ins=document.querySelectorAll('#catList input');const last=ins[ins.length-1];if(last){last.focus();last.select();last.scrollIntoView({block:'center'});}
}
function borrarCat(id){const c=catDe(id),n=usosCat(id);
  cerrar('opts');
  confirmar(n?`"${c.label}" tiene ${n} gasto${n===1?'':'s'} cargado${n===1?'':'s'}. Esos gastos pasan a "${nombreCat('varios')}".`:`¿Borrar la categoría "${c.label}"?`,()=>{
    Object.values(datos).forEach(d=>(d.gastos||[]).forEach(g=>{if((g.categoria||'varios')===id)g.categoria='varios';}));
    CATS=CATS.filter(x=>x.id!==id);guardarCats();guardar();if(ultCat===id)ultCat='varios';render();abrirCats();
  },'Borrar categoría',true);
  dlgNo.onclick=()=>{cerrar('dlg');abrirCats();};
}
function abrirEmo(id){emoPara=id;document.getElementById('emoGrid').innerHTML=EMOJIS.map(e=>`<button onclick="elegirEmoji('${e}')" aria-label="${e}">${e}</button>`).join('');
  document.getElementById('emoIn').value='';abrir('emo');}
function elegirEmoji(e){e=(e||'').trim();if(!e)return;const c=catDe(emoPara);if(c){c.icon=[...e].slice(0,2).join('');guardarCats();dibujarCats();}cerrar('emo');}

function limpiarMes(){const p=periodo(),n=`${selMes.value} ${selAnio.value}`;cerrar('opts');
  confirmar(`¿Eliminar los gastos e ingresos de ${n}? No se pueden recuperar.`,()=>{delete datos[p];guardar();render();},'Limpiar mes',true);}
function limpiarTodo(){cerrar('opts');confirmar('¿Eliminar TODOS los gastos? No se pueden recuperar (descargá un backup antes si querés).',()=>{datos={};guardar();render();},'Atención',true);}

selMes.addEventListener('change',render);selAnio.addEventListener('change',render);
render();
</script>
