<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coaching">
<link rel="apple-touch-icon" href="img/apple-touch.png?v=10">
<link rel="icon" type="image/png" href="img/icono.png?v=10">
<title>Coaching de pareja</title>
<script src="tema.js"></script>
<script src="sonidos.js"></script>
<script src="firebase-config.js"></script>
<script src="coaching-datos.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--accent:#1D9E75;--accent-dark:#0F6E56;--accent-light:#E1F5EE;--neg:#E24B4A;--ok:#15803d;
        --bg:#f5f5f0;--surface:#fff;--surface2:#f5f5f0;--border:rgba(0,0,0,.1);--border2:rgba(0,0,0,.18);--text:#1a1a1a;--text2:#666;
        --juli:#DB2777;--juli-l:#FCE7F3;--ale:#0284C7;--ale-l:#E0F2FE}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--surface:#1c1c1e;--surface2:#2c2c2e;--border:rgba(255,255,255,.1);--border2:rgba(255,255,255,.2);--text:#f5f5f5;--text2:#aaa;--ok:#4ADE80}}
  :root[data-theme="dark"]{--bg:#111;--surface:#1c1c1e;--surface2:#2c2c2e;--border:rgba(255,255,255,.1);--border2:rgba(255,255,255,.2);--text:#f5f5f5;--text2:#aaa;--ok:#4ADE80}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none !important}
  body{font-family:'Nunito',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh}
  .top{background:var(--surface);border-bottom:3px solid var(--accent);padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
  .top h1{font-size:1.1rem;color:var(--accent);font-weight:800;letter-spacing:.05em}
  main{max-width:560px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:12px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 40px)}
  input,select,button,textarea{font-family:inherit;color:var(--text)}
  .card{background:var(--surface);border:.5px solid var(--border);border-radius:18px;padding:14px}
  h2{font-size:.95rem;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  h2 i{color:var(--accent)}
  .btn{border:none;border-radius:14px;padding:13px;font-size:1rem;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:#fff;width:100%}
  .btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border2)}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.45}
  .nota{color:var(--text2);font-size:.85rem;font-weight:600;line-height:1.4}
  .vacio{text-align:center;color:var(--text2);padding:14px 0;font-weight:700}
  /* pestañas */
  .seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);border:.5px solid var(--border);border-radius:16px;padding:4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 67px);z-index:15}
  .seg button{border:0;background:none;border-radius:12px;padding:8px 2px;font-weight:800;font-size:.78rem;color:var(--text2);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
  .seg button i{font-size:1.25rem}
  .seg button.on{background:var(--accent);color:#fff}
  .chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .chips::-webkit-scrollbar{display:none}
  .chips button{border:2px solid var(--border2);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:800;font-size:.85rem;cursor:pointer;white-space:nowrap}
  .chips button.on{border-color:var(--accent);background:var(--accent-light);color:var(--accent-dark)}
  /* carta */
  .carta{perspective:900px;height:260px;cursor:pointer}
  .carta .in{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
  .carta.vuelta .in{transform:rotateY(180deg)}
  .carta .cara{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:10px 30px 10px 30px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
  .carta .dorso{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff}
  .carta .dorso b{font-size:3rem}.carta .dorso span{font-weight:800;margin-top:8px;opacity:.9}
  .carta .frente{background:var(--surface);border:2px solid var(--accent);transform:rotateY(180deg)}
  .carta .frente small{font-weight:900;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
  .carta .frente p{font-size:1.3rem;font-weight:800;line-height:1.35}
  .acc3{display:grid;grid-template-columns:1fr auto auto;gap:8px}
  .acc3 .ic{width:52px;padding:0}
  .acc3 .ic.on{background:var(--accent-light);border-color:var(--accent);color:var(--accent-dark)}
  /* chequeo */
  .area{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-top:1px solid var(--border)}
  .area:first-of-type{border-top:0}
  .area b{font-weight:800}
  .pts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .pts button{border:2px solid var(--border2);background:var(--surface2);border-radius:12px;padding:9px 0;font-weight:900;font-size:1rem;cursor:pointer}
  .pts button.on{border-color:var(--accent);background:var(--accent);color:#fff}
  .ext{display:flex;justify-content:space-between;font-size:.72rem;color:var(--text2);font-weight:700}
  .res{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--border)}
  .res:first-of-type{border-top:0}
  .barra{display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:800}
  .barra i{display:block;height:10px;border-radius:99px;min-width:4px}
  .barra .j{background:var(--juli)}.barra .a{background:var(--ale)}
  .alerta{grid-column:1/-1;font-size:.8rem;font-weight:800;color:#B45309;background:#FEF3C7;border-radius:8px;padding:5px 8px}
  .prom{display:flex;gap:10px}
  .prom div{flex:1;border-radius:14px;padding:10px;text-align:center}
  .prom b{display:block;font-size:1.6rem;font-weight:900}.prom small{font-weight:800;font-size:.8rem}
  /* gratitud */
  .nota-g{border-radius:6px 18px 6px 18px;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
  .nota-g small{font-size:.75rem;font-weight:800;opacity:.8}
  .nota-g p{font-weight:700;white-space:pre-wrap;overflow-wrap:anywhere}
  textarea.in,input.in{font-size:1rem;font-weight:700;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:10px;outline:none;width:100%;min-width:0}
  textarea.in{resize:vertical;min-height:80px;font-weight:600}
  /* citas */
  .idea{text-align:center;padding:20px 14px}
  .idea .e{font-size:3.2rem;line-height:1.2}
  .idea p{font-size:1.2rem;font-weight:800;margin-top:6px}
  .idea small{display:inline-block;margin-top:8px;font-weight:800;font-size:.75rem;color:var(--text2);background:var(--surface2);padding:3px 10px;border-radius:99px}
  .dos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  /* puerta (+18 / perfil) */
  .puerta{text-align:center;padding:30px 18px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .puerta .big{font-size:3.4rem}
  .puerta b{font-size:1.15rem;font-weight:900}
  .puerta .btn{max-width:280px}
  .aviso{display:flex;gap:8px;align-items:flex-start;font-size:.8rem;color:var(--text2);font-weight:600;line-height:1.4}
  /* hoja */
  .bgm{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .bgm.show{display:flex}
  .sheet{background:var(--surface);width:100%;max-width:520px;max-height:92dvh;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:12px}
  @media (min-width:760px){.bgm{align-items:center}.sheet{border-radius:20px}}
  .sheet h3{text-align:center;font-weight:900}
  .lbl{font-size:.72rem;font-weight:800;color:var(--text2);letter-spacing:.03em;display:flex;flex-direction:column;gap:5px}
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);transform:translate(-50%,20px);background:#1a1a1a;color:#fff;padding:10px 16px;border-radius:999px;font-weight:800;font-size:.9rem;opacity:0;pointer-events:none;transition:all .25s;z-index:60;white-space:nowrap}
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
<link rel="stylesheet" href="fondo.css">
<link rel="stylesheet" href="comun.css">
</head>
<body>
<div class="top">
  <a class="home-link" href="index.html" aria-label="Volver al inicio"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg></a>
  <h1>COACHING</h1>
</div>
<main id="main"><div class="card vacio">Cargando…</div></main>

<!-- agendar cita -->
<div class="bgm" id="fmC" onclick="if(event.target===this)cerrar('fmC')">
  <form class="sheet" onsubmit="event.preventDefault();agendar()">
    <h3>📅 Agendar cita</h3>
    <p class="nota" id="cTxt" style="text-align:center"></p>
    <div class="dos"><label class="lbl">FECHA<input class="in" type="date" id="cFecha"></label><label class="lbl">HORA (OPCIONAL)<input class="in" type="time" id="cHora"></label></div>
    <div class="dos"><button type="button" class="btn ghost" onclick="cerrar('fmC')">Cancelar</button><button type="submit" class="btn"><i class="ti ti-check"></i> Agendar</button></div>
  </form>
</div>
<div class="toast" id="toast"></div>

<script>
/* ===== Coaching de pareja: cartas para conversar, chequeo semanal (privado), gratitud e ideas de citas ===== */
const BASE=JSON.parse(JSON.stringify(window.COACH));let D=JSON.parse(JSON.stringify(BASE));
const rd=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const snd=n=>{try{window.sonido&&sonido(n)}catch(e){}};
const $=id=>document.getElementById(id);
const p2=n=>String(n).padStart(2,'0');
const hoyS=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const nid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const J=()=>window.JUNTOS||{};
const yo=()=>J().miSlot||null;
const nom=s=>((J().nombres||{})[s])||(s==='j'?'Ella':'Él');
const otro=()=>yo()==='j'?'a':'j';
const azar=a=>a[Math.floor(Math.random()*a.length)];
function semana(d=new Date()){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);
  const y=t.getUTCFullYear(),w=Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7);return y+'-'+p2(w);}
// Bolsa: no repite nada hasta haber mostrado todo (se guarda en este celu); al terminar vuelve a empezar sin repetir el último
function bolsa(key,ids){if(!ids.length)return null;let u=rd('bag_'+key,[]).filter(x=>ids.includes(x)),libres=ids.filter(x=>!u.includes(x));
  if(!libres.length){const ult=u[u.length-1];u=ult!=null?[ult]:[];libres=ids.filter(x=>x!==ult);if(!libres.length)libres=ids;}
  const id=azar(libres);u.push(id);wr('bag_'+key,u);return id;}
// Suma lo agregado desde el panel y saca lo oculto
function aplicarContenido(C){const A=(C&&C.agregados)||{},O=(C&&C.ocultos)||{},fuera=k=>new Set(O[k]||[]);
  const oc=fuera('coach.cartas'),oi=fuera('coach.citas');
  D.cartas=BASE.cartas.filter(c=>!oc.has(c.id)).concat((A['coach.cartas']||[]).filter(c=>c&&c.t&&c.n&&!oc.has(c.id)));
  D.citas=BASE.citas.filter(c=>!oi.has(c.id)).concat((A['coach.citas']||[]).filter(c=>c&&c.t&&!oi.has(c.id)).map(c=>Object.assign({l:'casa',c:'gratis',e:'💞'},c)));}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2400);}
function cerrar(id){$(id).classList.remove('show');}

let db=null,TAB=rd('coach_tab','cartas'),CART=rd('coach_cartas_v1',{fav:{},hechas:{}}),GRAC=rd('coach_gracias_v1',{});
let nivel=rd('coach_nivel','liviano'),carta=null,vuelta=false,soloFav=false;
let filtro={l:'',c:''},idea=null,CHQ=null;

/* ---------- puerta: necesita JuntOS, el cumpleaños cargado y +18 ---------- */
function puerta(){
  const j=J();
  if(!window.jxPrivado)return `<div class="card puerta"><div class="big">💬</div><b>Disponible en JuntOS</b><p class="nota">Esta sección funciona con tu cuenta de JuntOS.</p></div>`;
  if(!j.miCumple&&!j.perfilListo)return 'esperar';
  if(!j.miCumple)return `<div class="card puerta"><div class="big">🎂</div><b>Falta tu cumpleaños</b><p class="nota">Para entrar a esta sección tenés que completar tu perfil con tu fecha de cumpleaños.</p><a class="btn" href="index.html">Completar en el inicio</a></div>`;
  if(j.miEdad<18)return `<div class="card puerta"><div class="big">🔞</div><b>Solo para mayores de 18</b><p class="nota">Esta sección es para mayores de edad.</p></div>`;
  return '';
}

/* ---------- pantalla ---------- */
const TABS=[['cartas','ti-cards','Cartas'],['chequeo','ti-heart-rate-monitor','Chequeo'],['gracias','ti-heart-handshake','Gratitud'],['citas','ti-calendar-heart','Citas']];
function render(){
  const p=puerta();if(p==='esperar')return;
  if(p){$('main').innerHTML=p;return;}
  const s=`<nav class="seg">${TABS.map(([k,i,t])=>`<button class="${k===TAB?'on':''}" onclick="irTab('${k}')"><i class="ti ${i}"></i>${t}</button>`).join('')}</nav>`;
  $('main').innerHTML=s+'<div id="sec" style="display:flex;flex-direction:column;gap:12px"></div>'
    +`<p class="aviso"><span>ℹ️</span><span>Estas herramientas ayudan a conversar, pero no reemplazan a un profesional. Si están pasando un momento difícil, consultar con un terapeuta de pareja puede ayudar mucho.</span></p>`;
  ({cartas:rCartas,chequeo:rChequeo,gracias:rGracias,citas:rCitas}[TAB]||rCartas)();
}
function irTab(k){TAB=k;wr('coach_tab',k);snd('tap');render();scrollTo({top:0});}

/* ---------- Cartas ---------- */
function mazo(){return D.cartas.filter(c=>soloFav?CART.fav[c.id]:c.n===nivel);}
function rCartas(){
  const m=mazo();if(!carta||!m.some(c=>c.id===carta.id)){const id=bolsa('cartas_'+(soloFav?'fav':nivel),m.map(c=>c.id));carta=m.find(c=>c.id===id)||null;vuelta=false;}
  const n=D.niveles.find(x=>x.id===(carta?carta.n:nivel))||D.niveles[0];
  const charl=D.cartas.filter(c=>c.n===nivel&&CART.hechas[c.id]).length,tot=D.cartas.filter(c=>c.n===nivel).length;
  $('sec').innerHTML=`<div class="chips">${D.niveles.map(x=>`<button class="${!soloFav&&x.id===nivel?'on':''}" onclick="elegirNivel('${x.id}')">${x.emoji} ${x.nombre}</button>`).join('')}
      <button class="${soloFav?'on':''}" onclick="soloFav=!soloFav;carta=null;render()">⭐ Favoritas</button></div>
    ${carta?`<div class="carta${vuelta?' vuelta':''}" id="carta" onclick="darVuelta()"><div class="in">
      <div class="cara dorso"><b>${n.emoji}</b><span>Tocá para dar vuelta</span></div>
      <div class="cara frente"><small>${n.emoji} ${n.nombre}</small><p>${esc(carta.t)}</p></div></div></div>
    <div class="acc3"><button class="btn" onclick="otraCarta()"><i class="ti ti-refresh"></i> Otra carta</button>
      <button class="btn ghost ic${CART.fav[carta.id]?' on':''}" onclick="marcar('fav')" aria-label="Favorita">⭐</button>
      <button class="btn ghost ic${CART.hechas[carta.id]?' on':''}" onclick="marcar('hechas')" aria-label="Ya la charlamos">✓</button></div>
    ${soloFav?'':`<p class="nota" style="text-align:center">Charlaron ${charl} de ${tot} cartas de este nivel</p>`}`
    :`<div class="card vacio">${soloFav?'Todavía no marcaron favoritas ⭐':'No hay cartas'}</div>`}`;
}
function elegirNivel(n){nivel=n;soloFav=false;wr('coach_nivel',n);carta=null;snd('tap');render();}
function darVuelta(){vuelta=!vuelta;$('carta').classList.toggle('vuelta',vuelta);snd('tap');}
function otraCarta(){const m=mazo(),id=bolsa('cartas_'+(soloFav?'fav':nivel),m.map(c=>c.id));
  carta=m.find(c=>c.id===id)||carta;vuelta=false;render();setTimeout(()=>{vuelta=true;const c=$('carta');c&&c.classList.add('vuelta');},60);snd('tap');}
function marcar(k){if(!carta)return;const v=!CART[k][carta.id];if(v)CART[k][carta.id]=true;else delete CART[k][carta.id];
  wr('coach_cartas_v1',CART);if(db)db.collection('coach').doc('cartas').set({[k]:{[carta.id]:v?true:firebase.firestore.FieldValue.delete()}},{merge:true}).catch(()=>{});
  snd(v?'agregar':'tap');render();if(vuelta){const c=$('carta');c&&c.classList.add('vuelta');}}

/* ---------- Chequeo semanal (privado hasta que contestan los dos) ---------- */
let MIAS={},cargandoChq=false;
function rChequeo(){
  const sem=semana();
  if(!CHQ||CHQ.sem!==sem){if(!cargandoChq)cargarChequeo();$('sec').innerHTML='<div class="card vacio">Cargando…</div>';return;}
  if(CHQ.mio&&!CHQ.editar){
    if(!CHQ.otro){$('sec').innerHTML=`<div class="card puerta"><div class="big">⏳</div><b>¡Listo! Ya respondiste esta semana</b>
      <p class="nota">Cuando ${esc(nom(otro()))} responda, van a ver los resultados juntos. Hasta entonces nadie ve lo que puso el otro.</p>
      <button class="btn ghost" onclick="avisarChequeo()"><i class="ti ti-bell"></i> Avisarle que responda</button>
      <button class="btn ghost" onclick="CHQ.editar=true;MIAS=Object.assign({},CHQ.mio.p);render()"><i class="ti ti-pencil"></i> Cambiar mis respuestas</button></div>`;return;}
    const m=CHQ.mio.p||{},o=CHQ.otro.p||{},yoS=yo(),oS=otro();
    const prom=x=>{const v=D.areas.map(a=>x[a.id]).filter(Boolean);return v.length?(v.reduce((s,n)=>s+n,0)/v.length).toFixed(1).replace('.',','):'–';};
    $('sec').innerHTML=`<div class="card"><h2><i class="ti ti-chart-bar"></i> Resultados de la semana</h2>
      <div class="prom"><div style="background:var(--surface);box-shadow:inset 0 0 0 999px var(--${yoS==='j'?'juli':'ale'}-l)"><b>${prom(m)}</b><small>${esc(nom(yoS))}</small></div><div style="background:var(--surface);box-shadow:inset 0 0 0 999px var(--${oS==='j'?'juli':'ale'}-l)"><b>${prom(o)}</b><small>${esc(nom(oS))}</small></div></div></div>
      <div class="card">${D.areas.map(a=>{const x=m[a.id]||0,y=o[a.id]||0;
        return `<div class="res"><b>${a.emoji} ${a.nombre}</b><span></span>
          <div class="barra"><i class="${yoS}" style="width:${x*18}%"></i>${x} · ${esc(nom(yoS))}</div><span></span>
          <div class="barra"><i class="${oS}" style="width:${y*18}%"></i>${y} · ${esc(nom(oS))}</div><span></span>
          ${Math.abs(x-y)>=2?'<div class="alerta">💬 Lo ven distinto: buen tema para charlar esta semana</div>':Math.min(x,y)<=2?'<div class="alerta">🌱 Los dos lo sienten bajo: elijan una acción chiquita para mejorarlo</div>':''}</div>`;}).join('')}</div>
      ${CHQ.mio.c||CHQ.otro.c?`<div class="card"><h2><i class="ti ti-message-heart"></i> Lo que quisieron decir</h2>
        ${CHQ.mio.c?`<div class="nota-g" style="background:var(--surface);box-shadow:inset 0 0 0 999px var(--${yoS==='j'?'juli':'ale'}-l)"><small>${esc(nom(yoS))}</small><p>${esc(CHQ.mio.c)}</p></div>`:''}
        ${CHQ.otro.c?`<div class="nota-g" style="background:var(--surface);box-shadow:inset 0 0 0 999px var(--${oS==='j'?'juli':'ale'}-l);margin-top:8px"><small>${esc(nom(oS))}</small><p>${esc(CHQ.otro.c)}</p></div>`:''}</div>`:''}
      <p class="nota" style="text-align:center">El chequeo se renueva cada semana (lunes).</p>`;return;}
  $('sec').innerHTML=`<div class="card"><h2><i class="ti ti-heart-rate-monitor"></i> ¿Cómo estamos esta semana?</h2>
    <p class="nota">Puntuá del 1 al 5. <b>Es privado:</b> ${esc(nom(otro()))} solo lo ve cuando responda también, y ven los resultados juntos.</p>
    ${D.areas.map(a=>`<div class="area"><b>${a.emoji} ${a.nombre}</b><div class="pts">${[1,2,3,4,5].map(n=>`<button class="${MIAS[a.id]===n?'on':''}" onclick="punto('${a.id}',${n})">${n}</button>`).join('')}</div>
      <div class="ext"><span>Mal</span><span>Muy bien</span></div></div>`).join('')}
    <label class="lbl" style="margin-top:8px">¿ALGO QUE QUIERAS DECIR? (OPCIONAL)<textarea class="in" id="chC" maxlength="400" placeholder="Ej: me gustaría que salgamos más">${esc((CHQ.mio&&CHQ.mio.c)||'')}</textarea></label>
    <button class="btn" style="margin-top:12px" id="chOk" onclick="enviarChequeo()" ${D.areas.every(a=>MIAS[a.id])?'':'disabled'}><i class="ti ti-send"></i> Enviar respuestas</button></div>`;
}
function punto(a,n){MIAS[a]=n;snd('tap');const c=$('chC')?$('chC').value:'';rChequeo();if($('chC'))$('chC').value=c;}
async function cargarChequeo(){cargandoChq=true;const sem=semana();
  try{const r=await window.jxPrivado.leer('chequeo-'+sem);CHQ={sem,mio:r.mio,otro:r.otro||null,otroListo:r.otro_listo};}catch(e){CHQ={sem,mio:null,otro:null,error:true};}
  cargandoChq=false;if(TAB==='chequeo')render();}
async function enviarChequeo(){const sem=semana(),d={p:Object.assign({},MIAS),c:($('chC').value||'').trim()};
  $('chOk').disabled=true;
  try{await window.jxPrivado.guardar('chequeo-'+sem,d);snd('agregar');CHQ=null;MIAS={};
    if(!(await window.jxPrivado.leer('chequeo-'+sem)).otro_listo)window.jxAvisarPareja({titulo:nom(yo())+' respondió el chequeo de la semana',texto:'Respondé vos también para ver los resultados juntos.',emoji:'💬',url:'coaching.html#chequeo'}).catch(()=>{});
    render();toast('Respuestas guardadas');}
  catch(e){$('chOk').disabled=false;toast('No se pudo guardar, probá de nuevo');}}
function avisarChequeo(){window.jxAvisarPareja({titulo:nom(yo())+' te espera en el chequeo semanal',texto:'Respondé para ver los resultados juntos.',emoji:'💬',url:'coaching.html#chequeo'})
  .then(()=>toast('Listo, le avisamos 💬')).catch(e=>toast(e.message||'No se pudo avisar'));}

/* ---------- Gratitud ---------- */
function rGracias(){
  const l=Object.values(GRAC).sort((a,b)=>(b.creado||0)-(a.creado||0));
  $('sec').innerHTML=`<div class="card"><h2><i class="ti ti-heart-handshake"></i> Hoy valoré de vos…</h2>
    <textarea class="in" id="gTxt" maxlength="400" placeholder="Ej: que me esperaste con la cena aunque llegué tarde"></textarea>
    <button class="btn" style="margin-top:10px" onclick="enviarGracias()"><i class="ti ti-send"></i> Enviar a ${esc(nom(otro()))}</button>
    <p class="nota" style="margin-top:8px">Le llega a su casilla ✉️ y como notificación.</p></div>
    ${l.length?`<div class="card" style="display:flex;flex-direction:column;gap:8px"><h2><i class="ti ti-notes"></i> Notas</h2>${l.map(g=>`<div class="nota-g" style="background:var(--surface);box-shadow:inset 0 0 0 999px var(--${g.de==='j'?'juli':'ale'}-l)">
      <small>${esc(nom(g.de))} → ${esc(nom(g.de==='j'?'a':'j'))} · ${new Date(g.creado).toLocaleDateString('es-AR',{day:'numeric',month:'short'})}</small><p>${esc(g.texto)}</p></div>`).join('')}</div>`
    :'<div class="card vacio">Todavía no hay notas. ¡Mandá la primera! 💞</div>'}`;
}
function enviarGracias(){const t=$('gTxt').value.trim();if(!t){$('gTxt').focus();return;}
  const g={id:nid('g'),de:yo(),texto:t,creado:Date.now()};GRAC[g.id]=g;wr('coach_gracias_v1',GRAC);
  if(db)db.collection('coach_gracias').doc(g.id).set(g).catch(()=>{});
  window.jxAvisarPareja({titulo:nom(yo())+' te dejó una nota 💞',texto:t.length>120?t.slice(0,120)+'…':t,emoji:'💞',url:'coaching.html#gracias'}).catch(()=>{});
  snd('agregar');toast('Nota enviada 💞');render();}

/* ---------- Ideas de citas ---------- */
function ideas(){return D.citas.filter(c=>(!filtro.l||c.l===filtro.l)&&(!filtro.c||c.c===filtro.c));}
function rCitas(){
  const l=ideas();if(!idea||!l.some(c=>c.id===idea.id)){const id=bolsa('citas_'+filtro.l+filtro.c,l.map(c=>c.id));idea=l.find(c=>c.id===id)||null;}
  const ch=(k,v,t)=>`<button class="${filtro[k]===v?'on':''}" onclick="filtro.${k}='${v}';idea=null;render()">${t}</button>`;
  $('sec').innerHTML=`<div class="chips">${ch('l','','Todas')}${ch('l','casa','🏠 En casa')}${ch('l','afuera','🌳 Afuera')}</div>
    <div class="chips">${ch('c','','Cualquier costo')}${ch('c','gratis','🆓 Gratis')}${ch('c','plata','💸 Con plata')}</div>
    ${idea?`<div class="card idea"><div class="e">${idea.e}</div><p>${esc(idea.t)}</p><small>${idea.l==='casa'?'🏠 En casa':'🌳 Afuera'} · ${idea.c==='gratis'?'Gratis':'Con plata'}</small></div>
      <div class="dos"><button class="btn ghost" onclick="otraIdea()"><i class="ti ti-refresh"></i> Otra idea</button><button class="btn" onclick="abrirAgendar()"><i class="ti ti-calendar-plus"></i> Agendar</button></div>`
    :'<div class="card vacio">No hay ideas con esos filtros</div>'}`;
}
function otraIdea(){const l=ideas(),id=bolsa('citas_'+filtro.l+filtro.c,l.map(c=>c.id));idea=l.find(c=>c.id===id)||idea;snd('tap');render();}
function abrirAgendar(){if(!idea)return;$('cTxt').textContent=idea.e+' '+idea.t;$('cFecha').value=hoyS();$('cFecha').min=hoyS();$('cHora').value='';$('fmC').classList.add('show');}
function agendar(){const f=$('cFecha').value;if(!f){$('cFecha').focus();return;}
  const id=nid('e'),e={id,titulo:'💞 Cita: '+idea.t,fecha:f,hora:$('cHora').value||'',tipo:'evento',quien:'ambos',rep:'no',notas:'Idea de Coaching de pareja',creado:Date.now(),autor:yo(),editado:Date.now()};
  if(db)db.collection('calendario').doc(id).set(e).catch(()=>{});
  cerrar('fmC');snd('agregar');toast('¡Cita agendada en el Calendario! 📅');}

/* ---------- sincronización ---------- */
function loadScript(src){return new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
const ocupado=()=>$('fmC').classList.contains('show')||(document.activeElement&&/TEXTAREA|INPUT/.test(document.activeElement.tagName));
async function initFb(){
  const c=window.getFbConfig&&window.getFbConfig();if(!c)return;
  try{
    if(typeof firebase==='undefined'){
      await loadScript('https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js');
      await loadScript('https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js');
    }
    if(!firebase.apps.length)firebase.initializeApp(c);
    db=firebase.firestore();
    db.collection('coach').doc('cartas').onSnapshot(d=>{const x=d.data()||{};CART={fav:x.fav||{},hechas:x.hechas||{}};wr('coach_cartas_v1',CART);if(TAB==='cartas'&&!ocupado()){const v=vuelta;render();if(v){const c=$('carta');c&&c.classList.add('vuelta');}}},()=>{});
    db.collection('coach_gracias').onSnapshot(s=>{const r={};s.docs.forEach(d=>{const x=d.data();if(x)r[d.id]=Object.assign({},x,{id:d.id})});GRAC=r;wr('coach_gracias_v1',r);if(TAB==='gracias'&&!ocupado())render();},()=>{});
  }catch(e){}
}
// Abrir directo una pestaña desde un aviso (coaching.html#gracias)
const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h))TAB=h;
window.addEventListener('juntos',()=>{if(!ocupado())render();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&TAB==='chequeo'){CHQ=null;render();}});
window.jxContenido&&jxContenido(C=>{aplicarContenido(C);if(!ocupado())render();});
render();initFb();
</script>
</body>
</html>
