<style>
  :root{--accent:#1D9E75;--accent-dark:#0F6E56;--accent-light:#E1F5EE;--pos:#1D9E75;--neg:#E24B4A;
        --bg:#f5f5f0;--surface:#fff;--surface2:#f5f5f0;--border:rgba(0,0,0,.1);--border2:rgba(0,0,0,.18);--text:#1a1a1a;--text2:#666;
        --juli:#DB2777;--juli-l:#FCE7F3;--ale:#0284C7;--ale-l:#E0F2FE}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--surface:#1c1c1e;--surface2:#2c2c2e;--border:rgba(255,255,255,.1);--border2:rgba(255,255,255,.2);--text:#f5f5f5;--text2:#aaa;--juli:#F472B6;--juli-l:rgba(244,114,182,.16);--ale:#38BDF8;--ale-l:rgba(56,189,248,.16)}}
  :root[data-theme="dark"]{--bg:#111;--surface:#1c1c1e;--surface2:#2c2c2e;--border:rgba(255,255,255,.1);--border2:rgba(255,255,255,.2);--text:#f5f5f5;--text2:#aaa;--juli:#F472B6;--juli-l:rgba(244,114,182,.16);--ale:#38BDF8;--ale-l:rgba(56,189,248,.16)}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Nunito',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh}
  .top{background:var(--surface);border-bottom:3px solid var(--accent);padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
  .top h1{font-size:1.1rem;color:var(--accent);font-weight:800;letter-spacing:.05em}
  main{max-width:560px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:12px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 30px)}
  input,select,button{font-family:inherit;color:var(--text)}
  .num{font-variant-numeric:tabular-nums}

  /* mes y año */
  .periodo{display:flex;gap:8px}
  .sel{flex:1;font-size:1rem;font-weight:800;color:var(--accent-dark);background:var(--accent-light);border:1px solid var(--accent);border-radius:999px;padding:9px 14px;cursor:pointer;appearance:none;-webkit-appearance:none;text-align:center}
  .sel.anio{flex:0 0 110px}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sel{color:#fff;background:rgba(29,158,117,.2)}}
  :root[data-theme="dark"] .sel{color:#fff;background:rgba(29,158,117,.2)}

  .card{background:var(--surface);border:.5px solid var(--border);border-radius:18px;padding:14px}

  /* resumen: quién pagó cuánto y quién le debe a quién */
  .tot{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .tot span{font-weight:800;color:var(--text2);font-size:.85rem}
  .tot b{font-size:1.5rem;font-weight:900}
  .dos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .per{border-radius:14px;padding:10px 12px;text-align:center}
  .per.j{background:var(--juli-l)} .per.a{background:var(--ale-l)}
  .per small{display:block;font-size:.75rem;font-weight:800}
  .per.j small{color:var(--juli)} .per.a small{color:var(--ale)}
  .per b{font-size:1.15rem;font-weight:900}
  .per i{display:block;font-style:normal;font-size:.75rem;color:var(--text2);font-weight:700;margin-top:2px}
  .barra{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--surface2);margin:12px 0 10px}
  .barra .j{background:var(--juli)} .barra .a{background:var(--ale)}
  .saldo{text-align:center;font-weight:900;font-size:1.02rem;padding:10px;border-radius:12px;background:var(--surface2)}
  .saldo.ok{color:var(--pos);background:var(--accent-light)}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .saldo.ok{background:rgba(29,158,117,.18)}}

  /* botón y formulario de nuevo gasto */
  .btn{border:none;border-radius:14px;padding:13px;font-size:1rem;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:#fff}
  .btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border2)}
  .btn.danger{background:var(--neg)}
  .btn:active{transform:scale(.97)}
  .form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
  .form[hidden]{display:none}
  .form label{display:flex;flex-direction:column;gap:4px;font-size:.72rem;font-weight:800;color:var(--text2);letter-spacing:.03em}
  .form .w{grid-column:1/-1}
  .form input{font-size:1rem;font-weight:700;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:10px;outline:none;width:100%}
  .form input:focus{border-color:var(--accent)}
  .form input.imp{text-align:right}
  .quien{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .quien{grid-template-columns:1fr 1fr}
  .quien.tres{grid-template-columns:1fr 1fr 1fr}
  .quien button{border:2px solid var(--border2);background:var(--surface);border-radius:12px;padding:8px;font-weight:900;font-size:.95rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
  .quien button img{width:28px;height:28px;border-radius:50%;object-fit:cover}
  .quien button.n.on{border-color:var(--text2);background:var(--surface2)}
  .quien button.n[hidden]{display:none}
  /* interruptor de gasto fijo */
  .fijo{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface2);border-radius:12px;padding:10px 12px;cursor:pointer}
  .fijo b{font-size:.92rem;font-weight:800;display:block}
  .fijo small{font-size:.75rem;color:var(--text2);font-weight:600}
  .sw{position:relative;width:50px;height:30px;flex-shrink:0;border-radius:999px;border:none;background:var(--border2);cursor:pointer;padding:0;transition:background .2s}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
  .sw[aria-checked="true"]{background:var(--accent)}
  .sw[aria-checked="true"]::after{transform:translateX(20px)}
  .quien button.j.on{border-color:var(--juli);background:var(--juli-l);color:var(--juli)}
  .quien button.a.on{border-color:var(--ale);background:var(--ale-l);color:var(--ale)}
  .form .bt{grid-column:1/-1;display:flex;gap:8px}
  .form .bt .btn{flex:1}

  /* lista de gastos del mes */
  .lista{display:flex;flex-direction:column}
  .it{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid var(--border)}
  .it:first-child{border-top:none}
  /* gastos fijos: fondo gris para diferenciarlos de los normales */
  .it.fx{background:color-mix(in srgb,var(--text) 7%,var(--surface));border-top:none;border-radius:12px;padding:10px 8px;margin:4px 0}
  .it.fx+.it{border-top:none}
  /* check de "ya lo dividimos" */
  .chk{width:32px;height:32px;flex-shrink:0;border-radius:50%;border:2px solid var(--border2);background:var(--surface);color:transparent;font-size:1rem;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
  .chk.on{background:var(--pos);border-color:var(--pos);color:#fff}
  .chk-esp{width:32px;flex-shrink:0}
  .it.sald .tx b,.it.sald .m{text-decoration:line-through;text-decoration-thickness:2px;color:var(--text2)}
  .it.sald .av{opacity:.5}
  /* foto de quien pagó */
  .av{width:40px;height:40px;flex-shrink:0;border-radius:50%;object-fit:cover;display:block;border:2.5px solid transparent}
  .av.j{border-color:var(--juli)} .av.a{border-color:var(--ale)}
  .it .q-none{width:40px;height:40px;flex-shrink:0;border-radius:50%;border:2.5px dashed var(--border2);display:flex;align-items:center;justify-content:center;color:var(--text2);font-weight:900}
  /* gasto fijo todavía sin pagar este mes: elegir quién lo pagó */
  .it.pend .m{color:var(--text2)}
  .asig{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
  .asig span{width:100%}
  .asig span{font-size:.72rem;font-weight:800;color:var(--text2)}
  .asig button{display:flex;align-items:center;gap:5px;border:1px solid var(--border2);background:var(--surface);border-radius:999px;padding:3px 10px 3px 3px;font-size:.8rem;font-weight:800;cursor:pointer}
  .asig button img{width:24px;height:24px;border-radius:50%;object-fit:cover}
  .fijo-tag{display:inline-flex;align-items:center;gap:2px;font-size:.68rem;font-weight:900;color:var(--accent);background:var(--accent-light);border-radius:999px;padding:1px 7px;margin-left:4px;vertical-align:1px}
  .pend-tot{margin-top:8px;text-align:center;font-size:.85rem;font-weight:800;color:var(--text2)}
  .it .tx{flex:1;min-width:0;cursor:pointer}
  .it .tx b{display:block;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .it .tx small{color:var(--text2);font-weight:700;font-size:.78rem}
  .it{gap:8px}
  .it .m{font-weight:900}
  .it .del{width:38px;height:38px;flex-shrink:0;border:none;background:none;color:var(--neg);font-size:1.15rem;cursor:pointer;border-radius:10px}
  .vacio{text-align:center;color:var(--text2);padding:18px 0;font-weight:700}
  h2{font-size:.95rem;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  h2 i{color:var(--accent)}

  /* diálogo */
  .bgm{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .bgm.show{display:flex}
  .sheet{background:var(--surface);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:10px}
  .sheet h3{text-align:center;font-weight:900}
  .sheet p{text-align:center;color:var(--text2);font-weight:600}
  .sheet .two{display:flex;gap:8px}.sheet .two .btn{flex:1}
  .sheet .col{display:flex;flex-direction:column;gap:8px}
</style>

<div class="top">
  <a class="home-link" href="index.html" aria-label="Volver al inicio"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.707 2.293l9 9c.63 .63 .184 1.707 -.707 1.707h-1v6a3 3 0 0 1 -3 3h-1v-7a3 3 0 0 0 -2.824 -2.995l-.176 -.005h-2a3 3 0 0 0 -3 3v7h-1a3 3 0 0 1 -3 -3v-6h-1c-.89 0 -1.337 -1.077 -.707 -1.707l9 -9a1 1 0 0 1 1.414 0m.293 11.707a1 1 0 0 1 1 1v7h-4v-7a1 1 0 0 1 .883 -.993l.117 -.007z"/></svg></a>
  <h1>GASTOS COMPARTIDOS</h1>
</div>

<main>
  <div class="periodo">
    <select id="mes" class="sel" aria-label="Mes"></select>
    <select id="anio" class="sel anio" aria-label="Año"></select>
  </div>

  <section class="card">
    <div class="tot"><span>Total del mes</span><b class="num" id="total">$ 0</b></div>
    <div class="dos">
      <div class="per j"><small id="nJ">JULI PAGÓ</small><b class="num" id="pJ">$ 0</b><i id="cJ"></i></div>
      <div class="per a"><small id="nA">ALE PAGÓ</small><b class="num" id="pA">$ 0</b><i id="cA"></i></div>
    </div>
    <div class="barra" aria-hidden="true"><div class="j" id="bJ" style="width:50%"></div><div class="a" id="bA" style="width:50%"></div></div>
    <div class="saldo" id="saldo">Sin gastos este mes</div>
  </section>

  <button class="btn" id="bNuevo" onclick="abrirForm()" aria-expanded="false"><i class="ti ti-plus"></i> Agregar gasto</button>

  <form class="card form" id="form" hidden onsubmit="event.preventDefault();guardarGasto()">
    <div class="w"><div style="font-size:.72rem;font-weight:800;color:var(--text2);letter-spacing:.03em;margin-bottom:4px">¿QUIÉN PAGÓ?</div>
      <div class="quien" id="quienBox"><button type="button" class="j" id="qJ" onclick="setQuien('j')"></button><button type="button" class="a" id="qA" onclick="setQuien('a')"></button><button type="button" class="n" id="qN" onclick="setQuien(null)" hidden>Nadie aún</button></div></div>
    <label class="w">Descripción<input type="text" id="fDesc" placeholder="ej: Super, nafta, cena" autocomplete="off" maxlength="60"></label>
    <label>Monto<input type="text" id="fMonto" class="imp num" inputmode="numeric" placeholder="0" autocomplete="off" oninput="this.value=this.value===''?'':fmtN(parseN(this.value))"></label>
    <label>Fecha<input type="date" id="fFecha"></label>
    <div class="fijo w" onclick="toggleFijo()"><div><b>Gasto fijo</b><small>Se carga solo todos los meses; cada mes elegís quién lo pagó</small></div>
      <button type="button" class="sw" id="fFijo" role="switch" aria-checked="false" aria-label="Gasto fijo" onclick="event.stopPropagation();toggleFijo()"></button></div>
    <div class="bt"><button type="button" class="btn ghost" onclick="cerrarForm()">Cancelar</button><button type="submit" class="btn" id="fOk"><i class="ti ti-check"></i> Agregar</button></div>
  </form>

  <section class="card">
    <h2><i class="ti ti-receipt"></i> Gastos del mes</h2>
    <div class="lista" id="lista"></div>
  </section>
</main>

<div class="bgm" id="dlg" onclick="if(event.target===this)cerrarDlg()">
  <div class="sheet">
    <h3 id="dT"></h3><p id="dM"></p>
    <div class="two" id="dTwo"><button class="btn ghost" onclick="cerrarDlg()">Cancelar</button><button class="btn danger" id="dOk">Eliminar</button></div>
    <button class="btn danger" id="dTodo" style="background:#a32b2a" hidden>Eliminar en los próximos meses</button>
  </div>
</div>

<script>
/* ===== Gastos compartidos: cada uno carga lo que pagó y la app calcula cuánto tiene que poner cada uno (mitad y mitad) ===== */
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const LS='compartidos_v1';
const rd=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const parseN=v=>+String(v||'').replace(/\D/g,'')||0;
const fmtN=n=>Math.round(n).toLocaleString('es-AR');
const fmt=n=>'$ '+fmtN(n);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const hoyISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const fFecha=f=>{const [y,m,d]=f.split('-');return `${+d}/${+m}`;};

/* nombres: los mismos que en Ahorros */
const NOM=(()=>{const n=(rd('ahorros_v1',{})||{}).names||{};return {j:n.j||'Juli',a:n.a||'Ale'};})();

/* cada gasto se guarda por separado ({id: gasto}) para que si los dos cargan a la vez no se pise nada.
   Gastos fijos: S = {serie: {id, desde:'AAAA-MM', hasta:null|'AAAA-MM', saltar:{'AAAA-MM':true}}}.
   Cada mes hasta el que viene (por ejemplo, en enero se ve febrero pero no marzo) se crea solo el gasto de la serie con id "serie_AAAA-MM", copiando descripción y monto del mes anterior
   y sin quién lo pagó; así si los dos celus lo crean a la vez, es el mismo y no se duplica. */
let G=rd(LS,{})||{},S=rd(LS+'_s',{})||{};
const FOTO={j:'img/avatar-juli.webp',a:'img/avatar-ale.webp'};
const mesDe=f=>f.slice(0,7);
const mesActual=()=>hoyISO().slice(0,7);
/* el mes que viene (AAAA-MM): los fijos se precargan hasta ahí nomás, para no llenar la base de meses lejanos */
const mesSiguiente=()=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');};
function generarFijos(p){
  if(p>mesSiguiente())return;
  if(!listo&&window.getFbConfig&&window.getFbConfig())return; // espera a tener lo último de la nube, así no revive algo borrado
  Object.values(S).forEach(sr=>{
    if(!sr||sr.desde>p||(sr.hasta&&p>sr.hasta)||(sr.saltar||{})[p])return;
    const id=sr.id+'_'+p;if(G[id])return;
    // lo último que se cargó de esa serie antes de este mes (por si cambiaron el monto o la descripción)
    const prev=Object.values(G).filter(g=>g.serie===sr.id&&mesDe(g.fecha)<p).sort((x,z)=>z.fecha.localeCompare(x.fecha))[0]||sr;
    const dia=(prev.fecha||'').slice(8,10)||'01';
    const g={id,serie:sr.id,quien:null,desc:prev.desc||'',monto:+prev.monto||0,fecha:`${p}-${dia}`,creado:Date.now()};
    G[id]=g;subir(g);
  });
}
const selMes=document.getElementById('mes'),selAnio=document.getElementById('anio');
let quien=rd('compartidos_quien','j'),editando=null;

function llenarPeriodo(){
  const h=new Date(),y=h.getFullYear();
  selMes.innerHTML=MESES.map((m,i)=>`<option value="${i}">${m}</option>`).join('');
  const anios=new Set([y-1,y,y+1]);Object.values(G).forEach(g=>anios.add(+g.fecha.slice(0,4)));
  selAnio.innerHTML=[...anios].sort().map(a=>`<option value="${a}">${a}</option>`).join('');
  selMes.value=h.getMonth();selAnio.value=y;
}
const pref=()=>`${selAnio.value}-${String(+selMes.value+1).padStart(2,'0')}`;

function render(){
  const p=pref();generarFijos(p);
  const l=Object.values(G).filter(g=>g&&g.fecha&&g.fecha.startsWith(p)).sort((x,z)=>(!!x.saldado-!!z.saldado)||(!!x.quien-!!z.quien)||z.fecha.localeCompare(x.fecha)||(z.creado||0)-(x.creado||0));
  // los gastos ya divididos (saldados) no cuentan en el resumen
  const cuenta=l.filter(g=>!g.saldado),sald=l.filter(g=>g.saldado&&g.quien),tSald=sald.reduce((x,g)=>x+(+g.monto||0),0);
  const pj=cuenta.filter(g=>g.quien==='j').reduce((s,g)=>s+(+g.monto||0),0),pa=cuenta.filter(g=>g.quien==='a').reduce((s,g)=>s+(+g.monto||0),0),tot=pj+pa,mitad=tot/2;
  document.getElementById('total').textContent=fmt(tot);
  document.getElementById('nJ').textContent=NOM.j.toUpperCase()+' PAGÓ';document.getElementById('nA').textContent=NOM.a.toUpperCase()+' PAGÓ';
  document.getElementById('pJ').textContent=fmt(pj);document.getElementById('pA').textContent=fmt(pa);
  document.getElementById('cJ').textContent=tot?`Le toca ${fmt(mitad)}`:'';document.getElementById('cA').textContent=tot?`Le toca ${fmt(mitad)}`:'';
  document.getElementById('bJ').style.width=(tot?pj/tot*100:50)+'%';document.getElementById('bA').style.width=(tot?pa/tot*100:50)+'%';
  const s=document.getElementById('saldo'),dif=Math.round(pj-mitad);
  if(!tot){s.className=sald.length?'saldo ok':'saldo';s.textContent=sald.length?'¡Están a mano!':'Sin gastos este mes';}
  else if(Math.abs(dif)<1){s.className='saldo ok';s.textContent='¡Están a mano!';}
  else{s.className='saldo';const debe=dif>0?NOM.a:NOM.j,cobra=dif>0?NOM.j:NOM.a;
    s.innerHTML=`<span style="color:var(--${dif>0?'ale':'juli'})">${esc(debe)}</span> le tiene que pasar <span class="num">${fmt(Math.abs(dif))}</span> a <span style="color:var(--${dif>0?'juli':'ale'})">${esc(cobra)}</span>`;}
  const hayFijos=Object.values(S).some(sr=>sr&&sr.desde<=p&&(!sr.hasta||p<=sr.hasta));
  const lejos=p>mesSiguiente()&&hayFijos;
  const pend=l.filter(g=>!g.quien),tp=pend.reduce((x,g)=>x+(+g.monto||0),0);
  let pt=document.getElementById('pendTot');if(!pt){pt=document.createElement('div');pt.id='pendTot';pt.className='pend-tot';s.after(pt);}
  pt.innerHTML=[pend.length?`Falta asignar ${pend.length} gasto${pend.length===1?'':'s'} fijo${pend.length===1?'':'s'}: ${fmt(tp)}`:'',
    sald.length?`<span style="color:var(--pos)">✓ Ya dividido: ${fmt(tSald)} (${sald.length} gasto${sald.length===1?'':'s'})</span>`:''].filter(Boolean).join('<br>');
  document.getElementById('lista').innerHTML=l.length?l.map(g=>`<div class="it${g.quien?'':' pend'}${g.serie?' fx':''}${g.saldado?' sald':''}">
      ${g.quien?`<img class="av ${g.quien}" src="${FOTO[g.quien]}" alt="Pagó ${esc(NOM[g.quien])}">`:'<span class="q-none" aria-label="Sin pagar">?</span>'}
      <div class="tx" onclick="editar('${g.id}')"><b>${esc(g.desc)||'Sin descripción'}${g.serie?'<span class="fijo-tag"><i class="ti ti-repeat"></i> fijo</span>':''}</b>
        <small>${fFecha(g.fecha)} · ${g.quien?'pagó '+esc(NOM[g.quien]):'sin pagar'}${g.saldado?' · <span style="color:var(--pos)">ya dividido</span>':''}</small></div>
      <span class="m num">${fmt(+g.monto||0)}</span>
      ${g.quien?`<button class="chk${g.saldado?' on':''}" onclick="toggleSaldado('${g.id}')" aria-pressed="${!!g.saldado}" aria-label="${g.saldado?'Marcar como no dividido':'Marcar como ya dividido mitad y mitad'}"><i class="ti ti-check"></i></button>`:'<span class="chk-esp"></span>'}
      <button class="del" onclick="borrar('${g.id}')" aria-label="Eliminar ${esc(g.desc)}"><i class="ti ti-trash"></i></button>
    </div>`).join('')+(lejos?'<p class="vacio" style="font-size:.82rem">Los gastos fijos aparecen acá cuando falte un mes.</p>':''):(lejos?'<p class="vacio">Los gastos fijos aparecen acá cuando falte un mes.</p>':'<p class="vacio">Todavía no hay gastos en este mes</p>');
}

/* formulario */
let fijo=false;
function setQuien(q){quien=q;document.getElementById('qJ').classList.toggle('on',q==='j');document.getElementById('qA').classList.toggle('on',q==='a');document.getElementById('qN').classList.toggle('on',q===null);}
function toggleFijo(v){fijo=v===undefined?!fijo:v;const b=document.getElementById('fFijo');b.setAttribute('aria-checked',fijo);
  // en un gasto fijo se puede dejar "Nadie aún" y asignarlo después
  document.getElementById('qN').hidden=!fijo;document.getElementById('quienBox').classList.toggle('tres',fijo);
  if(!fijo&&quien===null)setQuien(rd('compartidos_quien','j'));}
/* check: ese gasto ya lo dividieron mitad y mitad, deja de contar en el resumen */
function toggleSaldado(id){const g=G[id];if(!g)return;g.saldado=!g.saldado;subir(g);render();}
function asignar(id,q){const g=G[id];if(!g)return;g.quien=q;subir(g);render();}
function abrirForm(g){
  editando=g?g.id:null;const f=document.getElementById('form');f.hidden=false;document.getElementById('bNuevo').hidden=true;
  document.getElementById('qJ').innerHTML=`<img src="${FOTO.j}" alt="">${esc(NOM.j)}`;document.getElementById('qA').innerHTML=`<img src="${FOTO.a}" alt="">${esc(NOM.a)}`;
  toggleFijo(g?!!g.serie:false);setQuien(g?(g.quien||null):rd('compartidos_quien','j'));
  document.getElementById('fDesc').value=g?g.desc:'';document.getElementById('fMonto').value=g?fmtN(+g.monto||0):'';
  // fecha: hoy si estás viendo el mes actual, si no el día 1 del mes que estás viendo
  const p=pref();document.getElementById('fFecha').value=g?g.fecha:(hoyISO().startsWith(p)?hoyISO():p+'-01');
  document.getElementById('fOk').innerHTML=g?'<i class="ti ti-check"></i> Guardar':'<i class="ti ti-check"></i> Agregar';
  document.getElementById('fDesc').focus();
}
function cerrarForm(){document.getElementById('form').hidden=true;document.getElementById('bNuevo').hidden=false;editando=null;}
function guardarGasto(){
  const monto=parseN(document.getElementById('fMonto').value),fecha=document.getElementById('fFecha').value||hoyISO();
  // se puede guardar sin monto (queda en $ 0 y se completa después)
  const ant=editando?G[editando]:null,desc=document.getElementById('fDesc').value.trim();
  let g={id:editando||uid(),quien,desc,monto,fecha,creado:ant?ant.creado:Date.now()};
  if(ant&&ant.saldado&&quien)g.saldado=true;
  if(ant&&ant.serie){
    g.serie=ant.serie;
    if(!fijo){const sr=S[ant.serie];if(sr){sr.hasta=mesDe(fecha);subirS(sr);}}   // apagaste "gasto fijo": deja de repetirse desde el mes que viene
  }else if(fijo){                                                // gasto nuevo (o que pasa a ser fijo): arranca una serie
    const sid='f'+uid(),p=mesDe(fecha);S[sid]={id:sid,desde:p,hasta:null,saltar:{}};subirS(S[sid]);
    if(ant){delete G[ant.id];bajar(ant.id);}
    g={...g,id:sid+'_'+p,serie:sid};
  }
  // si cambiaste monto o descripción de un fijo, se actualiza también en los meses siguientes que todavía no se pagaron
  if(ant&&ant.serie&&fijo&&(ant.monto!==g.monto||ant.desc!==g.desc))
    Object.values(G).filter(x=>x.serie===ant.serie&&mesDe(x.fecha)>mesDe(g.fecha)&&!x.quien).forEach(x=>{x.monto=g.monto;x.desc=g.desc;subir(x);});
  G[g.id]=g;if(quien)wr('compartidos_quien',quien);subir(g);
  // si el gasto es de otro mes, te lleva a ese mes
  selAnio.value=fecha.slice(0,4);if(selAnio.value!==fecha.slice(0,4)){llenarPeriodo();selAnio.value=fecha.slice(0,4);}selMes.value=+fecha.slice(5,7)-1;
  cerrarForm();render();
}
function editar(id){const g=G[id];if(g){abrirForm(g);window.scrollTo({top:0,behavior:'smooth'});}}
function borrar(id){const g=G[id];if(!g)return;
  document.getElementById('dT').textContent='Eliminar gasto';
  const fij=!!(g.serie&&S[g.serie]);document.getElementById('dTodo').hidden=!fij;
  document.getElementById('dM').textContent=fij?`"${g.desc||'Este gasto'}" (${fmt(+g.monto||0)}) es un gasto fijo. "Eliminar" lo saca solo de este mes.`:`¿Eliminar "${g.desc||'este gasto'}" de ${fmt(+g.monto||0)}?`;
  // gasto común: se borra. Gasto fijo: se borra de este mes y queda anotado que ese mes se saltea, para que no se vuelva a crear
  document.getElementById('dOk').onclick=()=>{cerrarDlg();
    if(fij){const sr=S[g.serie];sr.saltar={...(sr.saltar||{}),[mesDe(g.fecha)]:true};subirS(sr);}
    delete G[id];bajar(id);guardarLocal();render();};
  // próximos meses: se borra de este mes y de los siguientes, y deja de repetirse (los meses anteriores quedan como estaban)
  document.getElementById('dTodo').onclick=()=>{cerrarDlg();const sr=S[g.serie],p=mesDe(g.fecha);
    const [y,m]=p.split('-').map(Number),antes=m===1?`${y-1}-12`:`${y}-${String(m-1).padStart(2,'0')}`;
    sr.hasta=antes;subirS(sr);
    Object.values(G).filter(x=>x.serie===sr.id&&mesDe(x.fecha)>=p).forEach(x=>{delete G[x.id];bajar(x.id);});
    guardarLocal();render();};
  document.getElementById('dlg').classList.add('show');}
function cerrarDlg(){document.getElementById('dlg').classList.remove('show');}

/* ===== nube (Firebase): colección "ahorros", documento "compartidos", campo g.{id} ===== */
let db=null;
const ref=()=>db.collection('ahorros').doc('compartidos');
function aviso(t){const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#c0392b;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;z-index:999;font-size:.9rem';document.body.appendChild(d);setTimeout(()=>d.remove(),4000);}
/* Todo cambio queda anotado como "pendiente" (también en el celu) hasta que la nube confirma que lo guardó.
   Cuando llegan datos de la nube, se les aplican encima los pendientes: así un gasto recién cargado o borrado
   no desaparece ni vuelve a aparecer mientras viaja. */
let PEND=rd(LS+'_p',{g:{},s:{}})||{g:{},s:{}},listo=false,tEnv=null,enviando=false;
const guardarLocal=()=>{wr(LS,G);wr(LS+'_s',S);wr(LS+'_p',PEND);};
function subir(g){PEND.g[g.id]=JSON.parse(JSON.stringify(g));guardarLocal();programar();}
function subirS(sr){PEND.s[sr.id]=JSON.parse(JSON.stringify(sr));guardarLocal();programar();}
function bajar(id){PEND.g[id]=null;guardarLocal();programar();}
function programar(){clearTimeout(tEnv);tEnv=setTimeout(enviar,250);}
function enviar(){
  if(!db||enviando)return;const FV=firebase.firestore.FieldValue;
  const gk=Object.keys(PEND.g),sk=Object.keys(PEND.s);if(!gk.length&&!sk.length)return;
  const foto=JSON.stringify(PEND),obj={ts:FV.serverTimestamp()};
  if(gk.length){obj.g={};gk.forEach(k=>obj.g[k]=PEND.g[k]===null?FV.delete():PEND.g[k]);}
  if(sk.length){obj.s={};sk.forEach(k=>obj.s[k]=PEND.s[k]);}
  enviando=true;
  ref().set(obj,{merge:true}).then(()=>{
    const env=JSON.parse(foto);   // saca de pendientes lo que se mandó, salvo que haya cambiado mientras tanto
    gk.forEach(k=>{if(JSON.stringify(PEND.g[k])===JSON.stringify(env.g[k]))delete PEND.g[k];});
    sk.forEach(k=>{if(JSON.stringify(PEND.s[k])===JSON.stringify(env.s[k]))delete PEND.s[k];});
    wr(LS+'_p',PEND);enviando=false;if(Object.keys(PEND.g).length||Object.keys(PEND.s).length)programar();
  }).catch(e=>{enviando=false;console.warn(e);aviso('No se pudo guardar en la nube. Revisá la conexión.');setTimeout(programar,5000);});
}
function aplicar(doc){
  const d=doc.exists?(doc.data()||{}):{};
  const g={...(d.g||{})},sr={...(d.s||{})};
  Object.entries(PEND.g).forEach(([k,v])=>{if(v===null)delete g[k];else g[k]=v;});
  Object.entries(PEND.s).forEach(([k,v])=>{sr[k]=v;});
  if(!doc.exists&&!listo){Object.values(G).forEach(subir);Object.values(S).forEach(subirS);}   // primera vez: sube lo que haya en este celu
  else{G=g;S=sr;}
  listo=true;guardarLocal();
  const a=document.activeElement;if(!(a&&a.tagName==='INPUT'))render();
}
function loadScript(src){return new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
async function initFb(){const c=window.getFbConfig&&window.getFbConfig();if(!c)return;
  try{if(typeof firebase==='undefined'){await loadScript('https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js');await loadScript('https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js');}
    if(!firebase.apps.length)firebase.initializeApp(c);db=firebase.firestore();
    ref().onSnapshot(d=>{if(d.metadata.hasPendingWrites)return;aplicar(d);},e=>console.warn(e));
    programar();   // lo que haya quedado pendiente de otra vez (por ejemplo, sin internet)
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')ref().get({source:'server'}).then(aplicar).catch(()=>{});});
  }catch(e){}}

llenarPeriodo();
selMes.addEventListener('change',()=>{cerrarForm();render();});selAnio.addEventListener('change',()=>{cerrarForm();render();});
render();initFb();
</script>
