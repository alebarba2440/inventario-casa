name: Diagnostico dominio
on:
  push:
    branches: [diag-dominio]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://juntosapp.com.ar/juntos/app/img/logo-texto.png https://juntosapp.com.ar/icon.png https://juntosapp.com.ar/app/comun.css https://juntosapp.com.ar/app/inventario.html https://juntosapp.com.ar/juntos/entrar.html; do
            echo "=== $u"; curl -s -I -m 20 "$u" | grep -iE "^(HTTP|server|content-type|location)" ; done
