name: Diagnostico dominio
on:
  push:
    branches: [diag-dominio]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y -qq lftp >/dev/null 2>&1
          lftp -u "$U","$P" "$S" -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no; set ftp:passive-mode true; set cmd:fail-exit no; echo --- APP; cls -1a public_html/app/; echo --- APPHT; cat public_html/app/.htaccess; echo --- APIHT; cat public_html/api/.htaccess; echo --- IMGHT; cat public_html/img/.htaccess; echo --- FIN; bye" 2>&1
