# Sube la carpeta juntos/ al hosting de DonWeb (barbamanger.website/juntos) cada vez que cambia algo ahí.
# Los datos del FTP están guardados en GitHub › Settings › Secrets (FTP_SERVER, FTP_USERNAME, FTP_PASSWORD).
name: Subir JuntOS a DonWeb
on:
  push:
    branches: [main]
    paths: ['juntos/**', '.github/workflows/subir-donweb.yml']
  workflow_dispatch:   # también se puede lanzar a mano desde la pestaña Actions
jobs:
  ftp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Copiar archivos por FTPS (conexión cifrada, la que exige DonWeb)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set net:max-retries 2;
            set net:timeout 30;
            mkdir -p public_html/juntos;
            mirror -R --verbose --exclude-glob .git* ./juntos/ public_html/juntos/;
            bye"
