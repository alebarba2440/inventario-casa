# Arma JuntOS (juntos/armar.py: login + las mismas secciones de siempre conectadas a la base de DonWeb)
# y lo sube a public_html/juntos (= juntosapp.com.ar) en cada cambio.
# La configuración de la base se arma con los secretos DB_* y se guarda FUERA de public_html (no accesible desde la web).
# Los datos del FTP están guardados en GitHub › Settings › Secrets (FTP_SERVER, FTP_USERNAME, FTP_PASSWORD).
name: Subir JuntOS a DonWeb
on:
  push:
    branches: [main]
  workflow_dispatch:   # también se puede lanzar a mano desde la pestaña Actions
jobs:
  ftp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Armar la configuración de la base (con los secretos DB_*, nunca queda en el código)
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        run: |
          mkdir -p /tmp/cfg
          php -r 'echo "<?php\nreturn " . var_export(["host"=>getenv("DB_HOST"),"name"=>getenv("DB_NAME"),"user"=>getenv("DB_USER"),"pass"=>getenv("DB_PASS"),"admins"=>getenv("ADMIN_EMAILS")], true) . ";\n";' > /tmp/cfg/juntos-config.php
          php -l /tmp/cfg/juntos-config.php
          [ -n "$DB_HOST" ] && [ -n "$DB_NAME" ] && [ -n "$DB_USER" ] && [ -n "$DB_PASS" ] && echo "Secretos DB: los 4 cargados"; [ -n "$ADMIN_EMAILS" ] && echo "Admins: cargado" || echo "::warning::ADMIN_EMAILS vacío: nadie puede entrar al panel" || { echo "::error::Falta algún secreto DB_*"; exit 1; }
      - name: Armar JuntOS (login + secciones con la base de DonWeb)
        run: python3 juntos/armar.py /tmp/deploy
      - name: Copiar archivos por FTPS (conexión cifrada, la que exige DonWeb)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          [ -n "$FTP_SERVER" ] && [ -n "$FTP_USERNAME" ] && [ -n "$FTP_PASSWORD" ] || { echo "::error::Faltan secretos FTP_* (FTP_SERVER / FTP_USERNAME / FTP_PASSWORD)"; exit 1; }
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set net:max-retries 2;
            set net:timeout 30;
            mkdir -p public_html/juntos;
            mirror -R --verbose --exclude-glob .git* /tmp/deploy/ public_html/juntos/;
            put /tmp/cfg/juntos-config.php -o juntos-config.php;
            rm -f public_html/juntos/api/prueba.php;
            rm -f public_html/juntos/app/importar.html;
            bye"
      - name: Regla en public_html/.htaccess para que juntosapp.com.ar abra JuntOS en la raíz
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          L="set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no; set ftp:passive-mode true; set net:max-retries 2; set net:timeout 30;"
          mkdir -p /tmp/ht && cd /tmp/ht
          # Si ya hay un .htaccess lo bajo y lo conservo; si la descarga falla, no toco nada.
          if lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "$L cls -1a public_html/; bye" | grep -qx '.htaccess'; then
            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "$L get public_html/.htaccess -o actual; bye" || { echo "::error::No pude bajar public_html/.htaccess"; exit 1; }
          else
            : > actual
          fi
          python3 "$GITHUB_WORKSPACE/juntos/htaccess_raiz.py" actual nuevo
          if cmp -s actual nuevo; then echo "public_html/.htaccess sin cambios"; exit 0; fi
          cp actual "respaldo-$(date +%Y%m%d%H%M%S)"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "$L put actual -o htaccess-respaldo-raiz; put nuevo -o public_html/.htaccess; bye"
          echo "public_html/.htaccess actualizado (copia del anterior: htaccess-respaldo-raiz, fuera de public_html)"

