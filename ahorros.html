<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>Ahorros</title>

<script src="firebase-config.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--accent:#1D9E75;--accent-dark:#0F6E56;--accent-light:#E1F5EE;--pos:#1D9E75;--neg:#E24B4A;--bg:#f5f5f0;--surface:#fff;--surface2:#f5f5f0;--border:rgba(0,0,0,.1);--border2:rgba(0,0,0,.18);--text:#1a1a1a;--text2:#666;--r:12px;--juli:#DB2777;--juli-l:#FCE7F3;--ale:#0284C7;--ale-l:#E0F2FE}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--surface:#1c1c1e;--surface2:#2c2c2e;--border:rgba(255,255,255,.1);--border2:rgba(255,255,255,.2);--text:#f5f5f5;--text2:#aaa;--juli:#F472B6;--juli-l:rgba(244,114,182,.16);--ale:#38BDF8;--ale-l:rgba(56,189,248,.16)}}
  :root[data-theme="dark"]{--bg:#111;--surface:#1c1c1e;--surface2:#2c2c2e;--border:rgba(255,255,255,.1);--border2:rgba(255,255,255,.2);--text:#f5f5f5;--text2:#aaa;--juli:#F472B6;--juli-l:rgba(244,114,182,.16);--ale:#38BDF8;--ale-l:rgba(56,189,248,.16)}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh}
  .top{background:var(--surface);border-bottom:3px solid var(--accent);padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
  .top h1{font-size:1.1rem;color:var(--accent);font-weight:800;letter-spacing:.05em}
  .sync{font-size:.7rem;color:var(--text2);display:flex;align-items:center;gap:5px}
  .dot{width:8px;height:8px;border-radius:50%;background:#aaa}.dot.on{background:var(--pos)}.dot.err{background:var(--neg)}
  main{max-width:520px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:12px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 30px)}
  .card{background:var(--surface);border:.5px solid var(--border);border-radius:16px;padding:14px}
  .card h2{font-size:.95rem;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
  table{width:100%;border-collapse:collapse;font-size:.88rem}
  th{font-size:.75rem;color:var(--text2);font-weight:600;text-align:right;padding:4px 4px 8px}
  th:first-child,td:first-child{text-align:left}
  th.pn{cursor:pointer;color:var(--accent-dark)}
  td{padding:4px;border-top:.5px solid var(--border);text-align:right;font-variant-numeric:tabular-nums}
  td.lab{font-weight:600;white-space:nowrap}
  td.lab .del{background:none;border:none;color:var(--text2);margin-left:4px;font-size:.9rem;cursor:pointer}
  td.cell{cursor:pointer}
  td.cell span{display:inline-block;min-width:64px;padding:7px 8px;border-radius:8px;background:var(--surface2);border:.5px solid var(--border2)}
  .pos{color:var(--pos)}.neg{color:var(--neg)}.zero{color:var(--text2)}
  tr.tot td{border-top:2px solid var(--border2);font-weight:700;padding-top:8px}
  .neto{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:12px;border-radius:var(--r);background:var(--accent-light);color:var(--accent-dark);font-weight:700}
  .neto b{font-size:1.2rem}
  .addm{display:flex;gap:8px;margin-top:12px}
  input[type=text],input[type=number]{background:var(--surface2);border:.5px solid var(--border2);border-radius:var(--r);padding:11px 12px;font-size:1rem;font-family:inherit;color:var(--text);width:100%;outline:none}
  td input[type=number]{padding:7px 8px;font-size:.88rem;text-align:right;min-width:78px}
  input:focus{border-color:var(--accent)}
  .btn{border:none;border-radius:var(--r);padding:12px 16px;font-family:inherit;font-size:.95rem;font-weight:600;cursor:pointer;color:#fff;background:var(--accent);white-space:nowrap}
  .btn.add{background:var(--pos);flex:1}.btn.rem{background:var(--neg);flex:1}.btn.ghost{background:var(--surface2);color:var(--text);border:.5px solid var(--border2)}
  .bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .bg.show{display:flex}
  .sheet{background:var(--surface);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:10px;max-height:88dvh;overflow-y:auto}
  .sheet h3{font-size:1.05rem}
  .row{display:flex;gap:8px}
  .mov{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:.5px solid var(--border);font-size:.9rem}
  .mov .n{flex:1;color:var(--text2);font-size:.8rem}
  .mov button{background:none;border:none;color:var(--text2);font-size:1rem;cursor:pointer}
  .hint{font-size:.78rem;color:var(--text2)}
  .delmes{background:none;border:none;color:var(--text2);font-family:inherit;font-size:.8rem;cursor:pointer;margin:10px auto 0;display:flex;align-items:center;gap:4px}
  .restore-x{width:100%;background:none;border:1px dashed var(--border2);color:var(--text2);border-radius:var(--r);padding:9px;font-family:inherit;font-size:.82rem;font-weight:700;cursor:pointer;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:6px}
  .er{padding:8px 2px;border-top:.5px solid var(--border)}
  .er:first-child{border-top:none;padding-top:2px}
  .er1{display:flex;align-items:center;gap:8px}
  .er1 b{flex:1;font-size:.92rem;font-weight:800;letter-spacing:.03em}
  .er1 .et{font-weight:800;font-variant-numeric:tabular-nums;font-size:.95rem}
  .er2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:6px}
  .er2 label{display:flex;flex-direction:column;gap:3px;font-size:.72rem;font-weight:800}
  .er2 label.pj{color:var(--juli)} .er2 label.pa{color:var(--ale)}
  .er2 input{width:100%;min-width:0;border-radius:10px;padding:9px 10px;font-size:.95rem;font-weight:800;text-align:right;font-variant-numeric:tabular-nums;border:1px solid transparent;outline:none;color:var(--text)}
  .er2 label.pj input{background:var(--juli-l)} .er2 label.pa input{background:var(--ale-l)}
  .er2 input:focus{border-color:var(--accent)}
  .xe{background:none;border:none;color:var(--text2);font-size:1rem;cursor:pointer;width:26px;height:30px;display:flex;align-items:center;justify-content:center;padding:0}
  .addest{width:100%;margin-top:10px;border:1.5px dashed var(--accent);background:none;color:var(--accent);border-radius:var(--r);padding:11px;font-family:inherit;font-weight:800;font-size:.92rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
  .aesel{flex:1;font-family:inherit;font-size:1rem;font-weight:800;color:var(--text);background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r);padding:11px 12px}
  .wipe{display:none !important;margin:8px auto 0;background:none;border:1px dashed var(--neg);color:var(--neg);border-radius:12px;padding:10px 14px;font-family:inherit;font-size:.85rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}

  /* acordeones */
  .acc{background:var(--surface);border:.5px solid var(--border);border-radius:16px;overflow:hidden}
  .acc-h{width:100%;display:flex;align-items:center;gap:8px;padding:15px 14px;background:none;border:none;font-family:inherit;color:var(--text);font-size:1rem;font-weight:700;cursor:pointer;text-align:left}
  .acc-h i.ic{color:var(--accent);font-size:1.2rem}
  .acc-h .sum{margin-left:auto;font-size:.9rem;font-weight:800}
  .yhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 2px 0}
  .yhead h2{font-size:1.35rem;font-weight:800;letter-spacing:.05em}
  .year{font-family:inherit;font-size:.92rem;font-weight:800;color:var(--accent-dark);background:var(--accent-light);border:1px solid var(--accent);border-radius:999px;padding:4px 10px;cursor:pointer;outline:none}
  .year:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .acc-h .chev{color:var(--text2);transition:transform .2s;font-size:1.1rem}
  .acc.open .acc-h .chev{transform:rotate(180deg)}
  .acc-b{display:none;padding:0 14px 14px}
  .acc.open .acc-b{display:block}
  /* meses */
  .mes{border:.5px solid var(--border2);border-radius:14px;margin-bottom:10px;background:var(--surface);overflow:hidden}
  .mes-h{width:100%;display:flex;align-items:center;gap:10px;padding:12px;background:none;border:none;font-family:inherit;color:var(--text);cursor:pointer;text-align:left}
  .mes-h .nm{font-weight:700;font-size:1rem;letter-spacing:.04em;text-transform:uppercase;flex:1;min-width:0}
  .mes-h .rs{display:flex;flex-direction:row;align-items:center;gap:10px;font-size:.8rem;font-variant-numeric:tabular-nums;white-space:nowrap}
  .mes-h .rs span{font-weight:600} .mes-h .rs b{font-weight:800;margin-left:3px}
  .mes-h{gap:8px !important;padding:12px 10px 12px 12px !important}
  .mes-h .nm{font-size:.84rem !important;letter-spacing:0 !important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mes.open .mes-h .nm{letter-spacing:.04em !important}
  .mes-h .chev{font-size:.9rem !important}
  .mes.open .mes-h .nm{font-size:1rem !important}
  .mes-h .rs{font-size:.72rem !important;gap:6px !important}
  .mes-h .rs b{margin-left:2px !important}
  .mes-h .rs{gap:12px !important;font-size:.82rem !important}
  .mes-h .rs .pj b{color:var(--juli)} .mes-h .rs .pa b{color:var(--ale)} .mes-h .rs b.neg{color:var(--neg) !important}
  @media (max-width:380px){main{padding:10px}.acc-b{padding:0 8px 12px}.mes-h .nm{font-size:.8rem !important}.mes-h .rs{font-size:.68rem !important}}
  /* tabla de estimado: que entre en el celu */
  #accEst table.est{table-layout:fixed;font-size:.8rem}
  #accEst th:nth-child(1){width:27%} #accEst th:nth-child(2),#accEst th:nth-child(3){width:24%} #accEst th:nth-child(4){width:17%} #accEst th:nth-child(5){width:8%}
  #accEst td.lab{white-space:normal;font-size:.76rem;line-height:1.2}
  #accEst td input[type=number]{min-width:0;width:100%;padding:7px 6px;font-size:.82rem}
  #accEst td:last-child{white-space:nowrap;font-size:.76rem}
  .mes-h .chev{color:var(--text2);transition:transform .2s;font-size:1rem}
  .mes.open .mes-h{border-bottom:.5px solid var(--border)}
  .mes.open .mes-h .nm{text-align:center}
  .mes.open .mes-h .rs{display:none}
  .mes.open .mes-h .chev{transform:rotate(180deg)}
  .mes-b{display:none;padding:12px}
  .anio{border:1px solid var(--accent);border-radius:16px;margin-bottom:10px;overflow:hidden;background:var(--surface)}
  .anio-h{width:100%;display:flex;align-items:center;gap:8px;padding:14px 12px;background:var(--accent-light);border:none;font-family:inherit;color:var(--text);cursor:pointer;text-align:left}
  .anio-h .nm{font-weight:800;font-size:1.1rem;color:var(--accent-dark);flex:1}
  .anio-h .rs{display:flex;gap:8px;font-size:.74rem;white-space:nowrap;font-weight:600} .anio-h .rs b{font-weight:800;margin-left:2px}
  .anio-h .chev{color:var(--accent-dark);transition:transform .2s}
  .anio.open .anio-h .chev{transform:rotate(180deg)}
  .anio-b{display:none;padding:10px 8px 2px}
  .anio.open .anio-b{display:block}
  .anio-est .anio-b{padding:6px 8px 8px}
  .mes.open .mes-b{display:block}
  .mes-act{display:flex;justify-content:center;gap:18px;margin-top:10px}
  .mes-act button{background:none;border:none;color:var(--text2);font-family:inherit;font-size:.8rem;cursor:pointer;display:flex;align-items:center;gap:4px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .col{display:flex;flex-direction:column;gap:6px;min-width:0}
  .col .who{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;text-align:center;cursor:pointer}
  .col .amt{text-align:center;font-weight:800;font-size:1.05rem;font-variant-numeric:tabular-nums;padding:6px 4px;border-radius:10px;cursor:pointer}
  .col.pj .amt{background:var(--juli-l)} .col.pa .amt{background:var(--ale-l)}
  .col .amt small{display:block;font-size:.66rem;font-weight:500;color:var(--text2)}
  .inrow{display:flex;gap:4px}
  .inrow input{padding:8px 8px !important;font-size:.9rem !important;min-width:0;flex:1}
  .pm{width:34px;flex-shrink:0;border:none;border-radius:10px;color:#fff;font-size:1.05rem;font-weight:700;cursor:pointer;font-family:inherit}
  .pm.p{background:var(--pos)}.pm.m{background:var(--neg)}
  .mes-t{display:flex;justify-content:space-between;margin-top:10px;padding-top:8px;border-top:.5px dashed var(--border2);font-size:.88rem;font-weight:600}
  .mes-t b{font-weight:800}
  .tots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
  .tots div{border-radius:var(--r);padding:10px;text-align:center;font-size:.78rem;font-weight:700}
  .tots div.pj{background:var(--juli-l);color:var(--juli)} .tots div.pa{background:var(--ale-l);color:var(--ale)}
  .tots b{display:block;font-size:1.1rem;font-weight:800;margin-top:2px}
  .pj{color:var(--juli)} .pa{color:var(--ale)} .pj.neg,.pa.neg,b.neg{color:var(--neg)}
  th.pj{color:var(--juli)} th.pa{color:var(--ale)}
  td{font-weight:700} td input[type=number]{font-weight:700} .neto b{font-weight:800}

  /* ===== PC: Ahorrado y Estimado uno al lado del otro, los dos abiertos ===== */
  @media (min-width:900px){
    main{max-width:1180px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start;padding:22px}
    .acc .acc-b{display:block !important}
    .acc .acc-h{cursor:default;pointer-events:none}
    .acc .acc-h .chev{display:none}
    .wipe{grid-column:1/-1}
  }
</style>

<body>
<div class="top">
  <a class="home-link" href="index.html" aria-label="Volver al inicio"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.707 2.293l9 9c.63 .63 .184 1.707 -.707 1.707h-1v6a3 3 0 0 1 -3 3h-1v-7a3 3 0 0 0 -2.824 -2.995l-.176 -.005h-2a3 3 0 0 0 -3 3v7h-1a3 3 0 0 1 -3 -3v-6h-1c-.89 0 -1.337 -1.077 -.707 -1.707l9 -9a1 1 0 0 1 1.414 0m.293 11.707a1 1 0 0 1 1 1v7h-4v-7a1 1 0 0 1 .883 -.993l.117 -.007z"/></svg></a>
  <div class="tcenter"><h1>AHORROS</h1><select id="yearSel" class="year" onchange="setYear(this.value)" aria-label="Año"></select></div>
  <div class="sync"><div class="dot" id="dot"></div><span id="syncT">Solo local</span></div>
</div>
<main>
  <section class="acc open" id="accReal">
    <button class="acc-h" onclick="openAcc('accReal')" aria-expanded="true">
      <i class="ti ti-pig-money ic"></i> Ahorrado <span class="sum" id="sumReal"></span><i class="ti ti-chevron-down chev"></i>
    </button>
    <div class="acc-b">
      <div id="listReal"></div>
      <button class="addest" onclick="abrirAdd('aho')"><i class="ti ti-calendar-plus"></i> Agregar mes</button>
      <div class="tots"><div class="pj"><span id="totJN"></span><b id="tJ"></b></div><div class="pa"><span id="totAN"></span><b id="tA"></b></div></div>
      <div class="neto"><span id="netoL">TOTAL:</span><b id="neto">$ 0</b></div>
    </div>
  </section>

  <section class="acc" id="accEst">
    <button class="acc-h" onclick="openAcc('accEst')" aria-expanded="false">
      <i class="ti ti-target-arrow ic"></i> Estimado <span class="sum" id="sumEst"></span><i class="ti ti-chevron-down chev"></i>
    </button>
    <div class="acc-b">
      <div id="estList"></div>
      <div class="neto" style="background:var(--surface2);color:var(--text)"><span>Estimado total</span><b id="estTot">$ 0</b></div>
      <div class="neto" style="margin-top:6px;background:var(--surface2);color:var(--text)"><span>Real − estimado</span><b id="dif">$ 0</b></div>
    </div>
  </section>
  <button class="wipe" onclick="borrarTodo()"><i class="ti ti-trash"></i> Borrar todos los datos de Ahorros</button>
</main>

<div class="bg" id="addEst" onclick="if(event.target===this)this.classList.remove('show')">
  <div class="sheet">
    <h3 id="aeT">Agregar mes</h3>
    <div class="row"><select id="aeMes" class="aesel"></select><select id="aeAnio" class="aesel"></select></div>
    <p class="hint" id="aeErr" style="color:var(--neg)"></p>
    <div class="row"><button class="btn ghost" style="flex:1" onclick="document.getElementById('addEst').classList.remove('show')">Cancelar</button><button class="btn" style="flex:1" onclick="confirmarAddEst()">Agregar</button></div>
  </div>
</div>
<div class="bg" id="bg" onclick="if(event.target===this)closeSheet()">
  <div class="sheet">
    <h3 id="shT"></h3>
    <div id="shTot" style="font-weight:700"></div>
    <input type="text" inputmode="numeric" id="shAmt" placeholder="Monto" oninput="miles(this)">
    <input type="text" id="shNote" placeholder="Nota (opcional)">
    <div class="row"><button class="btn add" onclick="addMov(1)"><i class="ti ti-plus"></i> Agregó</button><button class="btn rem" onclick="addMov(-1)"><i class="ti ti-minus"></i> Sacó</button></div>
    <div id="shList"></div>
    <button class="btn ghost" onclick="closeSheet()">Cerrar</button>
  </div>
</div>

<script>
/* ---------- tema compartido con el inventario ---------- */
const CFG=(()=>{try{return JSON.parse(localStorage.getItem('cfg_v2')||'{}')}catch(e){return{}}})();
(()=>{const r=document.documentElement;if(CFG.accent){r.style.setProperty('--accent',CFG.accent);if(CFG.accentD)r.style.setProperty('--accent-dark',CFG.accentD);if(CFG.accentL)r.style.setProperty('--accent-light',CFG.accentL);}
r.setAttribute('data-theme',CFG.theme==='dark'?'dark':'light');})();

/* ---------- datos ---------- */
const LS='ahorros_v1';
const uid=()=>Math.random().toString(36).slice(2,9);
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
let state;
try{state=JSON.parse(localStorage.getItem(LS))}catch(e){}
if(!state||!Array.isArray(state.months))state={names:{j:'Juli',a:'Ale'},months:[]};
const emptyMonth=label=>({id:uid(),label,mov:{j:[],a:[]},est:{j:0,a:0}});
const sum=a=>a.reduce((x,y)=>x+(+y||0),0);
const cellTot=(m,p)=>sum(m.mov[p].map(x=>x.amt));
const fmt=n=>(n<0?'-':'')+'$ '+Math.abs(Math.round(n)).toLocaleString('es-AR');
/* formato corto para el resumen del mes cerrado: $ 1,25 M */
const fmtS=n=>Math.abs(n)>=1e6?(n<0?'-':'')+'$ '+(Math.abs(n)/1e6).toLocaleString('es-AR',{maximumFractionDigits:2})+' M':fmt(n);
/* punto de miles mientras se escribe: 1250000 -> 1.250.000 */
const fmtN=n=>Math.round(+n||0).toLocaleString('es-AR');
const numDe=t=>{const c=String(t??'').replace(/\./g,'').replace(',','.').trim();return c===''?0:(parseFloat(c)||0);};
function miles(el){const c=el.value.replace(/\./g,'');
  if(/^\d+$/.test(c)){const f=(+c).toLocaleString('es-AR');if(el.value!==f)el.value=f;return +c;}
  return numDe(el.value);}
const cls=n=>n>0?'pos':n<0?'neg':'zero';
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

/* ---------- render ---------- */
function openAcc(id){ // abre uno y cierra el otro
  document.querySelectorAll('.acc').forEach(el=>{const o=el.id===id&&!el.classList.contains('open');el.classList.toggle('open',o);el.querySelector('.acc-h').setAttribute('aria-expanded',o)});
}
function colHTML(m,p){
  const t=cellTot(m,p),n=m.mov[p].length;
  const pc=p==='j'?'pj':'pa';
  return `<div class="col ${pc}">
    <div class="who ${pc}" onclick="renameP('${p}')">${esc(state.names[p])}</div>
    <div class="amt ${pc} ${t<0?'neg':''}" onclick="openSheet('${m.id}','${p}')">${fmt(t)}<small>${n?n+' mov.':'sin movimientos'}</small></div>
    <div class="inrow"><input type="text" inputmode="numeric" placeholder="$" oninput="miles(this)" id="in_${m.id}_${p}" onkeydown="if(event.key==='Enter')quick('${m.id}','${p}',1)">
      <button class="pm p" onclick="quick('${m.id}','${p}',1)" aria-label="Puse">+</button><button class="pm m" onclick="quick('${m.id}','${p}',-1)" aria-label="Saqué">−</button></div>
  </div>`;
}
/* orden por mes: "OCTUBRE 2026" va antes que "NOVIEMBRE 2026". Si un nombre no es un mes, queda al final. */
function monthKey(m,i){
  const x=String(m.label).match(/^(\p{L}+)\s*(\d{4})?/u);
  if(x){const k=MESES.findIndex(n=>n.toLowerCase()===x[1].toLowerCase());
    if(k>=0)return (x[2]?+x[2]:new Date().getFullYear())*12+k;}
  return 1e9+i;
}
const yearOf=(m,i)=>{const k=monthKey(m,i);return k<1e9?Math.floor(k/12):null;};
let selYear='all'; // 'all' = todos los años
/* años que se muestran: desde el primero con datos hasta el año actual */
const tieneMov=m=>m.mov&&((m.mov.j||[]).length||(m.mov.a||[]).length);
const enEst=m=>m.enEst||(m.est&&(+m.est.j||+m.est.a));
/* meses agregados en Estimado (pueden ser de años futuros, ej. 2027) */
function estMonths(){return state.months.map((m,i)=>[monthKey(m,i),m]).filter(([k,m])=>k<1e9&&enEst(m))
  .sort((a,b)=>a[0]-b[0]).map(([k,m])=>{m.label=MESES[k%12].toUpperCase()+' '+Math.floor(k/12);return m;})
  .filter(m=>selYear==='all'||Math.floor(monthKey(m,0)/12)===selYear);}
function yearsEst(){return [...new Set(state.months.filter(enEst).map((m,i)=>yearOf(m,0)).filter(y=>y!==null))];}
const enAho=m=>m.enAho||tieneMov(m); // mes agregado a mano en Ahorrado o con movimientos
function years(){return [...new Set(state.months.filter(enAhorrado).map(m=>yearOf(m,0)).filter(y=>y!==null))].sort((a,b)=>a-b);}
function setYear(y){selYear=y==='all'?'all':+y;openMes=undefined;openYear=undefined;openYearEst=undefined;render();}
/* todos los meses del rango, ordenados. Los que todavía no tienen datos son "virtuales" hasta que se cargue algo */
/* meses de Ahorrado: solo los que agregan ustedes (o los que ya tienen movimientos), ordenados */
const enAhorrado=m=>!m.oculto&&enAho(m);
function allMonths(){
  return state.months.map((m,i)=>[monthKey(m,i),m]).filter(([k,m])=>k<1e9&&enAhorrado(m))
    .sort((a,b)=>a[0]-b[0]).map(([k,m])=>{m.label=MESES[k%12].toUpperCase()+' '+Math.floor(k/12);return m;});
}
function monthsOfYear(){if(selYear!=='all'&&!years().includes(selYear))return [];return allMonths().filter((m)=>{if(selYear==='all')return true;const x=String(m.label).match(/(\d{4})/);return x&&+x[1]===selYear;});}
function getM(id){return state.months.find(x=>x.id===id)||allMonths().find(x=>x.id===id);}
function realM(id){ // si el mes es virtual, lo guarda de verdad
  let m=state.months.find(x=>x.id===id);if(m)return m;
  m=allMonths().find(x=>x.id===id);delete m.virtual;state.months.push(m);return m;
}
function sortedMonths(){return state.months.map((m,i)=>[monthKey(m,i),i,m]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]).map(x=>x[2]);}
let openMes; // mes abierto (uno a la vez)
let openYear; // año abierto en "Todos" (uno a la vez)
let openYearEst; // año abierto en Estimado
function toggleYearEst(g){openYearEst=openYearEst===g?null:g;
  document.querySelectorAll('.anio-est').forEach(el=>{const o=el.id==='anioE_'+openYearEst;el.classList.toggle('open',o);el.querySelector('.anio-h').setAttribute('aria-expanded',o)});}
function toggleYear(g){openYear=openYear===g?null:g;
  document.querySelectorAll('.anio').forEach(el=>{const o=el.id==='anio_'+openYear;el.classList.toggle('open',o);el.querySelector('.anio-h').setAttribute('aria-expanded',o)});}
function toggleMes(id){openMes=openMes===id?null:id;
  document.querySelectorAll('.mes').forEach(el=>{const o=el.id==='mes_'+openMes;el.classList.toggle('open',o);el.querySelector('.mes-h').setAttribute('aria-expanded',o)});}
function render(){
  const ys=[...new Set([...years(),...yearsEst()])].sort((a,b)=>a-b),hoyY=new Date().getFullYear();
  if(selYear!=='all'&&!ys.includes(selYear))selYear='all';
  const sel=document.getElementById('yearSel');
  sel.innerHTML=`<option value="all"${selYear==='all'?' selected':''}>Todos</option>`+ys.map(y=>`<option value="${y}"${y===selYear?' selected':''}>${y}</option>`).join('');
  const yl=selYear==='all'?'':' '+selYear;
  document.getElementById('totJN').textContent='Total '+state.names.j+yl;
  document.getElementById('totAN').textContent='Total '+state.names.a+yl;
  const ms=monthsOfYear();
  let irA=null;
  if(openMes===undefined){ // al entrar o al cambiar de año: abierto el mes actual (o el primero del año)
    const d=new Date(),hoy=d.getFullYear()*12+d.getMonth();
    const act=ms.find(m=>monthKey(m,0)===hoy);openMes=act?act.id:(ms.length?ms[0].id:null);irA=openMes;}
  const mesHTML=m=>{
    const j=cellTot(m,'j'),a=cellTot(m,'a'),t=j+a,op=m.id===openMes;
    return `<div class="mes${op?' open':''}" id="mes_${m.id}">
      <button class="mes-h" onclick="toggleMes('${m.id}')" aria-expanded="${op}">
        <span class="nm">${esc(m.label)}</span>
        ${resumen(j,a,true)}
        <i class="ti ti-chevron-down chev"></i>
      </button>
      <div class="mes-b">
        <div class="cols">${colHTML(m,'j')}${colHTML(m,'a')}</div>
        <div class="mes-t"><span>Total del mes</span><b class="${cls(t)}">${fmt(t)}</b></div>
        <button class="delmes" onclick="borrarMes('${m.id}')"><i class="ti ti-trash"></i> Borrar mes</button>
      </div>
    </div>`};
  // con nombres (año) o solo los montos con su color (mes)
  const resumen=(j,a,sinNombres)=>`<span class="rs"><span class="pj">${sinNombres?'':esc(state.names.j)+':'}<b class="${j<0?'neg':''}">${fmtS(j)}</b></span><span class="pa">${sinNombres?'':esc(state.names.a)+':'}<b class="${a<0?'neg':''}">${fmtS(a)}</b></span></span>`;
  let html;
  if(selYear==='all'){ // un acordeón por año, con sus meses adentro
    const grupos=[];ms.forEach(m=>{const x=String(m.label).match(/(\d{4})/),g=x?x[1]:'Otros';let G=grupos.find(z=>z.g===g);if(!G){G={g,ms:[]};grupos.push(G);}G.ms.push(m);});
    if(openYear===undefined){const om=ms.find(m=>m.id===openMes),x=om&&String(om.label).match(/(\d{4})/);openYear=x?x[1]:(grupos[0]&&grupos[0].g);}
    html=grupos.map(G=>{const j=sum(G.ms.map(m=>cellTot(m,'j'))),a=sum(G.ms.map(m=>cellTot(m,'a'))),op=G.g===openYear;
      return `<div class="anio${op?' open':''}" id="anio_${G.g}">
        <button class="anio-h" onclick="toggleYear('${G.g}')" aria-expanded="${op}"><span class="nm">${G.g}</span>${resumen(j,a)}<i class="ti ti-chevron-down chev"></i></button>
        <div class="anio-b">${G.ms.map(mesHTML).join('')}</div></div>`}).join('');
  } else html=ms.map(mesHTML).join('');
  document.getElementById('listReal').innerHTML=html||`<p class="hint" style="text-align:center;padding:14px 0">Todavía no hay meses${selYear==='all'?'':' en '+selYear}. Tocá <b>Agregar mes</b>.</p>`;
  /* estimado: meses agregados a mano, separados por año (un acordeón por año) */
  const tabla=list=>list.map(m=>`<div class="er">
      <div class="er1"><b>${esc(m.label.replace(/ \d{4}$/,''))}</b><span class="et" id="et_${m.id}"></span>
        <button class="xe" onclick="quitarEst('${m.id}')" aria-label="Quitar mes"><i class="ti ti-trash"></i></button></div>
      <div class="er2">
        <label class="pj"><span>${esc(state.names.j)}</span><input type="text" inputmode="numeric" value="${m.est.j?fmtN(m.est.j):''}" placeholder="0" oninput="setEst('${m.id}','j',this)"></label>
        <label class="pa"><span>${esc(state.names.a)}</span><input type="text" inputmode="numeric" value="${m.est.a?fmtN(m.est.a):''}" placeholder="0" oninput="setEst('${m.id}','a',this)"></label>
      </div></div>`).join('');
  const ems=estMonths(),grupos=[];
  ems.forEach(m=>{const g=String(Math.floor(monthKey(m,0)/12));let G=grupos.find(z=>z.g===g);if(!G){G={g,ms:[]};grupos.push(G);}G.ms.push(m);});
  if(openYearEst===undefined)openYearEst=grupos.some(G=>G.g===String(hoyY))?String(hoyY):(grupos[0]&&grupos[0].g);
  let est=grupos.map(G=>{const op=G.g===openYearEst;
      return `<div class="anio anio-est${op?' open':''}" id="anioE_${G.g}">
        <button class="anio-h" onclick="toggleYearEst('${G.g}')" aria-expanded="${op}"><span class="nm">${G.g}</span><span class="rs" id="eyr_${G.g}"></span><i class="ti ti-chevron-down chev"></i></button>
        <div class="anio-b">${tabla(G.ms)}</div></div>`}).join('');
  if(!grupos.length)est=`<p class="hint" style="text-align:center;padding:10px 0">Todavía no hay meses estimados${selYear==='all'?'':' en '+selYear}.</p>`;
  est+=`<button class="addest" onclick="abrirAdd('est')"><i class="ti ti-calendar-plus"></i> Agregar mes</button>`;
  document.getElementById('estList').innerHTML=est;
  document.getElementById('netoL').textContent=selYear==='all'?'TOTAL:':'TOTAL '+selYear+':';
  recalc();
  if(irA){const el=document.getElementById('mes_'+irA);if(el)requestAnimationFrame(()=>el.scrollIntoView({block:'center'}));}
}
/* carga rápida desde el mes: + puse / − saqué */
function quick(id,p,sign){
  const el=document.getElementById('in_'+id+'_'+p),v=numDe(el.value);
  if(!v||v<=0){el.focus();return;}
  const m=realM(id),d=new Date();
  m.mov[p].push({id:uid(),amt:sign*v,note:'',d:d.getDate()+'/'+(d.getMonth()+1)});
  save();render();
}
function colorize(el,n,text){el.textContent=text;el.className=cls(n)}
function recalc(){
  const ms=monthsOfYear();
  const tj=sum(ms.map(m=>cellTot(m,'j'))),ta=sum(ms.map(m=>cellTot(m,'a')));
  const set=(id,n)=>{const e=document.getElementById(id);if(e){e.textContent=fmt(n);e.className=cls(n)}};
  {const a=document.getElementById('tJ'),b=document.getElementById('tA');a.textContent=fmt(tj);a.className=tj<0?'neg':'';b.textContent=fmt(ta);b.className=ta<0?'neg':'';}
  set('neto',tj+ta);{const e=document.getElementById('sumReal');e.textContent=fmt(tj+ta);e.className='sum '+cls(tj+ta);}
  let est=0;const ems=estMonths();
  ems.forEach(m=>{const t=(+m.est.j||0)+(+m.est.a||0);est+=t;const e=document.getElementById('et_'+m.id);if(e)e.textContent=fmt(t)});
  document.querySelectorAll('[id^="eyr_"]').forEach(e=>{const g=e.id.slice(4),gm=ems.filter(m=>String(m.label).includes(g));
    const j=sum(gm.map(m=>+m.est.j||0)),a=sum(gm.map(m=>+m.est.a||0));
    e.innerHTML=`<span class="pj">${esc(state.names.j)}:<b>${fmtS(j)}</b></span><span class="pa">${esc(state.names.a)}:<b>${fmtS(a)}</b></span>`;});
  document.getElementById('estTot').textContent=fmt(est);
  document.getElementById('sumEst').textContent=fmt(est);
  set('dif',tj+ta-est);
}
function setEst(id,p,el){const m=realM(id);m.est[p]=miles(el);m.enEst=true;save();recalc()}
/* quitar un mes de Estimado (si no tiene ahorro cargado, se borra del todo) */
function quitarEst(id){
  const m=state.months.find(x=>x.id===id);if(!m)return;
  if(!confirm('¿Quitar '+m.label+' de Estimado?'))return;
  m.est={j:0,a:0};m.enEst=false;
  if(!tieneMov(m))state.months=state.months.filter(x=>x.id!==id);
  save();render();
}
/* agregar un mes a Estimado */
let modoAdd='est';
function abrirAdd(modo){
  modoAdd=modo;const hoy=new Date(),y0=hoy.getFullYear();
  const lista=modo==='est'?state.months.filter(enEst).map(m=>monthKey(m,0)):allMonths().map(m=>monthKey(m,0));
  lista.sort((a,b)=>a-b);
  let k=modo==='est'?(lista.length?lista[lista.length-1]+1:y0*12+hoy.getMonth())
       :(lista.length?lista[lista.length-1]+1:y0*12+hoy.getMonth());
  document.getElementById('aeT').textContent=modo==='est'?'Agregar mes a Estimado':'Agregar mes a Ahorrado';
  document.getElementById('aeMes').innerHTML=MESES.map((n,i)=>`<option value="${i}"${i===k%12?' selected':''}>${n}</option>`).join('');
  document.getElementById('aeAnio').innerHTML=[y0-1,y0,y0+1,y0+2,y0+3].map(y=>`<option${y===Math.floor(k/12)?' selected':''}>${y}</option>`).join('');
  document.getElementById('aeErr').textContent='';
  document.getElementById('addEst').classList.add('show');
}
function confirmarAddEst(){
  const k=+document.getElementById('aeMes').value,y=+document.getElementById('aeAnio').value,key=y*12+k,err=document.getElementById('aeErr');
  let m=state.months.find((x,i)=>monthKey(x,i)===key);
  if(modoAdd==='est'){
    if(m&&enEst(m)){err.textContent=MESES[k]+' '+y+' ya está en Estimado.';return;}
    if(!m){m={id:uid(),label:MESES[k].toUpperCase()+' '+y,mov:{j:[],a:[]},est:{j:0,a:0}};state.months.push(m);}
    m.enEst=true;openYearEst=String(y);
  }else{
    if(allMonths().some(x=>monthKey(x,0)===key)){err.textContent=MESES[k]+' '+y+' ya existe en Ahorrado.';return;}
    if(!m){m={id:uid(),label:MESES[k].toUpperCase()+' '+y,mov:{j:[],a:[]},est:{j:0,a:0}};state.months.push(m);}
    delete m.oculto;m.enAho=true;
    if(selYear!=='all'&&selYear!==y)selYear='all';
    openYear=String(y);openMes=m.id;
  }
  document.getElementById('addEst').classList.remove('show');save();render();
  if(modoAdd==='est'){const r=document.getElementById('et_'+m.id);if(r){const inp=r.closest('.er').querySelector('input');if(inp){inp.scrollIntoView({block:'center'});inp.focus();}}}
  else{const el=document.getElementById('mes_'+m.id);if(el)el.scrollIntoView({block:'center'});}
}

/* ---------- meses ---------- */
/* borra todo (para ambos, porque se sincroniza) y antes baja una copia de respaldo */
function borrarTodo(){
  const t=prompt('Esto borra TODOS los movimientos y estimados de Ahorros, para los dos.\nAntes se descarga una copia de respaldo.\n\nEscribí BORRAR para confirmar:');
  if(!t||t.trim().toUpperCase()!=='BORRAR')return;
  try{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='ahorros-respaldo-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();}catch(e){}
  state={names:state.names||{j:'Juli',a:'Ale'},months:[]};openMes=undefined;openYear=undefined;
  save();render();
}
/* borrar un mes de Ahorrado (por ejemplo, un mes en el que no ahorraron) */
function borrarMes(id){
  const m=getM(id);if(!m)return;
  const n=(m.mov.j||[]).length+(m.mov.a||[]).length;
  if(!confirm(n?`${m.label} tiene ${n} movimiento(s). ¿Borrarlo igual? Se pierden esos movimientos.`:`¿Borrar ${m.label} de Ahorrado?`))return;
  const r=realM(id);r.mov={j:[],a:[]};delete r.enAho;delete r.oculto;if(!enEst(r))state.months=state.months.filter(x=>x!==r);openMes=null;save();render();
}
function renameP(p){const n=prompt('Nombre de la columna',state.names[p]);if(n&&n.trim()){state.names[p]=n.trim();save();render();}}

/* ---------- movimientos ---------- */
let cur=null;
function openSheet(id,p){cur={id,p};document.getElementById('shAmt').value='';document.getElementById('shNote').value='';drawSheet();document.getElementById('bg').classList.add('show');}
function closeSheet(){document.getElementById('bg').classList.remove('show');cur=null;}
function drawSheet(){
  const m=getM(cur.id),t=cellTot(m,cur.p);
  {const h=document.getElementById('shT');h.textContent=m.label+' · '+state.names[cur.p];h.className=cur.p==='j'?'pj':'pa';}
  const e=document.getElementById('shTot');e.textContent='Total: '+fmt(t);e.className=cls(t);
  document.getElementById('shList').innerHTML=m.mov[cur.p].slice().reverse().map(x=>`<div class="mov">
    <b class="${x.amt>=0?'pos':'neg'}">${x.amt>=0?'+':'−'} ${fmt(Math.abs(x.amt)).replace('-','')}</b>
    <span class="n">${esc(x.note||'')} ${x.d?'· '+x.d:''}</span>
    <button onclick="delMov('${x.id}')" aria-label="Borrar"><i class="ti ti-trash"></i></button></div>`).join('');
}
function addMov(sign){
  const v=numDe(document.getElementById('shAmt').value);
  if(!v||v<=0){document.getElementById('shAmt').focus();return;}
  const m=realM(cur.id),d=new Date();
  m.mov[cur.p].push({id:uid(),amt:sign*v,note:document.getElementById('shNote').value.trim(),d:d.getDate()+'/'+(d.getMonth()+1)});
  document.getElementById('shAmt').value='';document.getElementById('shNote').value='';
  save();drawSheet();render();
}
function delMov(id){const m=getM(cur.id);m.mov[cur.p]=m.mov[cur.p].filter(x=>x.id!==id);save();drawSheet();render();}

/* ---------- guardado + Firebase (misma config que el inventario) ---------- */
let db=null,timer=null;
function setSync(k,t){document.getElementById('dot').className='dot '+k;document.getElementById('syncT').textContent=t;}
function save(){
  localStorage.setItem(LS,JSON.stringify(state));
  if(!db)return;
  clearTimeout(timer);setSync('','Guardando…');
  timer=setTimeout(push,600);
}
function push(){
  db.collection('ahorros').doc('data').set({json:JSON.stringify(state),ts:firebase.firestore.FieldValue.serverTimestamp()})
    .then(()=>setSync('on','Sincronizado')).catch(e=>setSync('err','Error: '+(e.code||e.message)));
}
function startSync(){
  db.collection('ahorros').doc('data').onSnapshot(doc=>{
    if(doc.metadata.hasPendingWrites)return;
    if(doc.exists){
      try{const s=JSON.parse(doc.data().json);if(s&&Array.isArray(s.months)){state=s;localStorage.setItem(LS,JSON.stringify(state));
        if(!(document.activeElement&&document.activeElement.tagName==='INPUT'))render();if(cur)drawSheet();}}catch(e){}
      setSync('on','Sincronizado');
    }else push();
  },e=>setSync('err',e.code==='permission-denied'?'Sin permiso (reglas)':'Error: '+e.code));
}
function loadScript(src){return new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=ko;document.head.appendChild(s);});}
async function initFb(){
  const c=window.getFbConfig&&window.getFbConfig();
  if(!c){setSync('','Solo local');return;}
  try{
    if(typeof firebase==='undefined'){
      await loadScript('https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js');
      await loadScript('https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js');
    }
    if(!firebase.apps.length)firebase.initializeApp(c);
    db=firebase.firestore();startSync();
  }catch(e){setSync('err','No conectó');}
}
render();initFb();
</script>
