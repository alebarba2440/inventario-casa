<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Inventario">
<link rel="apple-touch-icon" href="img/apple-touch.png?v=6">
<link rel="icon" type="image/png" href="img/icono.png?v=6">
<title>Inventario - Escáner Automático</title>
<script src="tema.js"></script>
<script src="firebase-config.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --accent: #1D9E75;
    --accent-dark: #0F6E56;
    --accent-light: #E1F5EE;
    --danger: #E24B4A;
    --danger-dark: #C0392B;
    --warn: #D97706;
    --warn-dark: #92400E;
    --warn-light: #FEF3C7;
    --bg: #f5f5f0;
    --surface: #ffffff;
    --surface2: #f5f5f0;
    --border: rgba(0,0,0,0.1);
    --border2: rgba(0,0,0,0.18);
    --text: #1a1a1a;
    --text2: #666;
    --radius: 12px;
    --radius-lg: 16px;
    --base-font-size: 100%;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111;
      --surface: #1c1c1e;
      --surface2: #2c2c2e;
      --border: rgba(255,255,255,0.1);
      --border2: rgba(255,255,255,0.2);
      --text: #f5f5f5;
      --text2: #aaa;
      --warn-light: rgba(217,119,6,0.28);
    }
  }
  :root[data-theme="dark"] {
    --bg: #111;
    --surface: #1c1c1e;
    --surface2: #2c2c2e;
    --border: rgba(255,255,255,0.1);
    --border2: rgba(255,255,255,0.2);
    --text: #f5f5f5;
    --text2: #aaa;
    --warn-light: rgba(217,119,6,0.28);
  }
  :root[data-theme="light"] {
    --bg: #f5f5f0;
    --surface: #ffffff;
    --surface2: #f5f5f0;
    --border: rgba(0,0,0,0.1);
    --border2: rgba(0,0,0,0.18);
    --text: #1a1a1a;
    --text2: #666;
    --warn-light: #FEF3C7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: 'DM Sans', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    font-size: var(--base-font-size);
  }
  .bg-watermark {
    position: fixed;
    bottom: 80px;
    left: 49%;
    transform: translateX(-50%);
    width: 480px;
    opacity: 0.08;
    pointer-events: none;
    z-index: -1;
  }
  .app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 430px;
    margin: 0 auto;
    background: transparent; /* deja ver el fondo con los personajes (fondo.css) */
    position: relative;
    z-index: 1;
  }
  .top-header {
    background: var(--surface);
    border-bottom: 3px solid var(--accent);
    padding-top: env(safe-area-inset-top, 0px);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-bottom: 14px;
    padding-top: calc(env(safe-area-inset-top, 0px) + 14px);
  }
  .top-header-title {
    font-size: 1.0625rem;
    font-weight: 700;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 8px;
    letter-spacing: 0.2px;
  }
  .top-header-title i { font-size: 1.375rem; }
  .content {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  .panel { display: none; flex-direction: column; gap: 0.75rem; }
  .panel.active { display: flex; }
  .card {
    background: var(--surface);
    border-radius: var(--radius-lg);
    border: 0.5px solid var(--border);
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
  .action-btn {
    padding: 0.875rem 0.625rem;
    border-radius: var(--radius);
    border: 1.5px solid var(--border);
    background: var(--surface2);
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 0.875rem;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.4375rem;
    color: var(--text2);
    transition: all 0.15s;
  }
  .action-btn i { font-size: 1.125rem; }
  .action-btn.sel-add { border-color: var(--accent); background: var(--accent-light); color: var(--accent-dark); }
  .action-btn.sel-rem { border-color: var(--danger); background: #FCEBEB; color: var(--danger); }
  .input-label {
    font-size: 0.75rem;
    color: var(--text2);
    font-weight: 500;
    margin-bottom: 4px;
    letter-spacing: 0.3px;
  }
  input[type="text"], input[type="number"], select {
    background: var(--surface2);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius);
    padding: 0.75rem 0.875rem;
    font-size: 1rem;
    font-family: 'DM Sans', system-ui, sans-serif;
    color: var(--text);
    width: 100%;
    outline: none;
    appearance: none;
    -webkit-appearance: none;
  }
  select { cursor: pointer; }
  input[type="number"] { -moz-appearance: textfield; }
  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(29,158,117,0.12); }
  .submit-btn {
    width: 100%;
    padding: 0.9375rem;
    border-radius: var(--radius);
    border: none;
    background: var(--accent);
    color: white;
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    transition: all 0.15s;
  }
  .submit-btn:active { transform: scale(0.98); opacity: 0.9; }
  .submit-btn.danger { background: var(--danger); }
  .submit-btn i { font-size: 1.25rem; }
  .search-wrap {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--surface);
    border-radius: var(--radius);
    border: 0.5px solid var(--border);
    padding: 0.6875rem 0.875rem;
  }
  .search-wrap i { color: var(--text2); font-size: 1.25rem; flex-shrink: 0; }
  .search-wrap input {
    border: none;
    background: transparent;
    font-size: 1rem;
    flex: 1;
    outline: none;
    box-shadow: none;
    padding: 0;
    width: 100%;
  }
  .filter-select-wrap {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1.5px solid var(--accent);
    padding: 4px 4px 4px 12px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.07);
  }
  .filter-select-wrap .filter-label {
    font-size: 0.6875rem;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.4px;
    text-transform: uppercase;
    padding-top: 4px;
  }
  .filter-select-wrap select {
    border: none;
    background: transparent;
    padding: 0.375rem 0.75rem 0.5rem 0;
    font-weight: 500;
    color: var(--text);
    text-align: center;
    font-weight: 600;
  }
  .filter-select-wrap select:focus {
    outline: none;
    box-shadow: none;
    border-color: transparent;
  }
  .inv-list { display: flex; flex-direction: column; gap: 0.5rem; }
  .inv-item {
    background: var(--surface);
    border-radius: var(--radius);
    border: 0.5px solid var(--border);
    padding: 0.625rem 0.875rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    width: 100%;
    transition: border-color 0.2s, background 0.2s;
  }
  /* Poca cantidad - naranja (claro: sólido cálido) */
  .inv-item.low-stock {
    border-color: #F5C97A;
    background: #FEF3C7;
  }
  .inv-item.low-stock .item-name { color: #92400E; }
  .item-quantity.low { background: #FDE68A; color: #92400E; }
  /* dark naranja: sólido visible sobre fondo oscuro */
  :root[data-theme="dark"] .inv-item.low-stock { border-color: #A16207; background: #3D2E10; }
  :root[data-theme="dark"] .inv-item.low-stock .item-name { color: #FBB040; }
  :root[data-theme="dark"] .item-quantity.low { background: #5A3E0E; color: #FBB040; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .inv-item.low-stock { border-color: #A16207; background: #3D2E10; }
    :root:not([data-theme="light"]) .inv-item.low-stock .item-name { color: #FBB040; }
    :root:not([data-theme="light"]) .item-quantity.low { background: #5A3E0E; color: #FBB040; }
  }
  /* Sin stock - rojo (claro: sólido suave) */
  .inv-item.zero-stock {
    border-color: #F5A0A0;
    background: #FEECEC;
  }
  .inv-item.zero-stock .item-name { color: #9B1C1C; }
  .inv-item.zero-stock .item-quantity { background: #FCA5A5; color: #9B1C1C; }
  /* dark rojo: sólido visible sobre fondo oscuro */
  :root[data-theme="dark"] .inv-item.zero-stock { border-color: #9B1C1C; background: #3D1212; }
  :root[data-theme="dark"] .inv-item.zero-stock .item-name { color: #F07070; }
  :root[data-theme="dark"] .inv-item.zero-stock .item-quantity { background: #5A1A1A; color: #F07070; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .inv-item.zero-stock { border-color: #9B1C1C; background: #3D1212; }
    :root:not([data-theme="light"]) .inv-item.zero-stock .item-name { color: #F07070; }
    :root:not([data-theme="light"]) .inv-item.zero-stock .item-quantity { background: #5A1A1A; color: #F07070; }
  }
  .item-name {
    font-size: 1rem;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    min-width: 0;
  }
  .right-group { display: flex; align-items: center; gap: 0.75rem; flex-shrink: 0; }
  .item-quantity {
    font-size: 1.25rem;
    font-weight: 800;
    color: var(--accent);
    background: var(--accent-light);
    padding: 2px 12px;
    border-radius: 24px;
    display: inline-block;
    line-height: 1.3;
    white-space: nowrap;
    min-width: 50px;
    text-align: center;
  }
  .item-quantity.zero { background: #FCEBEB; color: var(--danger); }
  .action-buttons { display: flex; gap: 0.5rem; align-items: center; flex-shrink: 0; }
  .edit-btn, .del-btn {
    background: transparent;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.1s, opacity 0.15s;
    font-size: 1.375rem;
    padding: 6px;
    margin: -6px;
  }
  .edit-btn { color: var(--accent); }
  .edit-btn:active { transform: scale(0.92); opacity: 0.7; }
  .del-btn { color: var(--danger); }
  .del-btn:active { transform: scale(0.92); opacity: 0.7; }
  .empty { text-align: center; padding: 3.75rem 1.25rem; color: var(--text2); }
  .empty i { font-size: 3.25rem; display: block; margin-bottom: 12px; opacity: 0.2; }
  .empty p { font-size: 0.9375rem; }
  .nav-bar {
    display: flex;
    background: var(--surface);
    border-top: 0.5px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom, 8px);
    padding-top: 6px;
    flex-shrink: 0;
    position: relative;
    overflow: visible;
  }
  .nav-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    background: none;
    border: none;
    cursor: pointer;
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 0.8125rem;
    font-weight: 500;
    color: var(--text2);
    padding: 6px 0 4px;
    transition: color 0.15s;
  }
  .nav-btn i { font-size: 1.625rem; }
  .nav-btn.active { color: var(--accent); }
  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(16px);
    background: #1a1a1a;
    color: white;
    padding: 0.6875rem 1.375rem;
    border-radius: 24px;
    font-size: 0.875rem;
    font-weight: 500;
    font-family: 'DM Sans', system-ui, sans-serif;
    z-index: 999;
    opacity: 0;
    transition: all 0.25s;
    white-space: nowrap;
    pointer-events: none;
    max-width: 90vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 100;
    display: flex;
    align-items: flex-end;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal-sheet {
    background: var(--surface);
    border-radius: 22px 22px 0 0;
    padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px));
    width: 100%;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.32,0.72,0,1);
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-height: 88vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .modal-overlay.open .modal-sheet { transform: translateY(0); }
  .modal-handle { width: 40px; height: 4px; background: var(--border2); border-radius: 2px; margin: 0 auto 4px; }
  .modal-title { font-size: 1.125rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }
  .color-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .swatch {
    width: 38px; height: 38px;
    border-radius: 50%;
    cursor: pointer;
    border: 3px solid transparent;
    transition: all 0.15s;
    outline: none;
  }
  .swatch.sel { border-color: var(--text); transform: scale(1.15); }
  textarea {
    background: var(--surface2);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius);
    padding: 0.6875rem;
    font-size: 0.75rem;
    font-family: monospace;
    color: var(--text);
    width: 100%;
    height: 80px;
    resize: none;
    outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  .close-btn {
    width: 100%;
    padding: 0.875rem;
    border-radius: var(--radius);
    border: 0.5px solid var(--border2);
    background: var(--surface2);
    color: var(--text);
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 0.9375rem;
    font-weight: 500;
    cursor: pointer;
  }
  .close-btn:active { opacity: 0.7; }
  .category-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 0.5px solid var(--border);
  }
  .category-name { font-size: 0.9375rem; font-weight: 500; color: var(--text); }
  .category-actions { display: flex; gap: 8px; }
  .cat-edit, .cat-delete {
    background: none;
    border: none;
    font-size: 1.125rem;
    cursor: pointer;
    padding: 6px;
    border-radius: 8px;
  }
  .cat-edit { color: var(--accent); }
  .cat-delete { color: var(--danger); }
  .add-cat-row { display: flex; gap: 8px; margin-top: 8px; }
  .add-cat-row input { flex: 1; }
  .small-btn {
    padding: 0 1rem;
    border-radius: var(--radius);
    background: var(--accent);
    color: white;
    border: none;
    font-weight: 600;
    cursor: pointer;
  }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border2); flex-shrink: 0; }
  .sync-dot.on { background: var(--accent); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .autocomplete-wrap { position: relative; }
  .autocomplete-suggestion {
    position: absolute;
    left: 0; right: 0; top: 100%;
    margin-top: 4px;
    background: var(--surface);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius);
    padding: 0.6875rem 0.875rem;
    font-size: 0.9375rem;
    font-weight: 500;
    color: var(--text2);
    cursor: pointer;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 16px rgba(0,0,0,0.10);
  }
  .autocomplete-suggestion .sugg-name { color: var(--text); }
  .confirm-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    padding: 20px;
  }
  .confirm-overlay.open { opacity: 1; pointer-events: all; }
  .confirm-sheet {
    background: var(--surface);
    border-radius: 20px;
    padding: 24px 20px 20px;
    width: 100%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    transform: scale(0.92) translateY(10px);
    transition: transform 0.25s cubic-bezier(0.32,0.72,0,1);
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }
  .confirm-overlay.open .confirm-sheet { transform: scale(1) translateY(0); }
  .confirm-icon {
    width: 52px; height: 52px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto;
    font-size: 26px;
  }
  .confirm-icon.add { background: var(--accent-light); color: var(--accent-dark); }
  .confirm-icon.rem { background: #FCEBEB; color: var(--danger); }
  .confirm-icon.del { background: #FCEBEB; color: var(--danger); }
  .confirm-title { font-size: 1.125rem; font-weight: 700; color: var(--text); text-align: center; }
  .confirm-body { font-size: 0.875rem; color: var(--text2); text-align: center; line-height: 1.5; }
  .confirm-actions { display: flex; flex-direction: column; gap: 8px; }
  .confirm-ok {
    width: 100%;
    padding: 0.875rem;
    border-radius: var(--radius);
    border: none;
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .confirm-ok:active { transform: scale(0.98); opacity: 0.9; }
  .confirm-ok.add { background: var(--accent); color: white; }
  .confirm-ok.rem { background: var(--danger); color: white; }
  .confirm-ok.del { background: var(--danger); color: white; }
  .confirm-cancel {
    width: 100%;
    padding: 0.8125rem;
    border-radius: var(--radius);
    border: 0.5px solid var(--border2);
    background: var(--surface2);
    color: var(--text2);
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 0.9375rem;
    font-weight: 500;
    cursor: pointer;
  }
  .alerts-section {
    background: var(--surface);
    border-radius: var(--radius-lg);
    border: 0.5px solid var(--border);
    overflow: hidden;
  }
  .alerts-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 16px;
    cursor: pointer;
    user-select: none;
  }
  .alerts-header-left { display: flex; align-items: center; gap: 8px; font-size: 0.875rem; font-weight: 600; color: var(--text); }
  .alerts-header-left i { font-size: 1.125rem; color: var(--accent); }
  .alerts-badge {
    background: var(--danger);
    color: white;
    font-size: 0.6875rem;
    font-weight: 700;
    border-radius: 20px;
    padding: 1px 7px;
    min-width: 20px;
    text-align: center;
  }
  .alerts-badge.none { background: var(--accent); }
  .alerts-badge.warn { background: var(--warn); }
  .alerts-chevron { font-size: 1.125rem; color: var(--text2); transition: transform 0.2s; }
  .alerts-section.open .alerts-chevron { transform: rotate(180deg); }
  .alerts-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s cubic-bezier(0.4,0,0.2,1);
    border-top: 0px solid var(--border);
  }
  .alerts-section.open .alerts-body { max-height: 500px; border-top-width: 0.5px; }
  .scrollable-body {
    max-height: 180px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .scrollable-body::-webkit-scrollbar { display: none; }
  .scrollable-wrap { position: relative; display: flex; gap: 6px; align-items: center; }
  .scrollable-wrap .scrollable-body { flex: 1; }

<script>
  let inv = JSON.parse(localStorage.getItem('inv_v2') || '[]');
  let cfg = JSON.parse(localStorage.getItem('cfg_v2') || '{"accent":"#1D9E75","accentD":"#0F6E56","accentL":"#E1F5EE","fontSize":1}');
  let categories = JSON.parse(localStorage.getItem('categories_v2') || '["Alimentos", "Limpieza", "Bebidas"]');
  let action = 'add';
  let db = null, fbOn = false;
  let html5QrCode = null;
  let scannerActive = false;
  let editId = null;
  let editQtyTemp = 0;
  let currentFilter = 'Todas';
  let categoriesUnsubscribe = null;
  let invUnsubscribe = null;
  const FB_INV = 'inv';
  const FB_CAT = 'categorias';

  /* ============================================================
     FONT SIZE
  ============================================================ */
  function applyFontSize(val) {
    const scale = parseFloat(val);
    if (isNaN(scale)) return;
    cfg.fontSize = scale;
    localStorage.setItem('cfg_v2', JSON.stringify(cfg));
    document.documentElement.style.setProperty('--base-font-size', (scale * 100) + '%');
    document.documentElement.style.fontSize = (scale * 100) + '%';
    const slider = document.getElementById('fontSizeSlider');
    if (slider && slider.value != scale) slider.value = scale;
  }
  function initFontSizeSlider() {
    const slider = document.getElementById('fontSizeSlider');
    if (!slider && cfg.fontSize) document.documentElement.style.fontSize = (cfg.fontSize * 100) + '%';
    if (slider) {
      const currentSize = cfg.fontSize || 1;
      slider.value = currentSize;
      slider.addEventListener('input', e => applyFontSize(e.target.value));
      slider.addEventListener('change', e => applyFontSize(e.target.value));
      document.documentElement.style.setProperty('--base-font-size', (currentSize * 100) + '%');
      document.documentElement.style.fontSize = (currentSize * 100) + '%';
    }
  }

  /* ============================================================
     ACCENT / THEME
  ============================================================ */
  function applyAccent() {
    if (!cfg.accent) return; // sin color elegido: queda el verde por defecto
    document.documentElement.style.setProperty('--accent', cfg.accent);
    document.documentElement.style.setProperty('--accent-dark', cfg.accentD);
    document.documentElement.style.setProperty('--accent-light', cfg.accentL);
  }
  function setTheme(mode) {
    cfg.theme = mode;
    localStorage.setItem('cfg_v2', JSON.stringify(cfg));
    if (mode === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', mode);
    updateThemeBtns();
  }
  function updateThemeBtns() {
    const mode = cfg.theme || 'auto';
    document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
    const map = { light: 'themeBtnLight', dark: 'themeBtnDark', auto: 'themeBtnAuto' };
    const el = document.getElementById(map[mode]);
    if (el) el.classList.add('active');
  }

  /* ============================================================
     CATEGORIES
  ============================================================ */
  async function saveCategories(newCategories, skipFirebase = false) {
    categories = [...newCategories];
    localStorage.setItem('categories_v2', JSON.stringify(categories));
    updateFilterSelect(); updateCategorySelects(); renderCategoriesList(); render();
    if (!skipFirebase && db && fbOn) {
      try { await db.collection(FB_CAT).doc('lista').set({ items: categories }); } catch(e) {}
    }
  }
  async function addCategory() {
    const input = document.getElementById('newCatName');
    const name = input.value.trim();
    if (!name) return;
    if (categories.includes(name)) { toast('Categoría ya existe'); return; }
    await saveCategories([...categories, name]);
    input.value = '';
    toast('Categoría agregada');
  }
  async function editCategory(oldName, newName) {
    if (!newName.trim() || categories.includes(newName.trim())) return;
    const index = categories.indexOf(oldName);
    if (index === -1) return;
    const newCategories = [...categories];
    newCategories[index] = newName.trim();
    await saveCategories(newCategories);
    inv.forEach(p => { if (p.category === oldName) p.category = newName.trim(); });
    await upsertAllProducts(); render();
  }
  async function deleteCategory(cat) {
    if (categories.length <= 1) { toast('Debe haber al menos una categoría'); return; }
    pendingDelCat = cat;
    const affected = inv.filter(p => p.category === cat).length;
    document.getElementById('dTitle').textContent = 'Eliminar categoría';
    document.getElementById('dBody').innerHTML = '¿Eliminar <strong>' + escapeHtml(cat) + '</strong>?' +
      (affected > 0 ? '<br><span style="font-size:12px;">(' + affected + ' producto' + (affected > 1 ? 's' : '') + ' se moverá' + (affected > 1 ? 'n' : '') + ' a "' + escapeHtml(categories.filter(c => c !== cat)[0]) + '")</span>' : '');
    document.getElementById('deleteModal').classList.add('open');
  }
  function renderCategoriesList() {
    const container = document.getElementById('categoriesList');
    if (!container) return;
    container.innerHTML = [...categories].sort((a,b) => a.localeCompare(b,'es'))
      .map(cat => `<div class="category-item"><span class="category-name">${escapeHtml(cat)}</span><div class="category-actions"><button class="cat-edit" onclick="promptEditCategory('${escapeHtml(cat)}')"><i class="ti ti-edit"></i></button><button class="cat-delete" onclick="deleteCategory('${escapeHtml(cat)}')"><i class="ti ti-trash"></i></button></div></div>`).join('');
  }
  function promptEditCategory(oldName) {
    const newName = prompt('Editar categoría:', oldName);
    if (newName && newName.trim() && newName.trim() !== oldName) editCategory(oldName, newName.trim());
  }
  function updateCategorySelects() {
    const select = document.getElementById('editCategorySelect');
    if (select) select.innerHTML = [...categories].sort((a,b) => a.localeCompare(b,'es')).map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
  }
  function updateFilterSelect() {
    const select = document.getElementById('categoryFilterSelect');
    if (!select) return;
    select.innerHTML = '<option value="Todas">Todas las categorías</option>' +
      [...categories].sort((a,b) => a.localeCompare(b,'es')).map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
    select.value = currentFilter;
  }
  function setFilter(f) { currentFilter = f; updateFilterSelect(); render(); }

  /* ============================================================
     FIREBASE — OPTIMISTIC UI
     Guardamos localmente primero, cerramos modal/mostramos toast
     y luego sincronizamos Firebase en background sin bloquear.
  ============================================================ */
  function syncProductBackground(item) {
    if (!db || !fbOn) return;
    db.collection(FB_INV).doc(item.id).set({
      n: item.n,
      q: item.q,
      barcode: item.barcode || null,
      category: item.category || categories[0],
      lowStock: item.lowStock || false,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    }).catch(() => {}); // silencioso, no bloquea
  }
  function deleteProductBackground(id) {
    if (!db || !fbOn) return;
    db.collection(FB_INV).doc(id).delete().catch(() => {});
  }
  async function upsertAllProducts() {
    // solo se usa en operaciones de categorías; puede seguir siendo async
    if (!db || !fbOn) return;
    try {
      const batch = db.batch();
      inv.forEach(item => {
        batch.set(db.collection(FB_INV).doc(item.id), {
          n: item.n, q: item.q,
          barcode: item.barcode || null,
          category: item.category || categories[0],
          lowStock: item.lowStock || false,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
      });
      await batch.commit();
    } catch(e) { toast('Error al sincronizar'); }
  }

  // save: guarda local inmediatamente, sync Firebase en background
  function save(changedItem = null) {
    localStorage.setItem('inv_v2', JSON.stringify(inv));
    if (changedItem) syncProductBackground(changedItem);
    render();
    updateAlerts();
  }

  function exportDataInline() {
    const blob = new Blob([JSON.stringify(inv, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'inventario.json';
    a.click();
    toast('📥 Exportado');
  }

     NAVIGATION

    document.getElementById('panelInventario').classList.toggle('active', !isC);

    document.getElementById('navI').classList.toggle('active', t === 'inventario');
  }
  function setAction(a) {
    action = a;
    document.getElementById('btnAdd').className = 'action-btn' + (a === 'add' ? ' sel-add' : '');
    document.getElementById('btnRem').className = 'action-btn' + (a === 'remove' ? ' sel-rem' : '');
    document.getElementById('submitBtn').className = 'submit-btn' + (a === 'remove' ? ' danger' : '');

  /* ============================================================
     AUTOCOMPLETE
  ============================================================ */
  function onNameInput() {
    const val = document.getElementById('prodName').value;
    const box = document.getElementById('suggBox');
    if (!val.trim()) { box.style.display = 'none'; return; }
    const match = inv.find(i => i.n.toLowerCase().startsWith(val.toLowerCase()) && i.n.toLowerCase() !== val.toLowerCase());
    if (match) { document.getElementById('suggText').textContent = match.n; box.style.display = 'flex'; }
    else box.style.display = 'none';
  }
  function onNameKey(e) {
    if (e.key === 'Enter') { e.preventDefault(); document.getElementById('prodQty').focus(); document.getElementById('prodQty').select(); }
    if (e.key === 'Escape') hideSugg();
  }
  function acceptSugg() {
    const s = document.getElementById('suggText').innerText;
    if (s) document.getElementById('prodName').value = s;
    hideSugg();
  }
  function hideSugg() { setTimeout(() => { document.getElementById('suggBox').style.display = 'none'; }, 120); }

  /* ============================================================
     BARCODE
  ============================================================ */
  function processBarcode(code) {
    if (!code) return;
    document.getElementById('barcodeInput').value = code;
    const found = inv.find(item => item.barcode === code);
    if (found) {
      document.getElementById('prodName').value = found.n;
      toast(`📦 ${found.n} (Stock: ${found.q})`);
      setTimeout(() => { document.getElementById('prodQty').focus(); document.getElementById('prodQty').select(); }, 100);
    } else {
      document.getElementById('prodName').value = '';
      document.getElementById('prodName').focus();
      toast('🔍 Producto nuevo');
    }
  }
  function onBarcodeManual() {
    const code = document.getElementById('barcodeInput').value.trim();
    if (code) processBarcode(code);
  }

  /* ============================================================
     SCANNER
  ============================================================ */
  async function abrirScanner() {
    document.getElementById('scannerModal').classList.add('open');
    const F = Html5QrcodeSupportedFormats;
    // Solo los códigos de productos: así reconoce mucho más rápido que buscando todos los tipos
    const formatos = [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.ITF];
    const alLeer = (decodedText) => {
      if (decodedText && !scannerActive) {
        scannerActive = true;
        if (navigator.vibrate) navigator.vibrate(60);
        try { html5QrCode.stop(); } catch(e) {}
        cerrarScanner();
        processBarcode(decodedText);
        setTimeout(() => { scannerActive = false; }, 2000);
      }
    };
    const config = {
      fps: 25,
      // recuadro ancho y bajo, como un código de barras
      qrbox: (w, h) => ({ width: Math.floor(w * 0.88), height: Math.floor(Math.min(h * 0.42, w * 0.5)) }),
      disableFlip: true
    };
    try {
      html5QrCode = new Html5Qrcode("scanner-container", {
        formatsToSupport: formatos,
        experimentalFeatures: { useBarCodeDetectorIfSupported: true }, // usa el lector nativo del celu si existe (Android)
        verbose: false
      });
      try {
        // cámara trasera en buena resolución y con enfoque continuo
        await html5QrCode.start({ facingMode: "environment" }, Object.assign({}, config, {
          videoConstraints: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 }, advanced: [{ focusMode: "continuous" }] }
        }), alLeer, () => {});
      } catch (e1) {
        // si el celu no acepta esa configuración, arranca con la básica
        await html5QrCode.start({ facingMode: "environment" }, config, alLeer, () => {});
      }
    } catch(e) {
      document.getElementById('scanner-container').innerHTML = `<div style="color:white;text-align:center;padding:60px 20px;">❌ Error</div>`;
      toast("Error al iniciar cámara");
    }
  }
  function cerrarScanner() {
    if (html5QrCode && html5QrCode.isScanning) { try { html5QrCode.stop(); } catch(e) {} html5QrCode = null; }
    scannerActive = false;
    document.getElementById('scannerModal').classList.remove('open');
    document.getElementById('scanner-container').innerHTML = '<div class="scanner-guide"></div><div class="scanner-text">🔍 Apunta al código</div>';
  }

  /* ============================================================
     CONFIRM & SUBMIT
  ============================================================ */
  function askConfirm() {
    const name = document.getElementById('prodName').value.trim();
    const qty = parseInt(document.getElementById('prodQty').value) || 1;
    if (!name) { toast('Ingresá el nombre'); return; }
    const icon = document.getElementById('cIcon');
    const iconI = document.getElementById('cIconI');
    const title = document.getElementById('cTitle');
    const body = document.getElementById('cBody');
    const okBtn = document.getElementById('cOkBtn');
    if (action === 'add') {
      icon.className = 'confirm-icon add'; iconI.className = 'ti ti-arrow-up';
      title.textContent = 'Agregar al inventario';
      body.innerHTML = 'Vas a agregar <strong>' + qty + ' unidad' + (qty > 1 ? 'es' : '') + '</strong> de<br><strong>' + name + '</strong>';
      okBtn.className = 'confirm-ok add'; okBtn.textContent = 'Sí, agregar';
    } else {
      const item = inv.find(i => i.n.toLowerCase() === name.toLowerCase());
      if (!item) { toast('Producto no encontrado'); return; }
      if (item.q < qty) { toast('Stock insuficiente (' + item.q + ' disponibles)'); return; }
      icon.className = 'confirm-icon rem'; iconI.className = 'ti ti-arrow-down';
      title.textContent = 'Registrar consumo';
      body.innerHTML = 'Vas a consumir <strong>' + qty + ' unidad' + (qty > 1 ? 'es' : '') + '</strong> de<br><strong>' + name + '</strong><br><span style="font-size:12px;">Stock: ' + item.q + ' → ' + (item.q - qty) + '</span>';
      okBtn.className = 'confirm-ok rem'; okBtn.textContent = 'Sí, consumir';
    }
    document.getElementById('confirmModal').classList.add('open');
  }
  function confirmOk() { document.getElementById('confirmModal').classList.remove('open'); submit(); }
  function confirmCancel() { document.getElementById('confirmModal').classList.remove('open'); }

  function submit() {
    const name = document.getElementById('prodName').value.trim();
    const qty = parseInt(document.getElementById('prodQty').value) || 1;
    const barcode = document.getElementById('barcodeInput').value.trim() || null;
    if (!name) return;
    let item = inv.find(i => i.n.toLowerCase() === name.toLowerCase());
    if (action === 'add') {
      if (item) {
        item.q += qty;
        if (barcode && !item.barcode) item.barcode = barcode;
        // Si la cantidad sube, apagamos lowStock automáticamente
        if (item.q > 0) item.lowStock = false;
      } else {
        item = { id: Date.now().toString(), n: name, q: qty, barcode: barcode || undefined, category: categories[0], lowStock: false };
        inv.push(item);
      }
      toast('✅ ' + name + ' +' + qty);
    } else {
      if (!item || item.q < qty) return;
      item.q -= qty;
      // Si llega a 0, apagamos lowStock (ya está sin stock, distinto estado)
      if (item.q === 0) item.lowStock = false;
      toast('📉 ' + name + ' −' + qty);
    }
    save(item);
    document.getElementById('prodName').value = '';
    document.getElementById('prodQty').value = 1;
    document.getElementById('barcodeInput').value = '';
    hideSugg();
  }

  /* ============================================================
     RENDER INVENTARIO
  ============================================================ */
  function render() {
    const search = (document.getElementById('searchInput')?.value || '').toLowerCase();
    let filtered = search ? inv.filter(i => i.n.toLowerCase().includes(search)) : [...inv];
    if (currentFilter !== 'Todas') filtered = filtered.filter(i => i.category === currentFilter);
    filtered.sort((a, b) => a.n.localeCompare(b.n, 'es'));
    const list = document.getElementById('invList');
    if (!filtered.length) {
      list.innerHTML = '<div class="empty"><i class="ti ti-packages"></i><p>Sin productos</p></div>';
      return;
    }
    list.innerHTML = filtered.map(item => {
      const isZero = item.q === 0;
      const isLow = item.lowStock && !isZero;
      const qtyClass = isZero ? 'zero' : (isLow ? 'low' : '');
      const itemClass = isZero ? ' zero-stock' : (isLow ? ' low-stock' : '');
      return `<div class="inv-item${itemClass}">
        <span class="item-name">${escapeHtml(item.n)}</span>
        <div class="right-group">
          <span class="item-quantity ${qtyClass}">${item.q}</span>
          <div class="action-buttons">
            <button class="edit-btn" onclick="openEditModal('${item.id}')"><i class="ti ti-edit"></i></button>
            <button class="del-btn" onclick="del('${item.id}')"><i class="ti ti-trash"></i></button>
          </div>
        </div>
      </div>`;
    }).join('');
  }
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
  }

  /* ============================================================
     DELETE
  ============================================================ */
  let pendingDelId = null, pendingDelCat = null;
  function del(id) {
    const item = inv.find(i => i.id === id);
    if (!item) return;
    pendingDelId = id;
    document.getElementById('dTitle').textContent = 'Eliminar producto';
    document.getElementById('dBody').innerHTML = '¿Eliminar <strong>' + escapeHtml(item.n) + '</strong>?';
    document.getElementById('deleteModal').classList.add('open');
  }
  async function confirmDel() {
    document.getElementById('deleteModal').classList.remove('open');
    if (pendingDelCat) {
      const cat = pendingDelCat; pendingDelCat = null;
      const newCategories = categories.filter(c => c !== cat);
      await saveCategories(newCategories);
      inv.forEach(p => { if (p.category === cat) p.category = newCategories[0]; });
      await upsertAllProducts();
      if (currentFilter === cat) setFilter('Todas');
      render(); toast('🗑 Categoría eliminada');
    } else if (pendingDelId) {
      const id = pendingDelId; pendingDelId = null;
      inv = inv.filter(i => i.id !== id);
      localStorage.setItem('inv_v2', JSON.stringify(inv));
      deleteProductBackground(id);
      render(); updateAlerts(); toast('🗑 Eliminado');
    }
  }
  function cancelDel() { pendingDelId = null; pendingDelCat = null; document.getElementById('deleteModal').classList.remove('open'); }

  /* ============================================================
     EDIT MODAL
  ============================================================ */
  function openEditModal(id) {
    const item = inv.find(i => i.id === id);
    if (!item) return;
    editId = id;
    editQtyTemp = item.q;
    document.getElementById('editNameInput').value = item.n;
    document.getElementById('editQtyDisplay').innerText = editQtyTemp;
    updateCategorySelects();
    const catSelect = document.getElementById('editCategorySelect');
    if (catSelect && item.category) catSelect.value = item.category;
    // Switch lowStock
    const cb = document.getElementById('editLowStock');
    cb.checked = !!item.lowStock;
    updateSwitchRow(!!item.lowStock);
    document.getElementById('editModal').classList.add('open');
  }
  function adjustEditQty(delta) {
    const newVal = editQtyTemp + delta;
    if (newVal >= 0) {
      editQtyTemp = newVal;
      document.getElementById('editQtyDisplay').innerText = editQtyTemp;
      // Si la cantidad cambia, apagamos el switch
      const cb = document.getElementById('editLowStock');
      if (cb.checked) {
        cb.checked = false;
        updateSwitchRow(false);
      }
    }
  }
  function onLowStockToggle() {
    const cb = document.getElementById('editLowStock');
    updateSwitchRow(cb.checked);
  }
  function updateSwitchRow(isActive) {
    const row = document.getElementById('switchRow');
    if (isActive) row.classList.add('active-warn');
    else row.classList.remove('active-warn');
  }
  function saveEditChanges() {
    const newName = document.getElementById('editNameInput').value.trim();
    if (!newName) { toast('El nombre no puede estar vacío'); return; }
    const item = inv.find(i => i.id === editId);
    if (!item) { closeEditModal(); return; }
    if (inv.some(i => i.id !== editId && i.n.toLowerCase() === newName.toLowerCase())) {
      toast('Ya existe un producto con ese nombre'); return;
    }
    item.n = newName;
    item.q = editQtyTemp;
    item.category = document.getElementById('editCategorySelect').value;
    item.lowStock = document.getElementById('editLowStock').checked;
    // Si qty = 0, forzar lowStock a false
    if (item.q === 0) item.lowStock = false;
    // Guardado optimistic: cierra modal inmediatamente, sync en background
    closeEditModal();
    toast('✏️ Cambios guardados');
    save(item);
  }
  function closeEditModal() {
    editId = null;
    document.getElementById('editModal').classList.remove('open');
    document.getElementById('editNameInput').value = '';
  }

  /* ============================================================
     ALERTS — sin stock + poca cantidad
  ============================================================ */
  function updateAlerts() {
    // Sin stock
    const zeros = inv.filter(i => i.q === 0);
    const badge = document.getElementById('alertsBadge');
    const inner = document.getElementById('alertsInner');
    badge.textContent = zeros.length;
    badge.className = 'alerts-badge' + (zeros.length === 0 ? ' none' : '');
    inner.innerHTML = zeros.length === 0
      ? '<div style="color:var(--text2);font-size:0.875rem;"><i class="ti ti-check" style="margin-right:6px;color:var(--accent)"></i>Sin productos sin stock</div>'
      : zeros.map(i => `<div class="alert-item"><i class="ti ti-alert-circle"></i><span class="alert-item-name">${escapeHtml(i.n)}</span></div>`).join('');

    // Poca cantidad
    const lows = inv.filter(i => i.lowStock && i.q > 0);
    const warnBadge = document.getElementById('warnBadge');
    const warnInner = document.getElementById('warnInner');
    warnBadge.textContent = lows.length;
    warnBadge.className = 'alerts-badge' + (lows.length === 0 ? ' none' : ' warn');
    warnInner.innerHTML = lows.length === 0
      ? '<div style="color:var(--text2);font-size:0.875rem;"><i class="ti ti-check" style="margin-right:6px;color:var(--accent)"></i>Ningún producto con poca cantidad</div>'
      : lows.map(i => `<div class="warn-item"><i class="ti ti-alert-triangle"></i><span class="warn-item-name">${escapeHtml(i.n)}</span><span class="warn-item-qty">${i.q}</span></div>`).join('');
  }
  function toggleAlerts() { document.getElementById('alertsSection').classList.toggle('open'); }
  function toggleWarnSection() { document.getElementById('warnSection').classList.toggle('open'); }

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  /* ============================================================
     CONFIG MODAL
  ============================================================ */
  function openConfig() {
    document.querySelectorAll('.swatch').forEach(s => s.classList.toggle('sel', s.dataset.c === cfg.accent));
    document.getElementById('syncDot').className = 'sync-dot' + (fbOn ? ' on' : '');
    document.getElementById('syncLabel').textContent = fbOn ? 'Conectado ✓' : 'Solo local';
    updateThemeBtns();
    renderCategoriesList();
    document.getElementById('configModal').classList.add('open');
  }
  function closeConfig() { document.getElementById('configModal').classList.remove('open'); }
  function setAccent(el) {
    cfg.accent = el.dataset.c; cfg.accentD = el.dataset.d; cfg.accentL = el.dataset.l;
    applyAccent();
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('sel'));
    el.classList.add('sel');
    localStorage.setItem('cfg_v2', JSON.stringify(cfg));
  }
  let currentOpenSection = null;
  function toggleSection(sectionId) {
    const section = document.getElementById(sectionId);
    if (currentOpenSection && currentOpenSection !== sectionId) {
      const prevSection = document.getElementById(currentOpenSection);
      if (prevSection) prevSection.classList.remove('open');
    }
    section.classList.toggle('open');
    currentOpenSection = section.classList.contains('open') ? sectionId : null;
  }
  function scrollCats(dir) { const el = document.getElementById('categoriesScroll'); if (el) el.scrollBy({ top: dir * 60, behavior: 'smooth' }); }
  function scrollColorsCfg(dir) { const el = document.getElementById('colorsScroll'); if (el) el.scrollBy({ top: dir * 60, behavior: 'smooth' }); }
function scrollAlerts(dir) { const el = document.getElementById('alertsInner'); if (el) el.scrollBy({ top: dir * 60, behavior: 'smooth' }); }
function scrollWarn(dir) { const el = document.getElementById('warnInner'); if (el) el.scrollBy({ top: dir * 60, behavior: 'smooth' }); }
  /* ============================================================
     FIREBASE
  ============================================================ */
  function connectFb() {
    const el = document.getElementById('fbCfg'); const str = el ? el.value.trim() : '';
    if (!str) { toast('Pegá tu config'); return; }
    try {
      const parsed = JSON.parse(str);
      cfg.fbCfg = str;
      localStorage.setItem('cfg_v2', JSON.stringify(cfg));
      loadFb(parsed);
    } catch(e) { toast('JSON inválido'); }
  }
  function loadFb(parsed) {
    if (typeof firebase !== 'undefined') { initFb(parsed); return; }
    let loaded = 0;
    const scripts = [
      'https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js',
      'https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js'
    ];
    scripts.forEach(src => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = () => { if (++loaded === 2) initFb(parsed); };
      document.head.appendChild(s);
    });
  }
  function initFb(parsed) {
    try {
      if (!firebase.apps.length) firebase.initializeApp(parsed);
      db = firebase.firestore();
      fbOn = true;
      document.getElementById('syncDot').className = 'sync-dot on';
      document.getElementById('syncLabel').textContent = 'Conectado ✓';
      toast('🔥 Conectado');
      if (categoriesUnsubscribe) categoriesUnsubscribe();
      categoriesUnsubscribe = db.collection(FB_CAT).doc('lista').onSnapshot(async doc => {
        if (doc.exists && Array.isArray(doc.data().items) && doc.data().items.length > 0) {
          categories = doc.data().items;
          localStorage.setItem('categories_v2', JSON.stringify(categories));
          updateFilterSelect(); updateCategorySelects(); renderCategoriesList(); render();
        } else {
          try { await db.collection(FB_CAT).doc('lista').set({ items: categories }); } catch(e) {}
        }
      });
      if (invUnsubscribe) invUnsubscribe();
      invUnsubscribe = db.collection(FB_INV).onSnapshot(snap => {
        inv = snap.docs.map(d => ({
          id: d.id,
          n: d.data().n,
          q: d.data().q,
          barcode: d.data().barcode || null,
          category: d.data().category || categories[0],
          lowStock: d.data().lowStock || false
        }));
        localStorage.setItem('inv_v2', JSON.stringify(inv));
        render(); updateAlerts();
      });
      closeConfig();
    } catch(e) { toast('Error: ' + e.message); }
  }

  /* ============================================================
     INIT
  ============================================================ */
  applyAccent();
  initFontSizeSlider();
  document.documentElement.setAttribute('data-theme', cfg.theme === 'dark' ? 'dark' : 'light');
  updateAlerts();
  updateFilterSelect();
  { const fbc = window.getFbConfig && window.getFbConfig(); if (fbc) { try { loadFb(fbc); } catch(e) {} } }
  setTimeout(() => {
    const firstSection = document.getElementById('categoriesSection');
    if (firstSection) { firstSection.classList.add('open'); currentOpenSection = 'categoriesSection'; }
  }, 100);
</script>
</body>
