<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--accent:#1D9E75;--accent-dark:#0F6E56;--accent-light:#E1F5EE;--neg:#E24B4A;
        --bg:#f5f5f0;--surface:#fff;--surface2:#f5f5f0;--border:rgba(0,0,0,.1);--border2:rgba(0,0,0,.18);--text:#1a1a1a;--text2:#666;
        --juli:#DB2777;--juli-l:#FCE7F3;--ale:#0284C7;--ale-l:#E0F2FE;--dos:#7C3AED;--dos-l:#EDE9FE}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--surface:#1c1c1e;--surface2:#2c2c2e;--border:rgba(255,255,255,.1);--border2:rgba(255,255,255,.2);--text:#f5f5f5;--text2:#aaa;
    --juli:#F472B6;--juli-l:rgba(244,114,182,.16);--ale:#38BDF8;--ale-l:rgba(56,189,248,.16);--dos:#A78BFA;--dos-l:rgba(167,139,250,.16)}}
  :root[data-theme="dark"]{--bg:#111;--surface:#1c1c1e;--surface2:#2c2c2e;--border:rgba(255,255,255,.1);--border2:rgba(255,255,255,.2);--text:#f5f5f5;--text2:#aaa;
    --juli:#F472B6;--juli-l:rgba(244,114,182,.16);--ale:#38BDF8;--ale-l:rgba(56,189,248,.16);--dos:#A78BFA;--dos-l:rgba(167,139,250,.16)}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none !important}
  body{font-family:'Nunito',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh}
  .top{background:var(--surface);border-bottom:3px solid var(--accent);padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
  .top h1{font-size:1.1rem;color:var(--accent);font-weight:800;letter-spacing:.05em}
  main{max-width:560px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:12px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 96px)}
  input,select,button,textarea{font-family:inherit;color:var(--text)}
  .card{background:var(--surface);border:.5px solid var(--border);border-radius:18px;padding:14px}
  h2{font-size:.95rem;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  h2 i{color:var(--accent)}
  .btn{border:none;border-radius:14px;padding:13px;font-size:1rem;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:#fff;width:100%}
  .btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border2)}
  .btn.danger{background:var(--neg)}
  .btn:active{transform:scale(.97)}
  .vacio{text-align:center;color:var(--text2);padding:14px 0;font-weight:700}

  .nada{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:38px 18px}
  .nada .big{font-size:4.2rem;line-height:1}
  .nada b{font-size:1.2rem;font-weight:900}
  .nada p{color:var(--text2);font-weight:600;max-width:320px}
  .nada .btn{max-width:280px;margin-top:6px}
  .agregar{border:2px dashed var(--border2);background:none;padding:14px;font-weight:800;color:var(--accent);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-size:1rem}

  /* un desplegable por hijo */
  .acc{background:var(--surface);border:.5px solid var(--border);border-left:5px solid var(--accent);border-radius:18px;overflow:hidden}
  .acc-h{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;background:none;border:none;font-family:inherit;color:var(--text);cursor:pointer;text-align:left}
  .av{width:62px;height:62px;border-radius:8px 22px 8px 22px;background:#fff;border:1px solid var(--border);display:grid;place-items:center;font-size:2rem;flex-shrink:0;overflow:hidden}
  .av img{width:100%;height:100%;object-fit:cover}
  .acc-h .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .acc-h .tx b{font-size:1.15rem;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .acc-h .tx small{font-size:.8rem;color:var(--text2);font-weight:700}
  .acc-h .chev{color:var(--text2);transition:transform .2s;font-size:1.2rem}
  .acc.open>.acc-h .chev{transform:rotate(180deg)}
  .acc-b{display:none;flex-direction:column;gap:10px;padding:0 10px 12px}
  .acc.open>.acc-b{display:flex}

  .mini{border:none;background:var(--accent);color:#fff;padding:6px 11px;font-weight:800;font-size:.8rem;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-family:inherit}
  .mini.gris{background:var(--surface2);color:var(--text);border:1px solid var(--border2)}

  /* secciones (filas como en el perfil) */
  .secs{background:var(--surface2);border-radius:6px 20px 6px 20px;overflow:hidden}
  .sec{border-top:1px solid var(--border)}
  .sec:first-child{border-top:none}
  .sec-h{width:100%;display:flex;align-items:center;gap:12px;padding:12px;background:none;border:none;font-family:inherit;color:var(--text);cursor:pointer;text-align:left}
  .sec-h .ic{font-size:1.4rem;width:30px;text-align:center;flex-shrink:0}
  .sec-h .tx{flex:1;min-width:0}
  .sec-h .tx b{display:block;font-weight:900;font-size:1rem}
  .sec-h .tx small{display:block;color:var(--text2);font-weight:700;font-size:.78rem}
  .sec-h .chev{color:var(--text2);transition:transform .2s}
  .sec.open .sec-h .chev{transform:rotate(180deg)}
  .sec-b{display:none;padding:0 12px 12px;flex-direction:column;gap:8px}
  .sec.open .sec-b{display:flex}
  .datos{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .datos div{background:var(--surface);border-radius:4px 14px 4px 14px;padding:7px 9px;min-width:0}
  .datos small{display:block;font-size:.66rem;font-weight:900;color:var(--text2);letter-spacing:.04em}
  .datos b{display:block;font-size:.9rem;font-weight:800;overflow-wrap:anywhere;white-space:pre-wrap}
  .datos .w{grid-column:1/-1}
  .datos b.nd{color:var(--text2);font-weight:600}
  .fila{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:4px 14px 4px 14px;padding:9px 10px;cursor:pointer}
  .fila .ic{font-size:1.3rem;width:28px;text-align:center;flex-shrink:0}
  .fila .tx{flex:1;min-width:0}
  .fila .tx b{display:block;font-weight:800;font-size:.92rem}
  .fila .tx small{display:block;color:var(--text2);font-weight:700;font-size:.76rem;white-space:pre-wrap;overflow-wrap:anywhere}
  .est{font-size:.72rem;font-weight:900;border-radius:4px 12px 4px 12px;padding:3px 8px;white-space:nowrap;flex-shrink:0}
  .est.ok{background:var(--accent-light);color:var(--accent-dark)}
  .est.prox{background:#FEF3C7;color:#92400E}
  .est.pend{background:rgba(226,75,74,.14);color:var(--neg)}
  .est.gris{background:var(--surface2);color:var(--text2)}
  .acciones{display:flex;gap:8px}
  .acciones .btn{flex:1;padding:10px;font-size:.92rem}
  .med-top{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .med-top div{background:var(--surface);border-radius:4px 14px 4px 14px;padding:8px 10px}
  .med-top small{display:block;font-size:.66rem;font-weight:900;color:var(--text2);letter-spacing:.04em}
  .med-top b{font-size:1.3rem;font-weight:900}
  .med-top i{font-style:normal;font-size:.76rem;font-weight:700;color:var(--text2);margin-left:4px}
  .graf{background:var(--surface);border-radius:4px 14px 4px 14px;padding:8px 10px}
  .graf small{font-size:.7rem;font-weight:900;color:var(--text2);letter-spacing:.04em}
  .graf svg{width:100%;height:96px;display:block}
  .docs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .doc{background:var(--surface);border-radius:4px 14px 4px 14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
  .doc .pv{aspect-ratio:1;background:var(--accent-light);display:grid;place-items:center;font-size:2rem;overflow:hidden}
  .doc .pv img{width:100%;height:100%;object-fit:cover}
  .doc span{font-size:.7rem;font-weight:800;padding:5px 6px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .vacio{text-align:center;color:var(--text2);padding:8px 0;font-weight:700;font-size:.88rem}
  .sub-t{font-size:.7rem;font-weight:900;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;margin-top:4px}
  .foto-in{display:flex;align-items:center;gap:10px}
  .foto-in .av{width:56px;height:56px}
  .foto-in .tx{flex:1;font-size:.8rem;color:var(--text2);font-weight:700}
  .avs{display:grid;grid-template-columns:repeat(auto-fill,62px);grid-auto-rows:62px;justify-content:space-between;gap:8px;max-height:226px;overflow-y:auto;padding:2px}
  .avs button{width:62px;height:62px;min-height:62px;border:2.5px solid var(--border2) !important;background:#fff;cursor:pointer;padding:0;overflow:hidden;display:block;position:relative;-webkit-appearance:none;appearance:none}
  .avs button img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
  .avs button.on{border-color:var(--accent) !important;box-shadow:0 0 0 2px var(--accent-light)}
  .visor{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.88);display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px}
  .visor.show{display:flex}
  .visor img{max-width:100%;max-height:78dvh;object-fit:contain;border-radius:6px}
  .visor .bt{display:flex;gap:8px;width:100%;max-width:420px}
  .visor .bt .btn{flex:1}
  /* formularios */
  .bgm{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .bgm.show{display:flex}
  .sheet{background:var(--surface);width:100%;max-width:520px;max-height:92dvh;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:12px}
  @media (min-width:760px){.bgm{align-items:center}.sheet{border-radius:20px}}
  .sheet h3{text-align:center;font-weight:900}
  .lbl{font-size:.72rem;font-weight:800;color:var(--text2);letter-spacing:.03em;display:flex;flex-direction:column;gap:5px}
  .in{font-size:1rem;font-weight:700;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:10px;outline:none;width:100%;min-width:0}
  .in:focus{border-color:var(--accent)}
  textarea.in{resize:vertical;min-height:64px;font-weight:600}
  .dos{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
  .tipos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .tipos button{border:2px solid var(--border2);background:var(--surface);border-radius:12px;padding:7px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
  .tipos button i{font-style:normal;font-size:1.35rem}
  .tipos button span{font-size:.68rem;font-weight:800;line-height:1.1;text-align:center}
  .tipos button.on{border-color:var(--accent);background:var(--accent-light);color:var(--accent-dark)}
  .emos{display:flex;flex-wrap:wrap;gap:6px}
  .emos button{width:44px;height:44px;border-radius:12px;border:2px solid var(--border2);background:var(--surface);font-size:1.5rem;cursor:pointer}
  .emos button.on{border-color:var(--accent);background:var(--accent-light)}
  .ops{display:flex;flex-wrap:wrap;gap:6px}
  .ops button{border:2px solid var(--border2);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:800;font-size:.85rem;cursor:pointer}
  .ops button.on{border-color:var(--accent);background:var(--accent-light);color:var(--accent-dark)}
  .bt{display:flex;gap:8px}.bt .btn{flex:1}
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translate(-50%,20px);background:#1a1a1a;color:#fff;padding:10px 16px;border-radius:999px;font-weight:800;font-size:.9rem;opacity:0;pointer-events:none;transition:all .25s;z-index:60}
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>

<div class="top">
  <a class="home-link" href="index.html" aria-label="Volver al inicio"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.707 2.293l9 9c.63 .63 .184 1.707 -.707 1.707h-1v6a3 3 0 0 1 -3 3h-1v-7a3 3 0 0 0 -2.824 -2.995l-.176 -.005h-2a3 3 0 0 0 -3 3v7h-1a3 3 0 0 1 -3 -3v-6h-1c-.89 0 -1.337 -1.077 -.707 -1.707l9 -9a1 1 0 0 1 1.414 0m.293 11.707a1 1 0 0 1 1 1v7h-4v-7a1 1 0 0 1 .883 -.993l.117 -.007z"/></svg></a>
  <h1>HIJOS</h1>
</div>
<main id="main"></main>

<!-- formulario genérico -->
<div class="bgm" id="fm" onclick="if(event.target===this)cerrarForm()">
  <form class="sheet" id="fmF" onsubmit="event.preventDefault();guardarForm()"></form>
</div>
<!-- ver una foto o documento -->
<div class="visor" id="visor" onclick="if(event.target===this)cerrarVisor()">
  <b id="visorNom" style="color:#fff;font-weight:900;text-align:center"></b>
  <img id="visorImg" alt="">
  <div id="visorPdf" style="font-size:5rem" hidden>📄</div>
  <div class="bt"><button type="button" class="btn ghost" onclick="cerrarVisor()">Cerrar</button><a class="btn" id="visorAbrir" target="_blank" rel="noopener">Abrir</a></div>
  <div class="bt"><button type="button" class="btn ghost" onclick="editarVisor()"><i class="ti ti-pencil"></i> Editar</button><button type="button" class="btn danger" onclick="eliminarVisor()"><i class="ti ti-trash"></i> Eliminar</button></div>
</div>

<script>
/* ===== Hijos: datos, salud, vacunas, crecimiento, documentos, y fechas importantes ===== */
const rd=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const snd=n=>{try{window.sonido&&sonido(n)}catch(e){}};
const p2=n=>String(n).padStart(2,'0');
const f2s=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const s2f=s=>{const[a,m,d]=s.split('-').map(Number);return new Date(a,m-1,d)};
const hoyS=()=>f2s(new Date());
const nid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const $=id=>document.getElementById(id);
const fLarga=s=>s?s2f(s).toLocaleDateString('es-AR',{day:'numeric',month:'long',year:'numeric'}):'';
const fCorta=s=>s?s2f(s).toLocaleDateString('es-AR',{day:'numeric',month:'short',year:s.slice(0,4)===String(new Date().getFullYear())?undefined:'numeric'}):'';
const dias=s=>Math.round((s2f(s)-s2f(hoyS()))/864e5);
const num=v=>{const n=parseFloat(String(v||'').replace(',','.'));return n>0?n:0};
const coma=n=>String(n).replace('.',',');
const enJuntos=()=>typeof window.__jxValor==='function';
const URLA=id=>'../api/?a=archivo&id='+encodeURIComponent(id);

/* datos: una colección por cosa (como el resto de la app) */
const COLS={hijos:'hijos',vac:'hijo_vac',med:'hijo_med',doc:'hijo_doc',fecha:'hijo_fecha'};
const D={};Object.entries(COLS).forEach(([k,c])=>D[k]=rd(c+'_v1',{}));
let db=null,abierto=rd('hijo_abierto',null),secAbierta=rd('hijo_sec','');
function guardar(k,o){D[k][o.id]=o;wr(COLS[k]+'_v1',D[k]);if(db)db.collection(COLS[k]).doc(o.id).set(o).catch(()=>{});}
function borrar(k,id){delete D[k][id];wr(COLS[k]+'_v1',D[k]);if(db)db.collection(COLS[k]).doc(id).delete().catch(()=>{});}
const de=(k,h)=>Object.values(D[k]).filter(x=>x.hijo===h);

/* ---------- cálculos ---------- */
function edad(nac){if(!nac)return '';const n=s2f(nac),h=new Date();let m=(h.getFullYear()-n.getFullYear())*12+h.getMonth()-n.getMonth();if(h.getDate()<n.getDate())m--;
  if(m<0)return '';if(m<24)return m+(m===1?' mes':' meses');const a=Math.floor(m/12);return a+(a===1?' año':' años');}
function proxCumple(nac){if(!nac)return null;const n=s2f(nac),h=s2f(hoyS());let c=new Date(h.getFullYear(),n.getMonth(),n.getDate());if(c<h)c=new Date(h.getFullYear()+1,n.getMonth(),n.getDate());
  return {fecha:f2s(c),cumple:c.getFullYear()-n.getFullYear()};}
// Estado de cada vacuna: aplicada (tiene fecha), próxima (todavía no, pero con fecha a futuro) o pendiente (sin fecha o ya vencida)
function estVac(v){if(v.fecha)return ['ok','✅ Aplicada'];if(v.prox&&dias(v.prox)>=0)return ['prox','🕒 Próxima'];return ['pend','⚠️ Pendiente'];}
// Próximas dosis: de las vacunas aplicadas con "próxima dosis", si todavía no se cargó otra aplicada de la misma vacuna después
function proximasVac(h){const vs=de('vac',h);const out=[];
  vs.forEach(v=>{if(!v.prox)return;
    if(v.fecha&&vs.some(o=>o!==v&&o.fecha&&o.fecha>=v.prox&&norm(o.nombre)===norm(v.nombre)))return;
    if(v.fecha&&vs.some(o=>o!==v&&!o.fecha&&norm(o.nombre)===norm(v.nombre)))return;   // ya hay una cargada como pendiente
    out.push({fecha:v.prox,titulo:'💉 '+v.nombre+(v.fecha?' · próxima dosis':''),id:v.id,tipo:'vac'});});
  return out;}
const norm=s=>String(s||'').trim().toLowerCase();
const TF={control:['🩺','Control pediátrico'],turno:['🏥','Turno médico'],escolar:['🎒','Inscripción escolar'],colegio:['🏫','Evento del colegio'],otro:['📌','Otro']};
function fechasDe(h){const c=D.hijos[h],out=[];
  const pc=proxCumple(c&&c.nac);if(pc)out.push({fecha:pc.fecha,titulo:'🎂 Cumple '+pc.cumple+(pc.cumple===1?' año':' años'),tipo:'cumple'});
  proximasVac(h).forEach(x=>out.push(x));
  de('fecha',h).forEach(f=>out.push({fecha:f.fecha,hora:f.hora,titulo:TF[f.tipo]?TF[f.tipo][0]+' '+(f.titulo||TF[f.tipo][1]):'📌 '+(f.titulo||''),notas:f.notas,id:f.id,tipo:'fecha'}));
  return out.sort((a,b)=>(a.fecha+(a.hora||'')).localeCompare(b.fecha+(b.hora||'')));}
function etiqueta(s){const d=dias(s);if(d<0)return ['pend',d===-1?'Ayer':'Hace '+(-d)+' días'];if(d===0)return ['ok','Hoy'];if(d===1)return ['prox','Mañana'];if(d<=30)return ['prox','En '+d+' días'];return ['gris',fCorta(s)];}

/* ---------- pantalla ---------- */
const SECS=[
  ['personal','👤','Información personal','Datos, DNI, nacimiento y tipo de sangre'],
  ['salud','❤️','Salud','Alergias, medicamentos y médicos'],
  ['vacunas','💉','Vacunas y controles','Registro y próximos vencimientos'],
  ['crec','📈','Crecimiento','Altura, peso e historial'],
  ['docs','📁','Documentos','Fotos, certificados y archivos'],
  ['fechas','📅','Fechas importantes','Cumpleaños, controles, turnos y colegio']];
const BEBES=Array.from({length:28},(_,i)=>'bebe'+String(i+1).padStart(2,'0'));
const avURL=a=>'img/avatares/'+a+'.webp';
function avatar(c){return c.avatar?`<img src="${avURL(c.avatar)}" alt="">`:c.foto?`<img src="${URLA(c.foto)}" alt="">`:esc(c.emoji||'🧒');}
function render(){
  const hs=Object.values(D.hijos).sort((a,b)=>(a.creado||0)-(b.creado||0));
  if(!hs.length){$('main').innerHTML=`<section class="card nada"><div class="big">🧒</div><b>Todavía no hay hijos cargados</b>

function grafico(L,u){const W=320,H=96,pad=10,xs=L.map(r=>s2f(r.fecha).getTime()),ys=L.map(r=>r[u]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),dy=(y1-y0)||1;
  const pts=L.map((r,i)=>[pad+(x1===x0?.5:(xs[i]-x0)/(x1-x0))*(W-2*pad),H-pad-((r[u]-y0)/dy)*(H-2*pad)]);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--surface)" stroke="var(--accent)" stroke-width="2.5" vector-effect="non-scaling-stroke"/>`).join('')}</svg>`;}

/* ---------- formulario genérico ---------- */
let FORM=null;
// campos: [clave, etiqueta, tipo, extra]  tipos: text, date, time, tel, num, area, sel (extra = opciones), foto, archivo, emoji
function abrirForm(o){FORM=Object.assign({archivos:{}},o);

function campo([k,l,t,x],v){const val=v[k]??'',id='f_'+k;
  if(t==='avatares'){FORM.archivos[k]=val||BEBES[0];return `<div class="lbl">${l}<div class="avs" id="${id}">${BEBES.map(a=>`<button type="button" class="${a===FORM.archivos[k]?'on':''}" onclick="FORM.archivos['${k}']='${a}';[...this.parentNode.children].forEach(b=>b.classList.toggle('on',b===this))" aria-label="Avatar"><img src="${avURL(a)}" alt="" loading="lazy"></button>`).join('')}</div></div>`;}
  if(t==='area')return `<label class="lbl">${l}<textarea class="in" id="${id}" maxlength="800">${esc(val)}</textarea></label>`;
  if(t==='sel')return `<label class="lbl">${l}<select class="in" id="${id}">${x.map(o=>{const[a,b]=Array.isArray(o)?o:[o,o];return `<option value="${esc(a)}"${a===val?' selected':''}>${esc(b)}</option>`}).join('')}</select></label>`;
  if(t==='foto'||t==='archivo'){FORM.archivos[k]=val||'';const esPdf=v[k+'Mime']==='application/pdf';
    return `<div class="lbl">${l}<div class="foto-in"><span class="av" id="${id}_pv">${val?(esPdf?'📄':`<img src="${URLA(val)}" alt="">`):(t==='foto'?esc(v.emoji||'🧒'):'📎')}</span>
      <span class="tx" id="${id}_tx">${val?'Archivo cargado':'Sacale una foto o elegila de la galería'}</span>
      <button type="button" class="mini" onclick="elegirArchivo('${k}','${t}')">${val?'Cambiar':'Subir'}</button>${val?`<button type="button" class="mini gris" onclick="quitarArchivo('${k}','${t}')">Quitar</button>`:''}</div></div>`;}
  const tp={date:'date',time:'time',tel:'tel',num:'text'}[t]||'text',im=t==='num'?' inputmode="decimal"':t==='tel'?' inputmode="tel"':'';
  return `<label class="lbl">${l}<input class="in" id="${id}" type="${tp}"${im} value="${esc(val)}" maxlength="120" autocomplete="off"${x&&x.ph?` placeholder="${esc(x.ph)}"`:''}></label>`;}
function leerForm(){const o={};FORM.campos.forEach(c=>{const L=c[2]==='dos'?c[3]:[c];L.forEach(([k,l,t])=>{
  if(t==='foto'||t==='archivo'||t==='avatares'){o[k]=FORM.archivos[k]||'';if(FORM.archivos[k+'Mime'])o[k+'Mime']=FORM.archivos[k+'Mime'];return;}
  const el=$('f_'+k);if(el)o[k]=t==='num'?num(el.value):el.value.trim();});});return o;}
async function guardarForm(){const o=leerForm();if(FORM.requerido&&!o[FORM.requerido]){$('f_'+FORM.requerido).focus();return}

let elegido=null;
function elegirArchivo(k,t){if(!enJuntos()){alert('Las fotos y documentos se guardan en tu cuenta de JuntOS. Abrí la app desde JuntOS para subirlos.');return}
  elegido={k,t};const fi=$('fileIn');fi.accept='image/*';fi.value='';fi.click();}
$('fileIn').addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];if(!f||!FORM||!elegido)return;const {k,t}=elegido;
  const tx=$('f_'+k+'_tx');tx.textContent='Subiendo…';FORM.subiendo=true;
  try{if(!/^image\//.test(f.type||'image/'))throw new Error('solo se pueden subir fotos');const r=await subir(f);FORM.archivos[k]=r.id;FORM.archivos[k+'Mime']=r.tipo;
    $('f_'+k+'_pv').innerHTML=r.tipo==='application/pdf'?'📄':`<img src="${URLA(r.id)}" alt="">`;tx.textContent='¡Listo! Archivo cargado';snd('agregar');}

  FORM&&(FORM.subiendo=false);});
function quitarArchivo(k,t){if(!FORM)return;FORM.archivos[k]='';FORM.archivos[k+'Mime']='';$('f_'+k+'_pv').innerHTML=t==='foto'?'🧒':'📎';$('f_'+k+'_tx').textContent='Se borra al tocar Guardar';}
/* Fotos lo más livianas posible pero legibles: lado mayor 1280px, WebP (o JPEG si el celu no puede). Quedan en ~80-200 KB. */
async function subir(file){
  let blob=await achicar(file,1280);
  if(blob.size>3*1024*1024)throw new Error('la foto es muy grande');
  const fd=new FormData();fd.append('f',blob,'foto'+(blob.type==='image/webp'?'.webp':'.jpg'));
  const r=await fetch('../api/?a=archivo_subir',{method:'POST',credentials:'same-origin',headers:{'X-Juntos':'1'},body:fd});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('error '+r.status));return j;}
function achicar(file,max){return new Promise((ok,ko)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
    c.toBlob(b=>{if(b&&b.type==='image/webp')return ok(b);c.toBlob(j=>j?ok(j):ko(new Error('no se pudo leer la foto')),'image/jpeg',.68);},'image/webp',.62);};
  im.onerror=()=>{URL.revokeObjectURL(u);ko(new Error('no se pudo leer la foto'));};im.src=u;});}
function borrarArchivo(id){if(id&&enJuntos())fetch('../api/?a=archivo_borrar',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-Juntos':'1'},body:JSON.stringify({id})}).catch(()=>{});}

    guardar:o=>{if(!o.fecha||(!o.peso&&!o.altura)){toast('Poné la fecha y el peso o la altura');return false}
      const n=Object.assign({},m||{id:nid('m'),hijo,creado:Date.now()},o);guardar('med',n);snd(m?'aceptar':'agregar');},
    borrar:m?()=>{if(!confirm('¿Eliminar esta medición?'))return;borrar('med',m.id);cerrarForm();render();snd('borrar');}:null});}
const TD={dni_f:'DNI (frente)',dni_d:'DNI (dorso)',partida:'Partida de nacimiento',carnet:'Carnet de vacunas',cert_nac:'Certificado de nacimiento',obra:'Obra social',cert_med:'Certificado médico',otro:'Otro documento'};
function formDoc(hijo,id){const d=id?D.doc[id]:null;
  abrirForm({titulo:d?'Documento':'Nuevo documento',valores:d?Object.assign({},d,{archivoMime:d.mime}):null,
    campos:[['tipo','QUÉ ES','sel',Object.entries(TD)],['nombre','NOMBRE (OPCIONAL)','text',{ph:'Ej: Apto físico 2026'}],['archivo','FOTO DEL DOCUMENTO','archivo']],
    guardar:o=>{if(!o.archivo){toast('Sacale una foto al documento');return false}
      const n=Object.assign({},d||{id:nid('d'),hijo,creado:Date.now()},{tipo:o.tipo,nombre:o.nombre,archivo:o.archivo,mime:o.archivoMime||(d&&d.mime)||'image/jpeg'});
      cambioArchivo(d&&d.archivo,n.archivo);guardar('doc',n);snd(d?'aceptar':'agregar');},
    borrar:d?()=>{if(!confirm('¿Eliminar este documento?'))return;borrarArchivo(d.archivo);borrar('doc',d.id);cerrarForm();cerrarVisor();render();snd('borrar');}:null});}
function verDoc(id){const d=D.doc[id];if(!d)return;const pdf=d.mime==='application/pdf';
  $('visorImg').hidden=pdf;$('visorPdf').hidden=!pdf;$('visorNom').textContent=d.nombre||TD[d.tipo]||'Documento';
  if(!pdf)$('visorImg').src=URLA(d.archivo);$('visorAbrir').href=URLA(d.archivo);
  $('visor').dataset.id=id;$('visor').classList.add('show');}
function eliminarVisor(){const d=D.doc[$('visor').dataset.id];if(!d||!confirm('¿Eliminar "'+(d.nombre||TD[d.tipo]||'documento')+'"? Se borra del servidor.'))return;
  borrarArchivo(d.archivo);borrar('doc',d.id);cerrarVisor();render();snd('borrar');toast('Documento eliminado');}
function editarVisor(){const d=D.doc[$('visor').dataset.id];cerrarVisor();if(d)formDoc(d.hijo,d.id);}
function cerrarVisor(){$('visor').classList.remove('show');}
function formFecha(hijo,id,tipo){const f=id?D.fecha[id]:null;
  abrirForm({titulo:f?'Fecha importante':'Nueva fecha',valores:f||{tipo:tipo||'control'},requerido:'fecha',
    campos:[['tipo','QUÉ ES','sel',Object.entries(TF).map(([k,v])=>[k,v[0]+' '+v[1]])],['titulo','DETALLE (OPCIONAL)','text',{ph:'Ej: Dentista, acto del 25 de mayo'}],
      ['x','','dos',[['fecha','FECHA','date'],['hora','HORA (OPCIONAL)','time']]],['notas','NOTAS','area']],
    guardar:o=>{if(!o.fecha){toast('Poné la fecha');return false}const n=Object.assign({},f||{id:nid('f'),hijo,creado:Date.now()},o);guardar('fecha',n);snd(f?'aceptar':'agregar');
      if(dias(n.fecha)>=0)toast('Te avisamos el día anterior y ese día');},
    borrar:f?()=>{if(!confirm('¿Eliminar esta fecha?'))return;borrar('fecha',f.id);cerrarForm();render();snd('borrar');}:null});}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2600);}

/* ---------- sincronización ---------- */
function loadScript(src){return new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
async function initFb(){
  const c=window.getFbConfig&&window.getFbConfig();if(!c)return;
  try{
    if(typeof firebase==='undefined'){
      await loadScript('https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js');
      await loadScript('https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js');
    }
    if(!firebase.apps.length)firebase.initializeApp(c);
    db=firebase.firestore();
    Object.entries(COLS).forEach(([k,col])=>{let primera=true;
      db.collection(col).onSnapshot(snap=>{
        const r={};snap.docs.forEach(d=>{const x=d.data();if(x)r[d.id]=Object.assign({},x,{id:d.id})});
        if(primera&&!snap.docs.length&&Object.keys(D[k]).length){Object.values(D[k]).forEach(x=>db.collection(col).doc(x.id).set(x).catch(()=>{}));primera=false;return}
        primera=false;D[k]=r;wr(col+'_v1',r);if(!FORM)render();
      },()=>{});});
  }catch(e){}
}
render();desdeLink();initFb();
</script>
